name: Compilar Firmware CYD ST7789

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repositorio principal de LVGL Micropython
      uses: actions/checkout@v4
      with:
        repository: kdschlosser/lvgl_micropython
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build gperf libffi-dev libssl-dev dfu-util libusb-1.0-0 build-essential git wget curl

    - name: Compilar Firmware para ESP32 CYD con make.py
      run: |
        python3 make.py esp32 submodules mpy_cross BOARD=ESP32_GENERIC DISPLAY=st7789 INDEV=xpt2046 --flash-size=4 --optimize-size

    - name: Recopilar binarios generados para el Artifact
      run: |
        mkdir -p final_firmware
        
        # Buscamos y copiamos todos los binarios clave que genera ESP-IDF / MicroPython
        find . -type f \( -name "bootloader.bin" -o -name "partition-table.bin" -o -name "micropython.bin" -o -name "firmware.bin" \) -exec cp {} final_firmware/ \;
        
        ls -la final_firmware/

    - name: Subir binarios como Artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-cyd-st7789
        path: final_firmware/
