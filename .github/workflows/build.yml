name: Compilar LVGL MicroPython - CYD ST7789 + IP clientes

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Clonar LVGL MicroPython
        run: |
          git clone --recursive https://github.com/lvgl-micropython/lvgl_micropython.git .

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            libusb-1.0-0-dev

      - name: Parchear network_wlan.c
        run: |
          cat > patch.py <<'PY'
          from pathlib import Path

          path = Path(
              "lib/micropython/ports/esp32/network_wlan.c"
          )

          if not path.exists():
              raise SystemExit(f"No existe: {path}")

          text = path.read_text()

          include = '#include "esp_wifi_ap_get_sta_list.h"'

          if include not in text:
              marker = '#include "esp_wifi.h"'

              if marker not in text:
                  raise SystemExit(
                      'No se encontró #include "esp_wifi.h"'
                  )

              text = text.replace(
                  marker,
                  marker + "\n" + include,
                  1
              )

          marker = (
              "        case (uintptr_t)MP_OBJ_NEW_QSTR("
              "MP_QSTR_rssi): {"
          )

          if marker not in text:
              raise SystemExit(
                  "No se encontró MP_QSTR_rssi"
              )

          if "MP_QSTR_stations_ip" not in text:

              code = """
                  case (uintptr_t)MP_OBJ_NEW_QSTR(MP_QSTR_stations_ip): {
                      require_if(args[0], ESP_IF_WIFI_AP);

                      wifi_sta_list_t station_list = {0};
                      wifi_sta_mac_ip_list_t ip_list = {0};

                      esp_exceptions(
                          esp_wifi_ap_get_sta_list(&station_list)
                      );

                      esp_exceptions(
                          esp_wifi_ap_get_sta_list_with_ip(
                              &station_list,
                              &ip_list
                          )
                      );

                      mp_obj_t list = mp_obj_new_list(0, NULL);

                      for (int i = 0; i < ip_list.num; ++i) {
                          char ip[16];

                          snprintf(
                              ip,
                              sizeof(ip),
                              "%u.%u.%u.%u",
                              ip_list.sta[i].ip.addr & 0xff,
                              (ip_list.sta[i].ip.addr >> 8) & 0xff,
                              (ip_list.sta[i].ip.addr >> 16) & 0xff,
                              (ip_list.sta[i].ip.addr >> 24) & 0xff
                          );

                          mp_obj_t tuple[2];

                          tuple[0] = mp_obj_new_bytes(
                              ip_list.sta[i].mac,
                              6
                          );

                          tuple[1] = mp_obj_new_str(
                              ip,
                              strlen(ip)
                          );

                          mp_obj_list_append(
                              list,
                              mp_obj_new_tuple(2, tuple)
                          );
                      }

                      return list;
                  }
              """

              text = text.replace(
                  marker,
                  code + "\n" + marker,
                  1
              )

          path.write_text(text)

          final_text = path.read_text()

          if "esp_wifi_ap_get_sta_list_with_ip" not in final_text:
              raise SystemExit(
                  "El parche de ESP-IDF no quedó aplicado"
              )

          if "MP_QSTR_stations_ip" not in final_text:
              raise SystemExit(
                  "MP_QSTR_stations_ip no quedó aplicado"
              )

          print("================================")
          print("PARCHE APLICADO")
          print("================================")
          print("stations_ip: OK")
          print("ESP-IDF API: OK")
          PY

          python3 patch.py

      - name: Compilar firmware ESP32
        id: compile
        run: |
          set -o pipefail

          python3 make.py esp32 \
            BOARD=ESP32_GENERIC \
            DISPLAY=st7789 \
            INDEV=xpt2046 \
            --flash-size=4 \
            --optimize-size \
            --ccache \
            LV_CFLAGS="-DLV_USE_IMAGE=1" \
            2>&1 | tee build.log

      - name: Localizar firmware generado
        if: success()
        run: |
          echo "========================================"
          echo "BUSCANDO FIRMWARE"
          echo "========================================"

          echo
          echo "Archivos BIN:"
          find . \
            -type f \
            -name "*.bin" \
            -print \
            | sort

          echo
          echo "========================================"
          echo "FIRMWARE LVGL"
          echo "========================================"

          FOUND=""

          for file in \
            build/lvgl_micropy_ESP32_GENERIC-4.bin \
            build/lvgl_micropy_ESP32_GENERIC.bin
          do
            if [ -f "$file" ]; then
              FOUND="$file"
              break
            fi
          done

          if [ -z "$FOUND" ]; then
            FOUND=$(find build \
              -maxdepth 1 \
              -type f \
              -name "lvgl_micropy_*.bin" \
              | head -n 1)
          fi

          if [ -z "$FOUND" ]; then
            echo
            echo "ERROR: NO SE ENCONTRÓ EL FIRMWARE LVGL"
            echo
            echo "Contenido de build/:"
            find build -maxdepth 2 -type f | sort

            echo
            echo "Últimas líneas de build.log:"
            tail -n 200 build.log

            exit 1
          fi

          echo
          echo "Firmware encontrado:"
          echo "$FOUND"

          mkdir -p final_firmware

          cp "$FOUND" final_firmware/firmware.bin

          echo
          echo "Copiado como:"
          echo "final_firmware/firmware.bin"

      - name: Copiar binarios auxiliares
        if: success()
        run: |
          BUILD_DIR="lib/micropython/ports/esp32/build-ESP32_GENERIC"

          echo "========================================"
          echo "BINARIOS AUXILIARES"
          echo "========================================"

          if [ -f "$BUILD_DIR/micropython.bin" ]; then
            cp "$BUILD_DIR/micropython.bin" \
              final_firmware/micropython.bin

            echo "micropython.bin: OK"
          else
            echo "micropython.bin: no disponible"
          fi

          if [ -f "$BUILD_DIR/bootloader/bootloader.bin" ]; then
            cp "$BUILD_DIR/bootloader/bootloader.bin" \
              final_firmware/bootloader.bin

            echo "bootloader.bin: OK"
          fi

          if [ -f "$BUILD_DIR/partition_table/partition-table.bin" ]; then
            cp "$BUILD_DIR/partition_table/partition-table.bin" \
              final_firmware/partition-table.bin

            echo "partition-table.bin: OK"
          fi

          echo
          echo "========================================"
          echo "RESULTADO"
          echo "========================================"

          ls -lh final_firmware/

      - name: Subir Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-cyd-st7789
          path: final_firmware/

      - name: Subir Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            lib/micropython/ports/esp32/build-ESP32_GENERIC/log/
          if-no-files-found: warn
