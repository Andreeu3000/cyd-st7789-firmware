name: Compilar LVGL MicroPython - CYD ST7789

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CLONAR LVGL MICROPYTHON
      # =====================================================

      - name: Clonar LVGL MicroPython
        run: |
          git clone https://github.com/lvgl-micropython/lvgl_micropython.git .

      # =====================================================
      # PYTHON
      # =====================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =====================================================
      # DEPENDENCIAS
      # =====================================================

      - name: Instalar dependencias
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            python3 \
            python3-venv \
            libusb-1.0-0-dev

      # =====================================================
      # CONFIGURAR LVGL
      # =====================================================

      - name: Configurar funciones LVGL
        run: |

          echo "=========================================="
          echo "CONFIGURANDO LVGL"
          echo "=========================================="

          echo ""
          echo "CONFIGURACION ORIGINAL"
          echo "=========================================="

          grep -E \
            'LV_USE_IMAGE|LV_USE_TJPGD|LV_USE_FS_MEMFS|LV_USE_LODEPNG|LV_USE_BMP|LV_USE_GIF|LV_USE_QRCODE|LV_USE_BARCODE|LV_USE_RLE|LV_USE_TINY_TTF|LV_TINY_TTF_FILE_SUPPORT|LV_USE_LIBJPEG_TURBO|LV_USE_LIBPNG|LV_USE_LIBWEBP|LV_USE_FREETYPE' \
            lib/lv_conf.h || true

          # =================================================
          # IMAGE
          # =================================================

          sed -i \
            's/^#define LV_USE_IMAGE .*/#define LV_USE_IMAGE 1/' \
            lib/lv_conf.h

          # =================================================
          # JPEG / TJPGD
          # =================================================

          sed -i \
            's/^#define LV_USE_TJPGD .*/#define LV_USE_TJPGD 1/' \
            lib/lv_conf.h

          # =================================================
          # MEMFS
          #
          # Necesario para JPEG desde memoria
          # =================================================

          sed -i \
            's/^#define LV_USE_FS_MEMFS .*/#define LV_USE_FS_MEMFS 1/' \
            lib/lv_conf.h

          # =================================================
          # PNG
          # =================================================

          sed -i \
            's/^#define LV_USE_LODEPNG .*/#define LV_USE_LODEPNG 1/' \
            lib/lv_conf.h

          # =================================================
          # BMP
          # =================================================

          sed -i \
            's/^#define LV_USE_BMP .*/#define LV_USE_BMP 1/' \
            lib/lv_conf.h

          # =================================================
          # GIF
          # =================================================

          sed -i \
            's/^#define LV_USE_GIF .*/#define LV_USE_GIF 1/' \
            lib/lv_conf.h

          # =================================================
          # QR
          # =================================================

          sed -i \
            's/^#define LV_USE_QRCODE .*/#define LV_USE_QRCODE 1/' \
            lib/lv_conf.h

          # =================================================
          # BARCODE
          # =================================================

          sed -i \
            's/^#define LV_USE_BARCODE .*/#define LV_USE_BARCODE 1/' \
            lib/lv_conf.h

          # =================================================
          # RLE
          # =================================================

          sed -i \
            's/^#define LV_USE_RLE .*/#define LV_USE_RLE 1/' \
            lib/lv_conf.h

          # =================================================
          # TINY TTF
          # =================================================

          sed -i \
            's/^#define LV_USE_TINY_TTF .*/#define LV_USE_TINY_TTF 1/' \
            lib/lv_conf.h

          # =================================================
          # TTF DESDE ARCHIVO
          # =================================================

          sed -i \
            's/^#define LV_TINY_TTF_FILE_SUPPORT .*/#define LV_TINY_TTF_FILE_SUPPORT 1/' \
            lib/lv_conf.h

          # =================================================
          # DESACTIVAR LIBJPEG TURBO
          # =================================================

          sed -i \
            's/^#define LV_USE_LIBJPEG_TURBO .*/#define LV_USE_LIBJPEG_TURBO 0/' \
            lib/lv_conf.h

          # =================================================
          # DESACTIVAR LIBPNG
          # =================================================

          sed -i \
            's/^#define LV_USE_LIBPNG .*/#define LV_USE_LIBPNG 0/' \
            lib/lv_conf.h

          # =================================================
          # DESACTIVAR WEBP
          # =================================================

          sed -i \
            's/^#define LV_USE_LIBWEBP .*/#define LV_USE_LIBWEBP 0/' \
            lib/lv_conf.h

          # =================================================
          # DESACTIVAR FREETYPE
          # =================================================

          sed -i \
            's/^#define LV_USE_FREETYPE .*/#define LV_USE_FREETYPE 0/' \
            lib/lv_conf.h

          # =================================================
          # CONFIGURACION FINAL
          # =================================================

          echo ""
          echo "=========================================="
          echo "CONFIGURACION FINAL"
          echo "=========================================="

          grep -E \
            'LV_USE_IMAGE|LV_USE_TJPGD|LV_USE_FS_MEMFS|LV_USE_LODEPNG|LV_USE_BMP|LV_USE_GIF|LV_USE_QRCODE|LV_USE_BARCODE|LV_USE_RLE|LV_USE_TINY_TTF|LV_TINY_TTF_FILE_SUPPORT|LV_USE_LIBJPEG_TURBO|LV_USE_LIBPNG|LV_USE_LIBWEBP|LV_USE_FREETYPE' \
            lib/lv_conf.h

      # =====================================================
      # LIMPIAR
      # =====================================================

      - name: Limpiar compilación
        run: |
          python3 make.py esp32 clean

      # =====================================================
      # COMPILAR
      # =====================================================

      - name: Compilar firmware
        run: |

          python3 make.py esp32 \
            BOARD=ESP32_GENERIC \
            DISPLAY=st7789 \
            INDEV=xpt2046 \
            --flash-size=4 \
            --optimize-size

      # =====================================================
      # INSPECCIONAR BUILD
      # =====================================================

      - name: Inspeccionar build
        if: always()
        run: |

          echo "=========================================="
          echo "ESTRUCTURA DEL BUILD"
          echo "=========================================="

          find lib/micropython/ports/esp32/build-ESP32_GENERIC \
            -maxdepth 3 \
            -type f \
            \( \
              -name "*.bin" \
              -o \
              -name "*.elf" \
            \) \
            -printf "%s bytes -> %p\n" \
            | sort -n

          echo ""
          echo "=========================================="
          echo "ARCHIVOS PRINCIPALES"
          echo "=========================================="

          find lib/micropython/ports/esp32/build-ESP32_GENERIC \
            -type f \
            \( \
              -name "micropython.bin" \
              -o \
              -name "firmware.bin" \
              -o \
              -name "bootloader.bin" \
              -o \
              -name "partition-table.bin" \
              -o \
              -name "partitions.bin" \
            \) \
            -print

      # =====================================================
      # PREPARAR FIRMWARE
      # =====================================================

      - name: Preparar firmware
        run: |

          set -e

          mkdir -p final_firmware

          BUILD_DIR="lib/micropython/ports/esp32/build-ESP32_GENERIC"

          echo "=========================================="
          echo "BUILD DIRECTORY"
          echo "=========================================="

          echo "$BUILD_DIR"

          echo ""
          echo "=========================================="
          echo "BINARIOS"
          echo "=========================================="

          find "$BUILD_DIR" \
            -type f \
            \( \
              -name "*.bin" \
              -o \
              -name "*.elf" \
            \) \
            -printf "%s bytes -> %p\n" \
            | sort -n

          # =================================================
          # MICROPYTHON
          # =================================================

          if [ -f "$BUILD_DIR/micropython.bin" ]; then

            cp "$BUILD_DIR/micropython.bin" \
              final_firmware/micropython.bin

          else

            echo ""
            echo "ERROR:"
            echo "NO SE ENCONTRO micropython.bin"
            echo ""
            echo "Esto significa que la compilacion no genero"
            echo "la aplicacion MicroPython."
            echo ""

            exit 1

          fi

          # =================================================
          # BOOTLOADER
          # =================================================

          if [ -f "$BUILD_DIR/bootloader/bootloader.bin" ]; then

            cp "$BUILD_DIR/bootloader/bootloader.bin" \
              final_firmware/bootloader.bin

          else

            echo ""
            echo "ERROR:"
            echo "NO SE ENCONTRO bootloader.bin"

            exit 1

          fi

          # =================================================
          # PARTITION TABLE
          # =================================================

          if [ -f "$BUILD_DIR/partition_table/partition-table.bin" ]; then

            cp "$BUILD_DIR/partition_table/partition-table.bin" \
              final_firmware/partition-table.bin

          else

            echo ""
            echo "ERROR:"
            echo "NO SE ENCONTRO partition-table.bin"

            exit 1

          fi

          # =================================================
          # FIRMWARE COMBINADO
          # =================================================

          if [ -f "$BUILD_DIR/firmware.bin" ]; then

            cp "$BUILD_DIR/firmware.bin" \
              final_firmware/firmware.bin

          fi

          # =================================================
          # RESULTADO
          # =================================================

          echo ""
          echo "=========================================="
          echo "FIRMWARE FINAL"
          echo "=========================================="

          ls -lah final_firmware

      # =====================================================
      # VERIFICAR
      # =====================================================

      - name: Verificar firmware
        run: |

          set -e

          echo "=========================================="
          echo "VERIFICANDO FIRMWARE"
          echo "=========================================="

          test -f final_firmware/micropython.bin
          test -f final_firmware/bootloader.bin
          test -f final_firmware/partition-table.bin

          echo ""
          echo "MICROPYTHON:"
          ls -lh final_firmware/micropython.bin

          echo ""
          echo "BOOTLOADER:"
          ls -lh final_firmware/bootloader.bin

          echo ""
          echo "PARTITION TABLE:"
          ls -lh final_firmware/partition-table.bin

          if [ -f final_firmware/firmware.bin ]; then
            echo ""
            echo "FIRMWARE COMBINADO:"
            ls -lh final_firmware/firmware.bin
          fi

          echo ""
          echo "=========================================="
          echo "FIRMWARE CORRECTO"
          echo "=========================================="

      # =====================================================
      # SUBIR ARTIFACT
      # =====================================================

      - name: Subir firmware
        uses: actions/upload-artifact@v4
        with:
          name: lvgl-micropython-cyd-st7789
          path: final_firmware/
