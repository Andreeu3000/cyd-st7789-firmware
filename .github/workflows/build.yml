name: Compilar LVGL MicroPython - CYD ST7789

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar LVGL MicroPython
        run: |
          git clone --recursive https://github.com/lvgl-micropython/lvgl_micropython.git .

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            libusb-1.0-0-dev

      - name: Aplicar parche en network_wlan.c (Obtener IPs en AP)
        shell: bash
        run: |
          cat > patch.py <<'PY'
          from pathlib import Path

          path = Path("lib/micropython/ports/esp32/network_wlan.c")
          if not path.exists():
              raise SystemExit(f"ERROR: No se encontró el archivo en {path}")

          text = path.read_text(encoding="utf-8")

          target_str = "case (uintptr_t)MP_OBJ_NEW_QSTR(MP_QSTR_stations):"
          
          if target_str not in text:
              raise SystemExit("ERROR: No se encontró el punto de inserción MP_QSTR_stations.")

          patch_code = """        case (uintptr_t)MP_OBJ_NEW_QSTR(MP_QSTR_stations): {
                      require_if(args[0], ESP_IF_WIFI_AP);

                      typedef struct {
                          uint8_t mac[6];
                          uint32_t ip;
                      } custom_wifi_sta_ip_t;

                      typedef struct {
                          custom_wifi_sta_ip_t sta[15];
                          int num;
                      } custom_wifi_sta_mac_ip_list_t;

                      extern esp_err_t esp_wifi_ap_get_sta_list_with_ip(const wifi_sta_list_t *sta_list, custom_wifi_sta_mac_ip_list_t *mac_ip_list);

                      wifi_sta_list_t station_list = {0};
                      custom_wifi_sta_mac_ip_list_t mac_ip_list = {0};

                      esp_exceptions(esp_wifi_ap_get_sta_list(&station_list));
                      esp_exceptions(esp_wifi_ap_get_sta_list_with_ip(&station_list, &mac_ip_list));

                      mp_obj_t list = mp_obj_new_list(0, NULL);

                      for (int i = 0; i < mac_ip_list.num; ++i) {
                          mp_obj_tuple_t *tuple = mp_obj_new_tuple(2, NULL);
                          tuple->items[0] = mp_obj_new_bytes(mac_ip_list.sta[i].mac, 6);
                          tuple->items[1] = netutils_format_ipv4_addr((uint8_t *)&mac_ip_list.sta[i].ip, NETUTILS_BIG);
                          mp_obj_list_append(list, MP_OBJ_FROM_PTR(tuple));
                      }

                      return list;
                  }"""

          # Reemplazar la rama completa de MP_QSTR_stations
          import re
          pattern = re.compile(
              r'case\s+\(uintptr_t\)MP_OBJ_NEW_QSTR\(MP_QSTR_stations\):.*?(?=\s*case\s+\(uintptr_t\)MP_OBJ_NEW_QSTR\(MP_QSTR_rssi\):)',
              re.DOTALL
          )

          new_text, count = pattern.subn(patch_code + "\n", text)
          if count == 0:
              raise SystemExit("ERROR: No se pudo reemplazar la sección MP_QSTR_stations.")

          path.write_text(new_text, encoding="utf-8")
          print("Parche C aplicado exitosamente en network_wlan.c.")
          PY

          python3 patch.py

      - name: Compilar firmware ESP32
        id: compile
        run: |
          set -o pipefail

          python3 make.py esp32 \
            BOARD=ESP32_GENERIC \
            DISPLAY=st7789 \
            INDEV=xpt2046 \
            --flash-size=4 \
            --optimize-size \
            --ccache \
            LV_CFLAGS="-DLV_USE_IMAGE=1" \
            2>&1 | tee build.log

      - name: Preparar y verificar binarios finales
        if: success()
        run: |
          BUILD_DIR="lib/micropython/ports/esp32/build-ESP32_GENERIC"

          mkdir -p final_firmware

          # Copiar bootloader y partition table
          if [ -f "$BUILD_DIR/bootloader/bootloader.bin" ]; then
            cp "$BUILD_DIR/bootloader/bootloader.bin" final_firmware/bootloader.bin
          fi

          if [ -f "$BUILD_DIR/partition_table/partition-table.bin" ]; then
            cp "$BUILD_DIR/partition_table/partition-table.bin" final_firmware/partition-table.bin
          fi

          # Copiar binario principal y crear copia como micropython.bin
          if [ -f "$BUILD_DIR/firmware.bin" ]; then
            cp "$BUILD_DIR/firmware.bin" final_firmware/firmware.bin
            cp "$BUILD_DIR/firmware.bin" final_firmware/micropython.bin
          elif [ -f "$BUILD_DIR/micropython.bin" ]; then
            cp "$BUILD_DIR/micropython.bin" final_firmware/micropython.bin
            cp "$BUILD_DIR/micropython.bin" final_firmware/firmware.bin
          fi

          echo "Archivos en final_firmware:"
          ls -lh final_firmware/

      - name: Subir Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-cyd-st7789
          path: final_firmware/

      - name: Subir Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            lib/micropython/ports/esp32/build-ESP32_GENERIC/log/
          if-no-files-found: warn
