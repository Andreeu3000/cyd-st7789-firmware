name: Compilar Firmware CYD ST7789

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repositorio principal de LVGL Micropython
      uses: actions/checkout@v4
      with:
        repository: kdschlosser/lvgl_micropython
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build gperf libffi-dev libssl-dev dfu-util libusb-1.0-0 build-essential git wget curl

    - name: Compilar Firmware para ESP32 CYD con make.py
      run: |
        python3 make.py esp32 submodules mpy_cross BOARD=ESP32_GENERIC DISPLAY=st7789 INDEV=xpt2046 --flash-size=4 --optimize-size

    - name: Recopilar binarios independientes del ESP-IDF
      run: |
        mkdir -p final_firmware
        find lib/micropython/ports/esp32 -name "bootloader.bin" -exec cp {} final_firmware/ \;
        find lib/micropython/ports/esp32 -name "partition-table.bin" -exec cp {} final_firmware/ \;
        find lib/micropython/ports/esp32 -name "micropython.bin" -exec cp {} final_firmware/ \;
        find lib/micropython/ports/esp32 -name "firmware.bin" -exec cp {} final_firmware/ \;
        ls -la final_firmware/

    - name: Subir archivos como Artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-cyd-separado
        path: final_firmware/*.bin
