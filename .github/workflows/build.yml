name: Compilar LVGL MicroPython - CYD ST7789

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CLONAR LVGL MICROPYTHON
      # =====================================================

      - name: Clonar LVGL MicroPython
        run: |
          git clone https://github.com/lvgl-micropython/lvgl_micropython.git .

      # =====================================================
      # PYTHON
      # =====================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =====================================================
      # DEPENDENCIAS
      # =====================================================

      - name: Instalar dependencias
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            python3 \
            python3-venv \
            libusb-1.0-0-dev

      # =====================================================
      # CONFIGURAR LVGL
      # =====================================================

      - name: Configurar funciones LVGL
        run: |

          echo "=========================================="
          echo "CONFIGURANDO LVGL"
          echo "=========================================="

          # -------------------------------------------------
          # Mostrar configuración original
          # -------------------------------------------------

          echo ""
          echo "CONFIGURACION ORIGINAL:"

          grep -E \
            'LV_USE_IMAGE|LV_USE_TJPGD|LV_USE_FS_MEMFS|LV_USE_LODEPNG|LV_USE_BMP|LV_USE_GIF|LV_USE_QRCODE|LV_USE_BARCODE|LV_USE_RLE|LV_USE_TINY_TTF|LV_TINY_TTF_FILE_SUPPORT|LV_USE_LIBJPEG_TURBO|LV_USE_LIBPNG|LV_USE_LIBWEBP|LV_USE_FREETYPE' \
            lib/lv_conf.h || true

          # -------------------------------------------------
          # Activar IMAGE
          # -------------------------------------------------

          sed -i \
            's/^#define LV_USE_IMAGE .*/#define LV_USE_IMAGE 1/' \
            lib/lv_conf.h

          # -------------------------------------------------
          # Activar JPEG / TJPGD
          # -------------------------------------------------

          sed -i \
            's/^#define LV_USE_TJPGD .*/#define LV_USE_TJPGD 1/' \
            lib/lv_conf.h

          # -------------------------------------------------
          # Activar MEMFS
          #
          # Necesario para decodificar JPEG almacenado
          # directamente en memoria.
          # -------------------------------------------------

          sed -i \
            's/^#define LV_USE_FS_MEMFS .*/#define LV_USE_FS_MEMFS 1/' \
            lib/lv_conf.h

          # -------------------------------------------------
          # Activar PNG
          # -------------------------------------------------

          sed -i \
            's/^#define LV_USE_LODEPNG .*/#define LV_USE_LODEPNG 1/' \
            lib/lv_conf.h

          # -------------------------------------------------
          # Activar BMP
          # -------------------------------------------------

          sed -i \
            's/^#define LV_USE_BMP .*/#define LV_USE_BMP 1/' \
            lib/lv_conf.h

          # -------------------------------------------------
          # Activar GIF
          # -------------------------------------------------

          sed -i \
            's/^#define LV_USE_GIF .*/#define LV_USE_GIF 1/' \
            lib/lv_conf.h

          # -------------------------------------------------
          # Activar QR
          # -------------------------------------------------

          sed -i \
            's/^#define LV_USE_QRCODE .*/#define LV_USE_QRCODE 1/' \
            lib/lv_conf.h

          # -------------------------------------------------
          # Activar BARCODE
          # -------------------------------------------------

          sed -i \
            's/^#define LV_USE_BARCODE .*/#define LV_USE_BARCODE 1/' \
            lib/lv_conf.h

          # -------------------------------------------------
          # Activar RLE
          # -------------------------------------------------

          sed -i \
            's/^#define LV_USE_RLE .*/#define LV_USE_RLE 1/' \
            lib/lv_conf.h

          # -------------------------------------------------
          # Activar Tiny TTF
          # -------------------------------------------------

          sed -i \
            's/^#define LV_USE_TINY_TTF .*/#define LV_USE_TINY_TTF 1/' \
            lib/lv_conf.h

          # -------------------------------------------------
          # Activar TTF desde archivo
          # -------------------------------------------------

          sed -i \
            's/^#define LV_TINY_TTF_FILE_SUPPORT .*/#define LV_TINY_TTF_FILE_SUPPORT 1/' \
            lib/lv_conf.h

          # -------------------------------------------------
          # Desactivar decodificadores pesados
          # -------------------------------------------------

          sed -i \
            's/^#define LV_USE_LIBJPEG_TURBO .*/#define LV_USE_LIBJPEG_TURBO 0/' \
            lib/lv_conf.h

          sed -i \
            's/^#define LV_USE_LIBPNG .*/#define LV_USE_LIBPNG 0/' \
            lib/lv_conf.h

          sed -i \
            's/^#define LV_USE_LIBWEBP .*/#define LV_USE_LIBWEBP 0/' \
            lib/lv_conf.h

          sed -i \
            's/^#define LV_USE_FREETYPE .*/#define LV_USE_FREETYPE 0/' \
            lib/lv_conf.h

          # =================================================
          # MOSTRAR CONFIGURACION FINAL
          # =================================================

          echo ""
          echo "=========================================="
          echo "CONFIGURACION FINAL"
          echo "=========================================="

          grep -E \
            'LV_USE_IMAGE|LV_USE_TJPGD|LV_USE_FS_MEMFS|LV_USE_LODEPNG|LV_USE_BMP|LV_USE_GIF|LV_USE_QRCODE|LV_USE_BARCODE|LV_USE_RLE|LV_USE_TINY_TTF|LV_TINY_TTF_FILE_SUPPORT|LV_USE_LIBJPEG_TURBO|LV_USE_LIBPNG|LV_USE_LIBWEBP|LV_USE_FREETYPE' \
            lib/lv_conf.h

      # =====================================================
      # LIMPIAR COMPILACIONES ANTERIORES
      # =====================================================

      - name: Limpiar compilación
        run: |
          python3 make.py esp32 clean

      # =====================================================
      # COMPILAR
      # =====================================================

      - name: Compilar firmware
        run: |
          python3 make.py esp32 \
            BOARD=ESP32_GENERIC \
            DISPLAY=st7789 \
            INDEV=xpt2046 \
            --flash-size=4 \
            --optimize-size

      # =====================================================
      # BUSCAR FIRMWARE
      # =====================================================

      - name: Buscar firmware generado
        run: |

          echo "=========================================="
          echo "BINARIOS GENERADOS"
          echo "=========================================="

          find . -type f -name "*.bin" -print

      # =====================================================
      # PREPARAR FIRMWARE
      # =====================================================

      - name: Preparar firmware
        run: |

          mkdir -p final_firmware

          echo "=========================================="
          echo "BUSCANDO BOOTLOADER"
          echo "=========================================="

          find . -type f -name "bootloader.bin" \
            -exec cp {} final_firmware/ \;

          echo "=========================================="
          echo "BUSCANDO PARTITION TABLE"
          echo "=========================================="

          find . -type f -name "partition-table.bin" \
            -exec cp {} final_firmware/ \;

          echo "=========================================="
          echo "BUSCANDO MICROPYTHON"
          echo "=========================================="

          find . -type f -name "micropython.bin" \
            -exec cp {} final_firmware/ \;

          echo ""
          echo "=========================================="
          echo "FIRMWARE FINAL"
          echo "=========================================="

          ls -lah final_firmware

      # =====================================================
      # VERIFICAR FIRMWARE
      # =====================================================

      - name: Verificar firmware
        run: |

          echo "=========================================="
          echo "VERIFICANDO"
          echo "=========================================="

          echo ""
          echo "ARCHIVOS EN final_firmware:"
          echo ""

          ls -lah final_firmware

          echo ""
          echo "=========================================="
          echo "COMPROBANDO ARCHIVOS"
          echo "=========================================="

          ERROR=0

          if [ -f final_firmware/micropython.bin ]; then
            echo "OK: micropython.bin"
          else
            echo "FALTA: micropython.bin"
            ERROR=1
          fi

          if [ -f final_firmware/bootloader.bin ]; then
            echo "OK: bootloader.bin"
          else
            echo "FALTA: bootloader.bin"
            ERROR=1
          fi

          if [ -f final_firmware/partition-table.bin ]; then
            echo "OK: partition-table.bin"
          else
            echo "FALTA: partition-table.bin"
            ERROR=1
          fi

          echo ""
          echo "=========================================="
          echo "TODOS LOS .BIN EN EL PROYECTO"
          echo "=========================================="

          find . -type f -name "*.bin" -print

          echo ""

          if [ "$ERROR" -ne 0 ]; then
            echo "=========================================="
            echo "ERROR: FALTA UNO O MAS BINARIOS"
            echo "=========================================="
            exit 1
          fi

          echo "=========================================="
          echo "TODOS LOS BINARIOS ESTAN PRESENTES"
          echo "=========================================="

      # =====================================================
      # SUBIR ARTIFACT
      # =====================================================

      - name: Subir firmware
        uses: actions/upload-artifact@v4
        with:
          name: lvgl-micropython-cyd-st7789
          path: final_firmware/
