name: Compilar LVGL MicroPython - CYD ST7789

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CLONAR LVGL MICROPYTHON
      # ============================================================

      - name: Clonar LVGL MicroPython
        run: |
          git clone --recursive https://github.com/lvgl-micropython/lvgl_micropython.git .


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # DEPENDENCIAS
      # ============================================================

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            libusb-1.0-0-dev

          pip install esptool


      # ============================================================
      # WIFI + PARTICIONES
      # ============================================================

      - name: Aplicar parche en network_wlan.c y Tabla de Particiones Ampliada
        shell: bash
        run: |

          # ==========================================================
          # 1. Crear tabla de particiones personalizada de 4MB
          # ==========================================================

          cat > lib/micropython/ports/esp32/partitions-4mb-custom.csv <<'EOF'
          # Name,   Type, SubType, Offset,  Size, Flags
          nvs,      data, nvs,     0x9000,  0x6000,
          phy_init, data, phy,     0xf000,  0x1000,
          factory,  app,  factory, 0x10000, 0x330000,
          EOF


          # ==========================================================
          # 2. Aplicar parche C en network_wlan.c
          # ==========================================================

          cat > patch.py <<'PY'

          import re
          from pathlib import Path


          path = Path(
              "lib/micropython/ports/esp32/network_wlan.c"
          )


          if not path.exists():
              raise SystemExit(
                  f"ERROR: No se encontró el archivo en {path}"
              )


          text = path.read_text(
              encoding="utf-8"
          )


          # ============================================================
          # HEADERS
          # ============================================================

          if (
              '#include "shared/netutils/netutils.h"'
              not in text
          ):
              text = (
                  '#include "shared/netutils/netutils.h"\n'
                  + text
              )


          if (
              '#include "esp_wifi_ap_get_sta_list.h"'
              not in text
          ):
              text = (
                  '#include "esp_wifi_ap_get_sta_list.h"\n'
                  + text
              )


          if '#include "esp_netif.h"' not in text:
              text = (
                  '#include "esp_netif.h"\n'
                  + text
              )


          # ============================================================
          # STATIONS
          # ============================================================

          patch_code = """        case (uintptr_t)MP_OBJ_NEW_QSTR(MP_QSTR_stations): {
                      // Return list of connected stations with MAC + IPv4.
                      require_if(args[0], ESP_IF_WIFI_AP);

                      wifi_sta_list_t station_list;

                      esp_exceptions(
                          esp_wifi_ap_get_sta_list(&station_list)
                      );

                      wifi_sta_mac_ip_list_t mac_ip_list;

                      esp_exceptions(
                          esp_wifi_ap_get_sta_list_with_ip(
                              &station_list,
                              &mac_ip_list
                          )
                      );

                      mp_obj_t list = mp_obj_new_list(0, NULL);

                      int count = mac_ip_list.num;

                      esp_netif_pair_mac_ip_t *source =
                          (esp_netif_pair_mac_ip_t *)mac_ip_list.sta;

                      for (int i = 0; i < count; ++i) {
                          mp_obj_t tuple_items[2];

                          tuple_items[0] =
                              mp_obj_new_bytes(
                                  source[i].mac,
                                  sizeof(source[i].mac)
                              );

                          tuple_items[1] =
                              source[i].ip.addr != 0
                              ? netutils_format_ipv4_addr(
                                  (uint8_t *)(&source[i].ip),
                                  NETUTILS_BIG
                              )
                              : mp_const_none;

                          mp_obj_list_append(
                              list,
                              mp_obj_new_tuple(2, tuple_items)
                          );
                      }

                      return list;
                  }"""


          pattern = re.compile(
              r'case\s+\(uintptr_t\)MP_OBJ_NEW_QSTR\(MP_QSTR_stations\):.*?(?=\s*case\s+\(uintptr_t\)MP_OBJ_NEW_QSTR\(MP_QSTR_rssi\):)',
              re.DOTALL
          )


          new_text, count = pattern.subn(
              patch_code + "\n",
              text
          )


          if count == 0:
              raise SystemExit(
                  "ERROR: No se pudo reemplazar la sección MP_QSTR_stations."
              )


          text = new_text


          # ============================================================
          # FUNCIONES NUEVAS
          # ============================================================

          new_functions = r'''

          // ============================================================
          // SoftAP / WiFi advanced control
          // ESP-IDF 5.x compatible
          // ============================================================


          static esp_netif_t *network_wlan_get_ap_netif(void) {

              esp_netif_t *netif =
                  esp_netif_get_handle_from_ifkey(
                      "WIFI_AP_DEF"
                  );

              if (netif == NULL) {

                  mp_raise_msg(
                      &mp_type_RuntimeError,
                      MP_ERROR_TEXT(
                          "AP netif not available"
                      )
                  );
              }

              return netif;
          }


          static void network_wlan_check_mac(
              mp_obj_t mac_in,
              mp_buffer_info_t *bufinfo
          ) {

              mp_get_buffer_raise(
                  mac_in,
                  bufinfo,
                  MP_BUFFER_READ
              );

              if (bufinfo->len != 6) {

                  mp_raise_ValueError(
                      MP_ERROR_TEXT(
                          "MAC must be 6 bytes"
                      )
                  );
              }
          }


          // ============================================================
          // 1. dhcp_status()
          // ============================================================

          static mp_obj_t network_wlan_dhcp_status(
              mp_obj_t self_in
          ) {

              require_if(
                  self_in,
                  ESP_IF_WIFI_AP
              );

              esp_netif_t *netif =
                  network_wlan_get_ap_netif();

              esp_netif_dhcp_status_t status;

              esp_exceptions(
                  esp_netif_dhcps_get_status(
                      netif,
                      &status
                  )
              );

              return MP_OBJ_NEW_SMALL_INT(
                  status
              );
          }


          static MP_DEFINE_CONST_FUN_OBJ_1(
              network_wlan_dhcp_status_obj,
              network_wlan_dhcp_status
          );


          // ============================================================
          // 2. dhcp_restart()
          // ============================================================

          static mp_obj_t network_wlan_dhcp_restart(
              mp_obj_t self_in
          ) {

              require_if(
                  self_in,
                  ESP_IF_WIFI_AP
              );

              esp_netif_t *netif =
                  network_wlan_get_ap_netif();

              esp_netif_dhcp_status_t status;

              esp_exceptions(
                  esp_netif_dhcps_get_status(
                      netif,
                      &status
                  )
              );

              if (
                  status ==
                  ESP_NETIF_DHCP_STARTED
              ) {

                  esp_exceptions(
                      esp_netif_dhcps_stop(
                          netif
                      )
                  );
              }

              esp_exceptions(
                  esp_netif_dhcps_start(
                      netif
                  )
              );

              return mp_const_none;
          }


          static MP_DEFINE_CONST_FUN_OBJ_1(
              network_wlan_dhcp_restart_obj,
              network_wlan_dhcp_restart
          );


          // ============================================================
          // 3. dhcp_start()
          // ============================================================

          static mp_obj_t network_wlan_dhcp_start(
              mp_obj_t self_in
          ) {

              require_if(
                  self_in,
                  ESP_IF_WIFI_AP
              );

              esp_netif_t *netif =
                  network_wlan_get_ap_netif();

              esp_exceptions(
                  esp_netif_dhcps_start(
                      netif
                  )
              );

              return mp_const_none;
          }


          static MP_DEFINE_CONST_FUN_OBJ_1(
              network_wlan_dhcp_start_obj,
              network_wlan_dhcp_start
          );


          // ============================================================
          // 4. dhcp_stop()
          // ============================================================

          static mp_obj_t network_wlan_dhcp_stop(
              mp_obj_t self_in
          ) {

              require_if(
                  self_in,
                  ESP_IF_WIFI_AP
              );

              esp_netif_t *netif =
                  network_wlan_get_ap_netif();

              esp_exceptions(
                  esp_netif_dhcps_stop(
                      netif
                  )
              );

              return mp_const_none;
          }


          static MP_DEFINE_CONST_FUN_OBJ_1(
              network_wlan_dhcp_stop_obj,
              network_wlan_dhcp_stop
          );


          // ============================================================
          // 5. get_sta_list()
          // ============================================================

          static mp_obj_t network_wlan_get_sta_list(
              mp_obj_t self_in
          ) {

              require_if(
                  self_in,
                  ESP_IF_WIFI_AP
              );

              wifi_sta_list_t station_list;

              esp_exceptions(
                  esp_wifi_ap_get_sta_list(
                      &station_list
                  )
              );

              mp_obj_t list =
                  mp_obj_new_list(
                      0,
                      NULL
                  );

              for (
                  int i = 0;
                  i < station_list.num;
                  ++i
              ) {

                  mp_obj_list_append(
                      list,
                      mp_obj_new_bytes(
                          station_list.sta[i].mac,
                          6
                      )
                  );
              }

              return list;
          }


          static MP_DEFINE_CONST_FUN_OBJ_1(
              network_wlan_get_sta_list_obj,
              network_wlan_get_sta_list
          );


          // ============================================================
          // 6. get_aid(mac)
          // ============================================================

          static mp_obj_t network_wlan_get_aid(
              mp_obj_t self_in,
              mp_obj_t mac_in
          ) {

              require_if(
                  self_in,
                  ESP_IF_WIFI_AP
              );

              mp_buffer_info_t bufinfo;

              network_wlan_check_mac(
                  mac_in,
                  &bufinfo
              );

              uint16_t aid = 0;

              esp_exceptions(
                  esp_wifi_ap_get_sta_aid(
                      (const uint8_t *)bufinfo.buf,
                      &aid
                  )
              );

              return MP_OBJ_NEW_SMALL_INT(
                  aid
              );
          }


          static MP_DEFINE_CONST_FUN_OBJ_2(
              network_wlan_get_aid_obj,
              network_wlan_get_aid
          );


          // ============================================================
          // 7. get_sta_info(mac)
          // ============================================================

          static mp_obj_t network_wlan_get_sta_info(
              mp_obj_t self_in,
              mp_obj_t mac_in
          ) {

              require_if(
                  self_in,
                  ESP_IF_WIFI_AP
              );

              mp_buffer_info_t bufinfo;

              network_wlan_check_mac(
                  mac_in,
                  &bufinfo
              );

              wifi_sta_list_t station_list;

              esp_exceptions(
                  esp_wifi_ap_get_sta_list(
                      &station_list
                  )
              );

              for (
                  int i = 0;
                  i < station_list.num;
                  ++i
              ) {

                  wifi_sta_info_t *sta =
                      &station_list.sta[i];

                  if (
                      memcmp(
                          sta->mac,
                          bufinfo.buf,
                          6
                      ) == 0
                  ) {

                      uint16_t aid = 0;

                      esp_exceptions(
                          esp_wifi_ap_get_sta_aid(
                              sta->mac,
                              &aid
                          )
                      );

                      mp_obj_t items[7];

                      items[0] =
                          mp_obj_new_bytes(
                              sta->mac,
                              6
                          );

                      items[1] =
                          MP_OBJ_NEW_SMALL_INT(
                              sta->rssi
                          );

                      items[2] =
                          MP_OBJ_NEW_SMALL_INT(
                              aid
                          );

                      items[3] =
                          MP_OBJ_NEW_SMALL_INT(
                              sta->phy_11b != 0
                          );

                      items[4] =
                          MP_OBJ_NEW_SMALL_INT(
                              sta->phy_11g != 0
                          );

                      items[5] =
                          MP_OBJ_NEW_SMALL_INT(
                              sta->phy_11n != 0
                          );

                      items[6] =
                          MP_OBJ_NEW_SMALL_INT(
                              sta->phy_lr != 0
                          );

                      return mp_obj_new_tuple(
                          7,
                          items
                      );
                  }
              }

              return mp_const_none;
          }


          static MP_DEFINE_CONST_FUN_OBJ_2(
              network_wlan_get_sta_info_obj,
              network_wlan_get_sta_info
          );


          // ============================================================
          // 8. dhcp_ip(mac)
          // ============================================================

          static mp_obj_t network_wlan_dhcp_ip(
              mp_obj_t self_in,
              mp_obj_t mac_in
          ) {

              require_if(
                  self_in,
                  ESP_IF_WIFI_AP
              );

              mp_buffer_info_t bufinfo;

              network_wlan_check_mac(
                  mac_in,
                  &bufinfo
              );

              esp_netif_t *netif =
                  network_wlan_get_ap_netif();

              esp_netif_pair_mac_ip_t pair;

              memset(
                  &pair,
                  0,
                  sizeof(pair)
              );

              memcpy(
                  pair.mac,
                  bufinfo.buf,
                  6
              );

              esp_err_t err =
                  esp_netif_dhcps_get_clients_by_mac(
                      netif,
                      1,
                      &pair
                  );

              if (err != ESP_OK) {
                  return mp_const_none;
              }

              if (pair.ip.addr == 0) {
                  return mp_const_none;
              }

              return netutils_format_ipv4_addr(
                  (uint8_t *)&pair.ip,
                  NETUTILS_BIG
              );
          }


          static MP_DEFINE_CONST_FUN_OBJ_2(
              network_wlan_dhcp_ip_obj,
              network_wlan_dhcp_ip
          );


          // ============================================================
          // 9. deauth(mac)
          // ============================================================

          static mp_obj_t network_wlan_deauth(
              mp_obj_t self_in,
              mp_obj_t mac_in
          ) {

              require_if(
                  self_in,
                  ESP_IF_WIFI_AP
              );

              mp_buffer_info_t bufinfo;

              network_wlan_check_mac(
                  mac_in,
                  &bufinfo
              );

              uint16_t aid = 0;

              esp_exceptions(
                  esp_wifi_ap_get_sta_aid(
                      (const uint8_t *)bufinfo.buf,
                      &aid
                  )
              );

              esp_exceptions(
                  esp_wifi_deauth_sta(
                      aid
                  )
              );

              return mp_const_none;
          }


          static MP_DEFINE_CONST_FUN_OBJ_2(
              network_wlan_deauth_obj,
              network_wlan_deauth
          );


          // ============================================================
          // 10. deauth_aid(aid)
          // ============================================================

          static mp_obj_t network_wlan_deauth_aid(
              mp_obj_t self_in,
              mp_obj_t aid_in
          ) {

              require_if(
                  self_in,
                  ESP_IF_WIFI_AP
              );

              uint16_t aid =
                  mp_obj_get_int(
                      aid_in
                  );

              if (aid == 0) {

                  mp_raise_ValueError(
                      MP_ERROR_TEXT(
                          "AID 0 is reserved for deauth_all()"
                      )
                  );
              }

              esp_exceptions(
                  esp_wifi_deauth_sta(
                      aid
                  )
              );

              return mp_const_none;
          }


          static MP_DEFINE_CONST_FUN_OBJ_2(
              network_wlan_deauth_aid_obj,
              network_wlan_deauth_aid
          );


          // ============================================================
          // 11. deauth_all()
          // ============================================================

          static mp_obj_t network_wlan_deauth_all(
              mp_obj_t self_in
          ) {

              require_if(
                  self_in,
                  ESP_IF_WIFI_AP
              );

              esp_exceptions(
                  esp_wifi_deauth_sta(
                      0
                  )
              );

              return mp_const_none;
          }


          static MP_DEFINE_CONST_FUN_OBJ_1(
              network_wlan_deauth_all_obj,
              network_wlan_deauth_all
          );


          // ============================================================
          // 12. get_inactive_time()
          // ============================================================

          static mp_obj_t network_wlan_get_inactive_time(
              mp_obj_t self_in
          ) {

              require_if(
                  self_in,
                  ESP_IF_WIFI_AP
              );

              uint16_t seconds = 0;

              esp_exceptions(
                  esp_wifi_get_inactive_time(
                      WIFI_IF_AP,
                      &seconds
                  )
              );

              return MP_OBJ_NEW_SMALL_INT(
                  seconds
              );
          }


          static MP_DEFINE_CONST_FUN_OBJ_1(
              network_wlan_get_inactive_time_obj,
              network_wlan_get_inactive_time
          );


          // ============================================================
          // 13. set_inactive_time(seconds)
          // ============================================================

          static mp_obj_t network_wlan_set_inactive_time(
              mp_obj_t self_in,
              mp_obj_t seconds_in
          ) {

              require_if(
                  self_in,
                  ESP_IF_WIFI_AP
              );

              uint16_t seconds =
                  mp_obj_get_int(
                      seconds_in
                  );

              if (seconds < 10) {

                  mp_raise_ValueError(
                      MP_ERROR_TEXT(
                          "AP inactive time minimum is 10 seconds"
                      )
                  );
              }

              esp_exceptions(
                  esp_wifi_set_inactive_time(
                      WIFI_IF_AP,
                      seconds
                  )
              );

              return mp_const_none;
          }


          static MP_DEFINE_CONST_FUN_OBJ_2(
              network_wlan_set_inactive_time_obj,
              network_wlan_set_inactive_time
          );


          // ============================================================
          // 14. get_ap_info()
          // ============================================================

          static mp_obj_t network_wlan_get_ap_info(
              mp_obj_t self_in
          ) {

              require_if(
                  self_in,
                  ESP_IF_WIFI_AP
              );

              wifi_config_t config;

              memset(
                  &config,
                  0,
                  sizeof(config)
              );

              esp_exceptions(
                  esp_wifi_get_config(
                      WIFI_IF_AP,
                      &config
                  )
              );

              mp_obj_t items[5];

              items[0] =
                  mp_obj_new_bytes(
                      config.ap.ssid,
                      strlen(
                          (char *)config.ap.ssid
                      )
                  );

              items[1] =
                  mp_obj_new_bytes(
                      config.ap.password,
                      strlen(
                          (char *)config.ap.password
                      )
                  );

              items[2] =
                  MP_OBJ_NEW_SMALL_INT(
                      config.ap.channel
                  );

              items[3] =
                  MP_OBJ_NEW_SMALL_INT(
                      config.ap.max_connection
                  );

              items[4] =
                  MP_OBJ_NEW_SMALL_INT(
                      config.ap.authmode
                  );

              return mp_obj_new_tuple(
                  5,
                  items
              );
          }


          static MP_DEFINE_CONST_FUN_OBJ_1(
              network_wlan_get_ap_info_obj,
              network_wlan_get_ap_info
          );


          // ============================================================
          // 15. wifi_stats()
          // ============================================================

          static mp_obj_t network_wlan_wifi_stats(
              mp_obj_t self_in
          ) {

              require_if(
                  self_in,
                  ESP_IF_WIFI_AP
              );

              esp_exceptions(
                  esp_wifi_statis_dump(
                      0xFFFFFFFF
                  )
              );

              return mp_const_none;
          }


          static MP_DEFINE_CONST_FUN_OBJ_1(
              network_wlan_wifi_stats_obj,
              network_wlan_wifi_stats
          );

          '''


          # ============================================================
          # INSERTAR FUNCIONES
          # ============================================================

          marker = (
              "static const mp_rom_map_elem_t "
              "wlan_if_locals_dict_table[] = {"
          )


          if marker not in text:
              raise SystemExit(
                  "ERROR: No se encontró "
                  "wlan_if_locals_dict_table."
              )


          if "network_wlan_dhcp_status_obj" in text:
              raise SystemExit(
                  "ERROR: Las funciones nuevas "
                  "ya existen en network_wlan.c."
              )


          text = text.replace(
              marker,
              new_functions + "\n" + marker,
              1
          )


          # ============================================================
          # REGISTRAR FUNCIONES
          # ============================================================

          table_marker = (
              '    { MP_ROM_QSTR(MP_QSTR_status), '
              'MP_ROM_PTR(&network_wlan_status_obj) },'
          )


          table_addition = '''
              { MP_ROM_QSTR(MP_QSTR_dhcp_status),
                MP_ROM_PTR(&network_wlan_dhcp_status_obj) },

              { MP_ROM_QSTR(MP_QSTR_dhcp_restart),
                MP_ROM_PTR(&network_wlan_dhcp_restart_obj) },

              { MP_ROM_QSTR(MP_QSTR_dhcp_start),
                MP_ROM_PTR(&network_wlan_dhcp_start_obj) },

              { MP_ROM_QSTR(MP_QSTR_dhcp_stop),
                MP_ROM_PTR(&network_wlan_dhcp_stop_obj) },

              { MP_ROM_QSTR(MP_QSTR_get_sta_list),
                MP_ROM_PTR(&network_wlan_get_sta_list_obj) },

              { MP_ROM_QSTR(MP_QSTR_get_aid),
                MP_ROM_PTR(&network_wlan_get_aid_obj) },

              { MP_ROM_QSTR(MP_QSTR_get_sta_info),
                MP_ROM_PTR(&network_wlan_get_sta_info_obj) },

              { MP_ROM_QSTR(MP_QSTR_dhcp_ip),
                MP_ROM_PTR(&network_wlan_dhcp_ip_obj) },

              { MP_ROM_QSTR(MP_QSTR_deauth),
                MP_ROM_PTR(&network_wlan_deauth_obj) },

              { MP_ROM_QSTR(MP_QSTR_deauth_aid),
                MP_ROM_PTR(&network_wlan_deauth_aid_obj) },

              { MP_ROM_QSTR(MP_QSTR_deauth_all),
                MP_ROM_PTR(&network_wlan_deauth_all_obj) },

              { MP_ROM_QSTR(MP_QSTR_get_inactive_time),
                MP_ROM_PTR(&network_wlan_get_inactive_time_obj) },

              { MP_ROM_QSTR(MP_QSTR_set_inactive_time),
                MP_ROM_PTR(&network_wlan_set_inactive_time_obj) },

              { MP_ROM_QSTR(MP_QSTR_get_ap_info),
                MP_ROM_PTR(&network_wlan_get_ap_info_obj) },

              { MP_ROM_QSTR(MP_QSTR_wifi_stats),
                MP_ROM_PTR(&network_wlan_wifi_stats_obj) },'''


          if table_marker not in text:
              raise SystemExit(
                  "ERROR: No se encontró la entrada "
                  "status en la tabla WLAN."
              )


          text = text.replace(
              table_marker,
              table_marker + "\n" + table_addition,
              1
          )


          # ============================================================
          # GUARDAR
          # ============================================================

          path.write_text(
              text,
              encoding="utf-8"
          )


          print(
              "=============================================="
          )
          print(
              "Parche C aplicado exitosamente."
          )
          print("")
          print("Funciones agregadas:")
          print("")
          print("  1.  ap.dhcp_status()")
          print("  2.  ap.dhcp_restart()")
          print("  3.  ap.dhcp_start()")
          print("  4.  ap.dhcp_stop()")
          print("  5.  ap.get_sta_list()")
          print("  6.  ap.get_aid(mac)")
          print("  7.  ap.get_sta_info(mac)")
          print("  8.  ap.dhcp_ip(mac)")
          print("  9.  ap.deauth(mac)")
          print("  10. ap.deauth_aid(aid)")
          print("  11. ap.deauth_all()")
          print("  12. ap.get_inactive_time()")
          print("  13. ap.set_inactive_time(seconds)")
          print("  14. ap.get_ap_info()")
          print("  15. ap.wifi_stats()")
          print(
              "=============================================="
          )

          PY


          python3 patch.py


      # ============================================================
      # BLUETOOTH CLASSIC SPP
      # ============================================================

      - name: Agregar módulo Bluetooth Classic SPP
        shell: bash
        run: |

          set -e


          mkdir -p btserial


          # ==========================================================
          # CMAKE DEL MODULO
          # ==========================================================

          cat > btserial/micropython.cmake <<'EOF'

          add_library(
              usermod_btserial
              INTERFACE
          )

          target_sources(
              usermod_btserial
              INTERFACE
                  ${CMAKE_CURRENT_LIST_DIR}/btserial.c
          )

          target_include_directories(
              usermod_btserial
              INTERFACE
                  ${CMAKE_CURRENT_LIST_DIR}
          )

          target_link_libraries(
              usermod_btserial
              INTERFACE
                  bt
          )

          target_link_libraries(
              usermod
              INTERFACE
                  usermod_btserial
          )

          EOF


          # ==========================================================
          # C MODULE
          # ==========================================================

          cat > btserial/btserial.c <<'EOF'

          #include "py/runtime.h"
          #include "py/objstr.h"
          #include "py/mphal.h"

          #include "esp_bt.h"
          #include "esp_bt_main.h"
          #include "esp_bt_device.h"
          #include "esp_gap_bt_api.h"
          #include "esp_spp_api.h"
          #include "esp_mac.h"

          #include "freertos/FreeRTOS.h"
          #include "freertos/portmacro.h"

          #include <string.h>
          #include <stdbool.h>
          #include <stdint.h>


          // ============================================================
          // CONFIG
          // ============================================================

          #define BT_RX_BUFFER_SIZE 4096
          #define BT_SPP_CHANNEL 1


          // ============================================================
          // STATE
          // ============================================================

          static uint8_t rx_buffer[
              BT_RX_BUFFER_SIZE
          ];

          static volatile size_t rx_head = 0;
          static volatile size_t rx_tail = 0;

          static portMUX_TYPE rx_mux =
              portMUX_INITIALIZER_UNLOCKED;


          static bool controller_initialized = false;
          static bool controller_enabled = false;

          static bool bluedroid_initialized = false;
          static bool bluedroid_enabled = false;

          static bool spp_initialized = false;

          static bool bt_running = false;
          static bool server_mode = false;
          static bool connected = false;

          static uint32_t spp_handle = 0;

          static char device_name[64] =
              "CYD_SPP";


          // ============================================================
          // RX BUFFER
          // ============================================================

          static size_t rx_available_internal(void) {

              size_t head;
              size_t tail;

              portENTER_CRITICAL(
                  &rx_mux
              );

              head = rx_head;
              tail = rx_tail;

              portEXIT_CRITICAL(
                  &rx_mux
              );

              if (head >= tail) {
                  return head - tail;
              }

              return (
                  BT_RX_BUFFER_SIZE
                  - tail
                  + head
              );
          }


          static void rx_push(
              const uint8_t *data,
              size_t len
          ) {

              portENTER_CRITICAL(
                  &rx_mux
              );

              for (
                  size_t i = 0;
                  i < len;
                  ++i
              ) {

                  size_t next =
                      (
                          rx_head + 1
                      ) %
                      BT_RX_BUFFER_SIZE;


                  if (
                      next == rx_tail
                  ) {

                      rx_tail =
                          (
                              rx_tail + 1
                          ) %
                          BT_RX_BUFFER_SIZE;
                  }


                  rx_buffer[
                      rx_head
                  ] = data[i];

                  rx_head = next;
              }

              portEXIT_CRITICAL(
                  &rx_mux
              );
          }


          static size_t rx_pop(
              uint8_t *out,
              size_t max_len
          ) {

              size_t count = 0;

              portENTER_CRITICAL(
                  &rx_mux
              );

              while (
                  count < max_len &&
                  rx_tail != rx_head
              ) {

                  out[count++] =
                      rx_buffer[rx_tail];

                  rx_tail =
                      (
                          rx_tail + 1
                      ) %
                      BT_RX_BUFFER_SIZE;
              }

              portEXIT_CRITICAL(
                  &rx_mux
              );

              return count;
          }


          static void rx_clear(void) {

              portENTER_CRITICAL(
                  &rx_mux
              );

              rx_head = 0;
              rx_tail = 0;

              portEXIT_CRITICAL(
                  &rx_mux
              );
          }


          // ============================================================
          // GAP CALLBACK
          // ============================================================

          static void bt_gap_callback(
              esp_bt_gap_cb_event_t event,
              esp_bt_gap_cb_param_t *param
          ) {

              (void)event;
              (void)param;
          }


          // ============================================================
          // SPP CALLBACK
          // ============================================================

          static void bt_spp_callback(
              esp_spp_cb_event_t event,
              esp_spp_cb_param_t *param
          ) {

              switch (event) {

                  case ESP_SPP_INIT_EVT:

                      if (
                          param->init.status ==
                          ESP_SPP_SUCCESS
                      ) {

                          spp_initialized = true;
                      }

                      break;


                  case ESP_SPP_START_EVT:

                      break;


                  case ESP_SPP_CL_INIT_EVT:

                      break;


                  case ESP_SPP_OPEN_EVT:

                      if (
                          param->open.status ==
                          ESP_SPP_SUCCESS
                      ) {

                          spp_handle =
                              param->open.handle;

                          connected = true;

                          rx_clear();
                      }

                      break;


                  case ESP_SPP_SRV_OPEN_EVT:

                      if (
                          param->srv_open.status ==
                          ESP_SPP_SUCCESS
                      ) {

                          spp_handle =
                              param->srv_open.handle;

                          connected = true;

                          rx_clear();
                      }

                      break;


                  case ESP_SPP_CLOSE_EVT:

                      if (
                          param->close.handle ==
                          spp_handle
                      ) {

                          connected = false;

                          spp_handle = 0;

                          rx_clear();
                      }

                      break;


                  case ESP_SPP_DATA_IND_EVT:

                      if (
                          param->data_ind.status ==
                          ESP_SPP_SUCCESS &&
                          param->data_ind.data != NULL &&
                          param->data_ind.len > 0
                      ) {

                          rx_push(
                              param->data_ind.data,
                              param->data_ind.len
                          );
                      }

                      break;


                  default:

                      break;
              }
          }


          // ============================================================
          // START BLUETOOTH
          // ============================================================

          static void bt_start_internal(
              const char *name
          ) {

              if (bt_running) {
                  return;
              }


              if (name != NULL) {

                  size_t len =
                      strlen(name);

                  if (
                      len >=
                      sizeof(device_name)
                  ) {

                      len =
                          sizeof(device_name)
                          - 1;
                  }

                  memcpy(
                      device_name,
                      name,
                      len
                  );

                  device_name[len] =
                      '\0';
              }


              // --------------------------------------------------------
              // BT CONTROLLER
              // --------------------------------------------------------

              esp_bt_controller_status_t status =
                  esp_bt_controller_get_status();


              if (
                  status ==
                  ESP_BT_CONTROLLER_STATUS_IDLE
              ) {

                  esp_bt_controller_config_t cfg =
                      BT_CONTROLLER_INIT_CONFIG_DEFAULT();


                  esp_err_t err =
                      esp_bt_controller_init(
                          &cfg
                      );


                  if (
                      err != ESP_OK
                  ) {

                      mp_raise_msg_varg(
                          &mp_type_RuntimeError,
                          MP_ERROR_TEXT(
                              "BT controller init failed: %s"
                          ),
                          esp_err_to_name(err)
                      );
                  }


                  controller_initialized =
                      true;
              }


              status =
                  esp_bt_controller_get_status();


              if (
                  status ==
                  ESP_BT_CONTROLLER_STATUS_INITED
              ) {

                  esp_err_t err =
                      esp_bt_controller_enable(
                          ESP_BT_MODE_CLASSIC_BT
                      );


                  if (
                      err != ESP_OK
                  ) {

                      mp_raise_msg_varg(
                          &mp_type_RuntimeError,
                          MP_ERROR_TEXT(
                              "BT controller enable failed: %s"
                          ),
                          esp_err_to_name(err)
                      );
                  }


                  controller_enabled =
                      true;
              }


              // --------------------------------------------------------
              // BLUEDROID
              // --------------------------------------------------------

              esp_bluedroid_status_t bd_status =
                  esp_bluedroid_get_status();


              if (
                  bd_status ==
                  ESP_BLUEDROID_STATUS_UNINITIALIZED
              ) {

                  esp_err_t err =
                      esp_bluedroid_init();


                  if (
                      err != ESP_OK
                  ) {

                      mp_raise_msg_varg(
                          &mp_type_RuntimeError,
                          MP_ERROR_TEXT(
                              "Bluedroid init failed: %s"
                          ),
                          esp_err_to_name(err)
                      );
                  }


                  bluedroid_initialized =
                      true;
              }


              bd_status =
                  esp_bluedroid_get_status();


              if (
                  bd_status ==
                  ESP_BLUEDROID_STATUS_INITIALIZED
              ) {

                  esp_err_t err =
                      esp_bluedroid_enable();


                  if (
                      err != ESP_OK
                  ) {

                      mp_raise_msg_varg(
                          &mp_type_RuntimeError,
                          MP_ERROR_TEXT(
                              "Bluedroid enable failed: %s"
                          ),
                          esp_err_to_name(err)
                      );
                  }


                  bluedroid_enabled =
                      true;
              }


              // --------------------------------------------------------
              // GAP CALLBACK
              // --------------------------------------------------------

              esp_err_t err =
                  esp_bt_gap_register_callback(
                      bt_gap_callback
                  );


              if (
                  err != ESP_OK &&
                  err != ESP_ERR_INVALID_STATE
              ) {

                  mp_raise_msg_varg(
                      &mp_type_RuntimeError,
                      MP_ERROR_TEXT(
                          "GAP callback failed: %s"
                      ),
                      esp_err_to_name(err)
                  );
              }


              // --------------------------------------------------------
              // DEVICE NAME
              // --------------------------------------------------------

              err =
                  esp_bt_gap_set_device_name(
                      device_name
                  );


              if (
                  err != ESP_OK
              ) {

                  mp_raise_msg_varg(
                      &mp_type_RuntimeError,
                      MP_ERROR_TEXT(
                          "BT name failed: %s"
                      ),
                      esp_err_to_name(err)
                  );
              }


              // --------------------------------------------------------
              // DISCOVERABLE + CONNECTABLE
              // --------------------------------------------------------

              err =
                  esp_bt_gap_set_scan_mode(
                      ESP_BT_CONNECTABLE,
                      ESP_BT_GENERAL_DISCOVERABLE
                  );


              if (
                  err != ESP_OK
              ) {

                  mp_raise_msg_varg(
                      &mp_type_RuntimeError,
                      MP_ERROR_TEXT(
                          "BT scan mode failed: %s"
                      ),
                      esp_err_to_name(err)
                  );
              }


              // --------------------------------------------------------
              // SPP CALLBACK
              // --------------------------------------------------------

              err =
                  esp_spp_register_callback(
                      bt_spp_callback
                  );


              if (
                  err != ESP_OK
              ) {

                  mp_raise_msg_varg(
                      &mp_type_RuntimeError,
                      MP_ERROR_TEXT(
                          "SPP callback failed: %s"
                      ),
                      esp_err_to_name(err)
                  );
              }


              // --------------------------------------------------------
              // SPP CALLBACK MODE
              // --------------------------------------------------------
              //
              // This is the important part:
              //
              // ESP_SPP_MODE_CB
              //
              // received data arrives through
              // ESP_SPP_DATA_IND_EVT.
              //
              // --------------------------------------------------------

              err =
                  esp_spp_init(
                      ESP_SPP_MODE_CB
                  );


              if (
                  err != ESP_OK
              ) {

                  mp_raise_msg_varg(
                      &mp_type_RuntimeError,
                      MP_ERROR_TEXT(
                          "SPP init failed: %s"
                      ),
                      esp_err_to_name(err)
                  );
              }


              bt_running = true;
          }


          // ============================================================
          // begin(name, server)
          // ============================================================

          static mp_obj_t btserial_begin(
              size_t n_args,
              const mp_obj_t *args
          ) {

              const char *name =
                  mp_obj_str_get_str(
                      args[0]
                  );


              server_mode =
                  mp_obj_is_true(
                      args[1]
                  );


              bt_start_internal(
                  name
              );


              // --------------------------------------------------------
              // Wait for ESP_SPP_INIT_EVT
              // --------------------------------------------------------

              for (
                  int i = 0;
                  i < 100;
                  ++i
              ) {

                  if (
                      spp_initialized
                  ) {
                      break;
                  }

                  mp_hal_delay_ms(10);
              }


              if (
                  !spp_initialized
              ) {

                  mp_raise_msg(
                      &mp_type_RuntimeError,
                      MP_ERROR_TEXT(
                          "SPP initialization timeout"
                      )
                  );
              }


              // --------------------------------------------------------
              // SERVER
              // --------------------------------------------------------

              if (server_mode) {

                  esp_err_t err =
                      esp_spp_start_srv(
                          ESP_SPP_SEC_NONE,
                          ESP_SPP_ROLE_SLAVE,
                          BT_SPP_CHANNEL,
                          device_name
                      );


                  if (
                      err != ESP_OK
                  ) {

                      mp_raise_msg_varg(
                          &mp_type_RuntimeError,
                          MP_ERROR_TEXT(
                              "SPP server failed: %s"
                          ),
                          esp_err_to_name(err)
                      );
                  }
              }


              return mp_const_none;
          }


          static MP_DEFINE_CONST_FUN_OBJ_VAR_BETWEEN(
              btserial_begin_obj,
              2,
              2,
              btserial_begin
          );


          // ============================================================
          // connect(mac)
          // ============================================================

          static mp_obj_t btserial_connect(
              mp_obj_t mac_obj
          ) {

              mp_buffer_info_t buf;


              mp_get_buffer_raise(
                  mac_obj,
                  &buf,
                  MP_BUFFER_READ
              );


              if (
                  buf.len != 6
              ) {

                  mp_raise_ValueError(
                      MP_ERROR_TEXT(
                          "MAC must be 6 bytes"
                      )
                  );
              }


              if (!bt_running) {

                  mp_raise_msg(
                      &mp_type_RuntimeError,
                      MP_ERROR_TEXT(
                          "Bluetooth not started"
                      )
                  );
              }


              if (!spp_initialized) {

                  mp_raise_msg(
                      &mp_type_RuntimeError,
                      MP_ERROR_TEXT(
                          "SPP not initialized"
                      )
                  );
              }


              esp_bd_addr_t addr;


              memcpy(
                  addr,
                  buf.buf,
                  6
              );


              esp_err_t err =
                  esp_spp_connect(
                      ESP_SPP_SEC_NONE,
                      ESP_SPP_ROLE_MASTER,
                      BT_SPP_CHANNEL,
                      addr
                  );


              if (
                  err != ESP_OK
              ) {

                  mp_raise_msg_varg(
                      &mp_type_RuntimeError,
                      MP_ERROR_TEXT(
                          "SPP connect failed: %s"
                      ),
                      esp_err_to_name(err)
                  );
              }


              return mp_const_none;
          }


          static MP_DEFINE_CONST_FUN_OBJ_1(
              btserial_connect_obj,
              btserial_connect
          );


          // ============================================================
          // connected()
          // ============================================================

          static mp_obj_t btserial_connected(void) {

              return mp_obj_new_bool(
                  connected
              );
          }


          static MP_DEFINE_CONST_FUN_OBJ_0(
              btserial_connected_obj,
              btserial_connected
          );


          // ============================================================
          // available()
          // ============================================================

          static mp_obj_t btserial_available(void) {

              return MP_OBJ_NEW_SMALL_INT(
                  rx_available_internal()
              );
          }


          static MP_DEFINE_CONST_FUN_OBJ_0(
              btserial_available_obj,
              btserial_available
          );


          // ============================================================
          // read([n])
          // ============================================================

          static mp_obj_t btserial_read(
              size_t n_args,
              const mp_obj_t *args
          ) {

              size_t available =
                  rx_available_internal();


              size_t wanted;


              if (
                  n_args == 0
              ) {

                  wanted =
                      available;

              } else {

                  mp_int_t n =
                      mp_obj_get_int(
                          args[0]
                      );


                  if (
                      n < 0
                  ) {

                      wanted =
                          available;

                  } else {

                      wanted =
                          (size_t)n;
                  }
              }


              if (
                  wanted > available
              ) {

                  wanted =
                      available;
              }


              if (
                  wanted == 0
              ) {

                  return mp_const_empty_bytes;
              }


              vstr_t vstr;


              vstr_init_len(
                  &vstr,
                  wanted
              );


              size_t got =
                  rx_pop(
                      (uint8_t *)vstr.buf,
                      wanted
                  );


              if (
                  got != wanted
              ) {

                  vstr_cut_tail_bytes(
                      &vstr,
                      wanted - got
                  );
              }


              return mp_obj_new_bytes_from_vstr(
                  &vstr
              );
          }


          static MP_DEFINE_CONST_FUN_OBJ_VAR_BETWEEN(
              btserial_read_obj,
              0,
              1,
              btserial_read
          );


          // ============================================================
          // write(data)
          // ============================================================

          static mp_obj_t btserial_write(
              mp_obj_t data_obj
          ) {

              if (!connected) {

                  mp_raise_OSError(
                      MP_ENOTCONN
                  );
              }


              mp_buffer_info_t buf;


              mp_get_buffer_raise(
                  data_obj,
                  &buf,
                  MP_BUFFER_READ
              );


              if (
                  buf.len == 0
              ) {

                  return MP_OBJ_NEW_SMALL_INT(
                      0
                  );
              }


              esp_err_t err =
                  esp_spp_write(
                      spp_handle,
                      buf.len,
                      (uint8_t *)buf.buf
                  );


              if (
                  err != ESP_OK
              ) {

                  mp_raise_msg_varg(
                      &mp_type_OSError,
                      MP_ERROR_TEXT(
                          "SPP write failed: %s"
                      ),
                      esp_err_to_name(err)
                  );
              }


              return MP_OBJ_NEW_SMALL_INT(
                  buf.len
              );
          }


          static MP_DEFINE_CONST_FUN_OBJ_1(
              btserial_write_obj,
              btserial_write
          );


          // ============================================================
          // disconnect()
          // ============================================================

          static mp_obj_t btserial_disconnect(void) {

              if (
                  connected
              ) {

                  esp_spp_disconnect(
                      spp_handle
                  );
              }


              return mp_const_none;
          }


          static MP_DEFINE_CONST_FUN_OBJ_0(
              btserial_disconnect_obj,
              btserial_disconnect
          );


          // ============================================================
          // address()
          // ============================================================

          static mp_obj_t btserial_address(void) {

              esp_bd_addr_t addr;


              esp_err_t err =
                  esp_read_mac(
                      addr,
                      ESP_MAC_BT
                  );


              if (
                  err != ESP_OK
              ) {

                  mp_raise_msg_varg(
                      &mp_type_RuntimeError,
                      MP_ERROR_TEXT(
                          "BT MAC failed: %s"
                      ),
                      esp_err_to_name(err)
                  );
              }


              return mp_obj_new_bytes(
                  addr,
                  6
              );
          }


          static MP_DEFINE_CONST_FUN_OBJ_0(
              btserial_address_obj,
              btserial_address
          );


          // ============================================================
          // stop()
          // ============================================================

          static mp_obj_t btserial_stop(void) {

              if (!bt_running) {
                  return mp_const_none;
              }


              if (
                  connected
              ) {

                  esp_spp_disconnect(
                      spp_handle
                  );

                  connected = false;

                  spp_handle = 0;
              }


              if (
                  spp_initialized
              ) {

                  esp_spp_deinit();

                  spp_initialized =
                      false;
              }


              if (
                  bluedroid_enabled
              ) {

                  esp_bluedroid_disable();

                  bluedroid_enabled =
                      false;
              }


              if (
                  bluedroid_initialized
              ) {

                  esp_bluedroid_deinit();

                  bluedroid_initialized =
                      false;
              }


              if (
                  controller_enabled
              ) {

                  esp_bt_controller_disable();

                  controller_enabled =
                      false;
              }


              if (
                  controller_initialized
              ) {

                  esp_bt_controller_deinit();

                  controller_initialized =
                      false;
              }


              bt_running = false;

              server_mode = false;

              rx_clear();


              return mp_const_none;
          }


          static MP_DEFINE_CONST_FUN_OBJ_0(
              btserial_stop_obj,
              btserial_stop
          );


          // ============================================================
          // MODULE TABLE
          // ============================================================

          static const mp_rom_map_elem_t
          btserial_module_globals_table[] = {

              {
                  MP_ROM_QSTR(
                      MP_QSTR___name__
                  ),
                  MP_ROM_QSTR(
                      MP_QSTR_btserial
                  )
              },


              {
                  MP_ROM_QSTR(
                      MP_QSTR_begin
                  ),
                  MP_ROM_PTR(
                      &btserial_begin_obj
                  )
              },


              {
                  MP_ROM_QSTR(
                      MP_QSTR_connect
                  ),
                  MP_ROM_PTR(
                      &btserial_connect_obj
                  )
              },


              {
                  MP_ROM_QSTR(
                      MP_QSTR_connected
                  ),
                  MP_ROM_PTR(
                      &btserial_connected_obj
                  )
              },


              {
                  MP_ROM_QSTR(
                      MP_QSTR_available
                  ),
                  MP_ROM_PTR(
                      &btserial_available_obj
                  )
              },


              {
                  MP_ROM_QSTR(
                      MP_QSTR_read
                  ),
                  MP_ROM_PTR(
                      &btserial_read_obj
                  )
              },


              {
                  MP_ROM_QSTR(
                      MP_QSTR_write
                  ),
                  MP_ROM_PTR(
                      &btserial_write_obj
                  )
              },


              {
                  MP_ROM_QSTR(
                      MP_QSTR_disconnect
                  ),
                  MP_ROM_PTR(
                      &btserial_disconnect_obj
                  )
              },


              {
                  MP_ROM_QSTR(
                      MP_QSTR_address
                  ),
                  MP_ROM_PTR(
                      &btserial_address_obj
                  )
              },


              {
                  MP_ROM_QSTR(
                      MP_QSTR_stop
                  ),
                  MP_ROM_PTR(
                      &btserial_stop_obj
                  )
              },
          };


          // ============================================================
          // MODULE DICT
          // ============================================================

          static MP_DEFINE_CONST_DICT(
              btserial_module_globals,
              btserial_module_globals_table
          );


          // ============================================================
          // MODULE
          // ============================================================

          const mp_obj_module_t
          btserial_user_cmodule = {

              .base = {
                  &mp_type_module
              },

              .globals =
                  (mp_obj_dict_t *)
                  &btserial_module_globals,
          };


          MP_REGISTER_MODULE(
              MP_QSTR_btserial,
              btserial_user_cmodule
          );

          EOF


          echo ""
          echo "=============================================="
          echo "Bluetooth Classic SPP"
          echo "=============================================="
          echo ""
          echo "CMake:"
          cat btserial/micropython.cmake
          echo ""
          echo "Archivos:"
          ls -lh btserial/
          echo ""
          echo "=============================================="


      # ============================================================
      # COMPILAR FIRMWARE
      # ============================================================

      - name: Compilar firmware ESP32
        id: compile
        run: |
          set -o pipefail

          python3 make.py esp32 \
            BOARD=ESP32_GENERIC \
            BOARD_VARIANT= \
            PART_CSV=partitions-4mb-custom.csv \
            DISPLAY=st7789 \
            INDEV=xpt2046 \
            USER_C_MODULES="${GITHUB_WORKSPACE}/btserial/micropython.cmake" \
            CONFIG_BT_ENABLED=y \
            CONFIG_BT_BLUEDROID_ENABLED=y \
            CONFIG_BT_CLASSIC_ENABLED=y \
            CONFIG_BT_SPP_ENABLED=y \
            --flash-size=4 \
            --optimize-size \
            --ccache \
            LV_CFLAGS="-DLV_USE_IMAGE=1" \
            2>&1 | tee build.log


      # ============================================================
      # VERIFICAR FIRMWARE
      # ============================================================

      - name: Verificar firmware generado
        if: success()
        shell: bash
        run: |
          set -e

          FIRMWARE="build/lvgl_micropy_ESP32_GENERIC-4.bin"

          echo "=============================================="
          echo "Buscando firmware"
          echo "=============================================="
          echo ""

          if [ ! -f "$FIRMWARE" ]; then
            echo "ERROR: No se encontró:"
            echo "$FIRMWARE"
            echo ""
            echo "Todos los BIN encontrados:"
            find . -type f -name "*.bin" -print
            echo ""
            echo "Últimas líneas del build:"
            tail -n 200 build.log
            exit 1
          fi

          echo "Firmware encontrado:"
          ls -lh "$FIRMWARE"

          echo ""
          echo "Tamaño en bytes:"
          stat -c "%s" "$FIRMWARE"

          echo ""
          echo "=============================================="


      # ============================================================
      # EMPAQUETAR
      # ============================================================

      - name: Empaquetar firmware generado por LVGL MicroPython
        if: success()
        run: |
          mkdir -p final_firmware

          FIRMWARE="build/lvgl_micropy_ESP32_GENERIC-4.bin"

          if [ ! -f "$FIRMWARE" ]; then
            echo "ERROR: No se encontró el firmware final:"
            echo "$FIRMWARE"
            echo ""
            echo "Archivos binarios encontrados:"
            find . -type f -name "*.bin" -print
            exit 1
          fi

          cp "$FIRMWARE" \
            final_firmware/firmware_merged_0x0.bin

          cp "$FIRMWARE" \
            final_firmware/lvgl_micropy_ESP32_GENERIC-4.bin

          echo "Firmware encontrado:"
          ls -lh "$FIRMWARE"

          echo ""
          echo "Archivos finales:"
          ls -lh final_firmware/


      # ============================================================
      # SUBIR FIRMWARE
      # ============================================================

      - name: Subir Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-cyd-st7789
          path: final_firmware/


      # ============================================================
      # SUBIR LOGS
      # ============================================================

      - name: Subir Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
