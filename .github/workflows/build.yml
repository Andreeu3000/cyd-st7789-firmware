name: Compilar LVGL MicroPython - CYD ST7789

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar lvgl_micropython
        uses: actions/checkout@v4
        with:
          repository: lvgl-micropython/lvgl_micropython
          submodules: recursive
          fetch-depth: 1

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyelftools pyserial esptool
          if [ -f "lib/micropython/requirements.txt" ]; then
            pip install -r lib/micropython/requirements.txt
          fi

      - name: Crear y aplicar parche en network_wlan.c
        shell: bash
        run: |
          cat > patch.py <<'PY'
          import re
          from pathlib import Path

          path = Path("lib/micropython/ports/esp32/network_wlan.c")
          if not path.exists():
              raise SystemExit(f"ERROR: No existe el archivo {path}")

          text = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r'(\s*case\s+\(uintptr_t\)MP_OBJ_NEW_QSTR\(MP_QSTR_stations\):.*?)(?=\s*case\s+\(uintptr_t\)MP_OBJ_NEW_QSTR\(MP_QSTR_rssi\):)',
              re.DOTALL
          )

          if not pattern.search(text):
              raise SystemExit("ERROR: No se encontró la sección MP_QSTR_stations para parchear.")

          replacement = """        case (uintptr_t)MP_OBJ_NEW_QSTR(MP_QSTR_stations): {
                      require_if(args[0], ESP_IF_WIFI_AP);

                      wifi_sta_list_t station_list = {0};
                      wifi_sta_mac_ip_list_t mac_ip_list = {0};

                      esp_exceptions(
                          esp_wifi_ap_get_sta_list(&station_list)
                      );

                      esp_exceptions(
                          esp_wifi_ap_get_sta_list_with_ip(
                              &station_list,
                              &mac_ip_list
                          )
                      );

                      mp_obj_t list = mp_obj_new_list(0, NULL);

                      for (int i = 0; i < mac_ip_list.num; ++i) {
                          mp_obj_tuple_t *tuple = mp_obj_new_tuple(2, NULL);

                          tuple->items[0] = mp_obj_new_bytes(
                              mac_ip_list.sta[i].mac,
                              6
                          );

                          tuple->items[1] = netutils_format_ipv4_addr(
                              (uint8_t *)&mac_ip_list.sta[i].ip,
                              NETUTILS_BIG
                          );

                          mp_obj_list_append(
                              list,
                              MP_OBJ_FROM_PTR(tuple)
                          );
                      }

                      return list;
                  }
          """

          new_text = pattern.sub(replacement, text, count=1)
          path.write_text(new_text, encoding="utf-8")
          print("Parche aplicado correctamente.")
          PY

          python3 patch.py

      - name: Compilar firmware
        shell: bash
        run: |
          set -o pipefail

          python3 make.py esp32 \
            BOARD=ESP32_GENERIC \
            DISPLAY=st7789 \
            INDEV=xpt2046 \
            --flash-size=4 \
            --optimize-size \
            --ccache \
            LV_CFLAGS="-DLV_USE_IMAGE=1" \
            2>&1 | tee build.log

          STATUS=${PIPESTATUS[0]}

          echo ""
          echo "===== EXIT CODE ====="
          echo "$STATUS"

          echo ""
          echo "===== BINARIOS ====="
          find . -type f -name "*.bin" -print | sort || true

          echo ""
          echo "===== PROJECT BUILD COMPLETE ====="
          grep -n "Project build complete" build.log || true

          echo ""
          echo "===== ERRORES ====="
          grep -nE "FAILED:|ninja: build stopped|error:|Error:" build.log | tail -100 || true

          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi

      - name: Preparar firmware
        shell: bash
        run: |
          mkdir -p final_firmware

          # Buscar automáticamente el archivo .bin generado en el directorio de build
          BIN_FILE=$(find build -type f -name "*.bin" | grep -v "bootloader" | grep -v "partition" | head -n 1)

          if [ -z "$BIN_FILE" ]; then
            echo "ERROR: No se encontró ningún archivo .bin de firmware compilado."
            exit 1
          fi

          echo "Copiando firmware desde: $BIN_FILE"
          cp "$BIN_FILE" final_firmware/firmware.bin
          cp build.log final_firmware/build.log

          echo ""
          echo "===== ARCHIVOS FINALES ====="
          ls -lh final_firmware

      - name: Subir firmware
        uses: actions/upload-artifact@v4
        with:
          name: CYD-LVGL-MicroPython
          path: final_firmware/
          if-no-files-found: error
