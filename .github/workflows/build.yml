
name: Build CYD LVGL MicroPython

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            python3 \
            python3-venv \
            python3-pip \
            libusb-1.0-0-dev \
            git \
            ccache

      - name: Descargar LVGL MicroPython
        run: |
          git clone \
            https://github.com/lvgl-micropython/lvgl_micropython.git \
            firmware

      - name: Descargar dependencias de MicroPython
        working-directory: firmware
        run: |
          python3 - <<'PY'
          import builder
          builder.get_micropython()
          print("MicroPython descargado correctamente.")
          PY

          test -f lib/micropython/ports/esp32/mpconfigport.h

          echo "Configuración del heap encontrada:"
          grep -n "MICROPY_GC_SPLIT_HEAP" \
            lib/micropython/ports/esp32/mpconfigport.h || true

      - name: Ajustar el heap de Python
        working-directory: firmware
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "lib/micropython/ports/esp32/mpconfigport.h"
          )

          text = path.read_text(encoding="utf-8")

          if "cyd_mp_gc_alloc_heap" in text:
              print("El ajuste ya está aplicado.")
              raise SystemExit(0)

          marker = re.compile(
              r"^[ \t]*#define[ \t]+"
              r"MICROPY_GC_SPLIT_HEAP_AUTO\b.*$",
              re.MULTILINE,
          )

          match = marker.search(text)

          if not match:
              print("No se encontró la definición esperada.")
              print("Definiciones de heap encontradas:")
              for line in text.splitlines():
                  if "MICROPY_GC_" in line or "MP_PLAT_ALLOC_HEAP" in line:
                      print(line)
              raise SystemExit(
                  "No se aplicó el parche: revisa la versión descargada."
              )

          patch = r'''
          /*
           * CYD: limita el crecimiento automatico del heap
           * de Python para conservar memoria interna.
           */
          #include <stdlib.h>
          #include "esp_heap_caps.h"

          #ifndef MP_PLAT_ALLOC_HEAP
          static inline void *cyd_mp_gc_alloc_heap(size_t size) {
              const size_t reserve = 32 * 1024;
              const uint32_t caps =
                  MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT;

              size_t free_now =
                  heap_caps_get_free_size(caps);

              size_t largest =
                  heap_caps_get_largest_free_block(caps);

              if (largest < size ||
                  free_now < size + reserve) {
                  return NULL;
              }

              return malloc(size);
          }

          #define MP_PLAT_ALLOC_HEAP(size) \
              cyd_mp_gc_alloc_heap(size)
          #endif

          '''

          text = (
              text[:match.start()]
              + patch
              + text[match.start():]
          )

          path.write_text(text, encoding="utf-8")

          print("Parche de heap aplicado.")
          print("Reserva objetivo: 32 KiB.")
          PY

      - name: Crear particiones de 4 MB
        working-directory: firmware
        run: |
          cat > partitions-4mb-custom.csv <<'EOF'
          # Name,     Type, SubType, Offset,   Size, Flags
          nvs,        data, nvs,     0x9000,   0x5000,
          phy_init,   data, phy,     0xe000,   0x1000,
          factory,    app,  factory, 0x10000,  0x330000,
          EOF

      - name: Compilar firmware
        working-directory: firmware
        shell: bash
        run: |
          set -o pipefail

          python3 make.py esp32 \
            BOARD=ESP32_GENERIC \
            BOARD_VARIANT= \
            PART_CSV=partitions-4mb-custom.csv \
            DISPLAY=st7789 \
            INDEV=xpt2046 \
            --flash-size=4 \
            --optimize-size \
            --ccache \
            LV_CFLAGS="-DLV_USE_IMAGE=1" \
            2>&1 | tee build.log

      - name: Mostrar firmware generado
        if: always()
        working-directory: firmware
        run: |
          find build -type f -name "*.bin" -print || true
          tail -n 100 build.log || true

      - name: Guardar artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyd-lvgl-micropython
          path: |
            firmware/build/**/*.bin
            firmware/build.log
          if-no-files-found: warn
          retention-days: 14
