name: Compilar LVGL MicroPython - CYD ST7789

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar LVGL MicroPython
        run: |
          git clone --recursive https://github.com/lvgl-micropython/lvgl_micropython.git .

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            libusb-1.0-0-dev
          pip install esptool

      - name: Aplicar parche en network_wlan.c y Tabla de Particiones Ampliada
        shell: bash
        run: |
          # 1. Crear tabla de particiones personalizada de 4MB con 3.2MB para la App (Factory)
          cat > lib/micropython/ports/esp32/partitions-4mb-custom.csv <<'EOF'
          # Name,   Type, SubType, Offset,  Size, Flags
          nvs,      data, nvs,     0x9000,  0x6000,
          phy_init, data, phy,     0xf000,  0x1000,
          factory,  app,  factory, 0x10000, 0x330000,
          EOF

          # 2. Aplicar parche C en network_wlan.c
          cat > patch.py <<'PY'
          import re
          from pathlib import Path

          path = Path("lib/micropython/ports/esp32/network_wlan.c")

          if not path.exists():
              raise SystemExit(f"ERROR: No se encontró el archivo en {path}")

          text = path.read_text(encoding="utf-8")

          # Header de utilidades de red de MicroPython
          if '#include "shared/netutils/netutils.h"' not in text:
              text = '#include "shared/netutils/netutils.h"\n' + text

          # Header oficial para wifi_sta_mac_ip_list_t
          if '#include "esp_wifi_ap_get_sta_list.h"' not in text:
              text = '#include "esp_wifi_ap_get_sta_list.h"\n' + text

          # Header oficial ESP-NETIF para DHCP, ARP y esp_netif_pair_mac_ip_t
          if '#include "esp_netif.h"' not in text:
              text = '#include "esp_netif.h"\n' + text

          # ============================================================
          # stations()
          # MAC + IP usando DHCP y ARP
          # ============================================================

          patch_code = """        case (uintptr_t)MP_OBJ_NEW_QSTR(MP_QSTR_stations): {
                      // Return list of connected stations with MAC + IPv4.
                      require_if(args[0], ESP_IF_WIFI_AP);

                      wifi_sta_list_t station_list;

                      esp_exceptions(
                          esp_wifi_ap_get_sta_list(&station_list)
                      );

                      wifi_sta_mac_ip_list_t mac_ip_list;

                      esp_exceptions(
                          esp_wifi_ap_get_sta_list_with_ip(
                              &station_list,
                              &mac_ip_list
                          )
                      );

                      mp_obj_t list = mp_obj_new_list(0, NULL);

                      int count = mac_ip_list.num;

                      esp_netif_pair_mac_ip_t *source =
                          (esp_netif_pair_mac_ip_t *)mac_ip_list.sta;

                      for (int i = 0; i < count; ++i) {
                          mp_obj_t tuple_items[2];

                          tuple_items[0] =
                              mp_obj_new_bytes(
                                  source[i].mac,
                                  sizeof(source[i].mac)
                              );

                          tuple_items[1] =
                              source[i].ip.addr != 0
                              ? netutils_format_ipv4_addr(
                                  (uint8_t *)(&source[i].ip),
                                  NETUTILS_BIG
                              )
                              : mp_const_none;

                          mp_obj_list_append(
                              list,
                              mp_obj_new_tuple(2, tuple_items)
                          );
                      }

                      return list;
                  }"""

          pattern = re.compile(
              r'case\s+\(uintptr_t\)MP_OBJ_NEW_QSTR\(MP_QSTR_stations\):.*?(?=\s*case\s+\(uintptr_t\)MP_OBJ_NEW_QSTR\(MP_QSTR_rssi\):)',
              re.DOTALL
          )

          new_text, count = pattern.subn(
              patch_code + "\n",
              text
          )

          if count == 0:
              raise SystemExit(
                  "ERROR: No se pudo reemplazar la sección MP_QSTR_stations."
              )

          text = new_text

          # ============================================================
          # NUEVAS FUNCIONES DE RED
          # ============================================================

          new_functions = r'''
          // ============================================================
          // SoftAP / DHCP / station control
          // ============================================================


          // ------------------------------------------------------------
          // Helper interno:
          // obtiene el esp-netif del SoftAP.
          // ------------------------------------------------------------

          static esp_netif_t *network_wlan_get_ap_netif(void) {
              esp_netif_t *ap =
                  esp_netif_get_handle_from_ifkey("WIFI_AP_DEF");

              if (ap == NULL) {
                  mp_raise_RuntimeError(
                      MP_ERROR_TEXT("AP netif not ready")
                  );
              }

              return ap;
          }


          // ------------------------------------------------------------
          // dhcp_status()
          //
          // Devuelve:
          // "started"
          // "stopped"
          // "init"
          // ------------------------------------------------------------

          static mp_obj_t network_wlan_dhcp_status(
              mp_obj_t self_in
          ) {
              require_if(self_in, ESP_IF_WIFI_AP);

              esp_netif_t *ap =
                  network_wlan_get_ap_netif();

              esp_netif_dhcp_status_t status;

              esp_exceptions(
                  esp_netif_dhcps_get_status(
                      ap,
                      &status
                  )
              );

              if (status == ESP_NETIF_DHCP_STARTED) {
                  return MP_OBJ_NEW_QSTR(
                      MP_QSTR_started
                  );
              }

              if (status == ESP_NETIF_DHCP_STOPPED) {
                  return MP_OBJ_NEW_QSTR(
                      MP_QSTR_stopped
                  );
              }

              return MP_OBJ_NEW_QSTR(
                  MP_QSTR_init
              );
          }

          static MP_DEFINE_CONST_FUN_OBJ_1(
              network_wlan_dhcp_status_obj,
              network_wlan_dhcp_status
          );


          // ------------------------------------------------------------
          // dhcp_start()
          // ------------------------------------------------------------

          static mp_obj_t network_wlan_dhcp_start(
              mp_obj_t self_in
          ) {
              require_if(self_in, ESP_IF_WIFI_AP);

              esp_netif_t *ap =
                  network_wlan_get_ap_netif();

              esp_err_t err =
                  esp_netif_dhcps_start(ap);

              if (err != ESP_OK &&
                  err != ESP_ERR_ESP_NETIF_DHCP_ALREADY_STARTED) {

                  esp_exceptions(err);
              }

              return mp_const_none;
          }

          static MP_DEFINE_CONST_FUN_OBJ_1(
              network_wlan_dhcp_start_obj,
              network_wlan_dhcp_start
          );


          // ------------------------------------------------------------
          // dhcp_stop()
          // ------------------------------------------------------------

          static mp_obj_t network_wlan_dhcp_stop(
              mp_obj_t self_in
          ) {
              require_if(self_in, ESP_IF_WIFI_AP);

              esp_netif_t *ap =
                  network_wlan_get_ap_netif();

              esp_err_t err =
                  esp_netif_dhcps_stop(ap);

              if (err != ESP_OK &&
                  err != ESP_ERR_ESP_NETIF_DHCP_ALREADY_STOPPED) {

                  esp_exceptions(err);
              }

              return mp_const_none;
          }

          static MP_DEFINE_CONST_FUN_OBJ_1(
              network_wlan_dhcp_stop_obj,
              network_wlan_dhcp_stop
          );


          // ------------------------------------------------------------
          // dhcp_restart()
          //
          // Reinicia SOLAMENTE DHCP.
          // No apaga WiFi ni el SoftAP.
          // ------------------------------------------------------------

          static mp_obj_t network_wlan_dhcp_restart(
              mp_obj_t self_in
          ) {
              require_if(self_in, ESP_IF_WIFI_AP);

              esp_netif_t *ap =
                  network_wlan_get_ap_netif();

              esp_err_t err;

              err = esp_netif_dhcps_stop(ap);

              if (err != ESP_OK &&
                  err != ESP_ERR_ESP_NETIF_DHCP_ALREADY_STOPPED) {

                  esp_exceptions(err);
              }

              err = esp_netif_dhcps_start(ap);

              if (err != ESP_OK &&
                  err != ESP_ERR_ESP_NETIF_DHCP_ALREADY_STARTED) {

                  esp_exceptions(err);
              }

              return mp_const_none;
          }

          static MP_DEFINE_CONST_FUN_OBJ_1(
              network_wlan_dhcp_restart_obj,
              network_wlan_dhcp_restart
          );


          // ------------------------------------------------------------
          // dhcp_ip(mac)
          //
          // Busca primero en DHCP.
          // Si no encuentra IP, intenta ARP.
          //
          // Devuelve:
          // "192.168.4.2"
          // o None.
          // ------------------------------------------------------------

          static mp_obj_t network_wlan_dhcp_ip(
              mp_obj_t self_in,
              mp_obj_t mac_in
          ) {
              require_if(self_in, ESP_IF_WIFI_AP);

              mp_buffer_info_t bufinfo;

              mp_get_buffer_raise(
                  mac_in,
                  &bufinfo,
                  MP_BUFFER_READ
              );

              if (bufinfo.len != 6) {
                  mp_raise_ValueError(
                      MP_ERROR_TEXT("MAC must be 6 bytes")
                  );
              }

              esp_netif_t *ap =
                  network_wlan_get_ap_netif();

              esp_netif_pair_mac_ip_t pair;

              memset(
                  &pair,
                  0,
                  sizeof(pair)
              );

              memcpy(
                  pair.mac,
                  bufinfo.buf,
                  6
              );

              esp_err_t err;

              err = esp_netif_dhcps_get_clients_by_mac(
                  ap,
                  1,
                  &pair
              );

              if (err != ESP_OK &&
                  err != ESP_ERR_NOT_SUPPORTED) {

                  esp_exceptions(err);
              }

              if (pair.ip.addr == 0) {
                  esp_netif_arp_get_client_by_mac(
                      ap,
                      &pair
                  );
              }

              if (pair.ip.addr == 0) {
                  return mp_const_none;
              }

              return netutils_format_ipv4_addr(
                  (uint8_t *)(&pair.ip),
                  NETUTILS_BIG
              );
          }

          static MP_DEFINE_CONST_FUN_OBJ_2(
              network_wlan_dhcp_ip_obj,
              network_wlan_dhcp_ip
          );


          // ------------------------------------------------------------
          // get_sta_list()
          //
          // Lista PURA de estaciones WiFi asociadas.
          //
          // No depende de DHCP.
          //
          // Devuelve:
          // [
          //   (MAC, RSSI),
          //   ...
          // ]
          // ------------------------------------------------------------

          static mp_obj_t network_wlan_get_sta_list(
              mp_obj_t self_in
          ) {
              require_if(self_in, ESP_IF_WIFI_AP);

              wifi_sta_list_t station_list;

              memset(
                  &station_list,
                  0,
                  sizeof(station_list)
              );

              esp_exceptions(
                  esp_wifi_ap_get_sta_list(
                      &station_list
                  )
              );

              mp_obj_t list =
                  mp_obj_new_list(0, NULL);

              for (int i = 0;
                   i < station_list.num;
                   ++i) {

                  mp_obj_t tuple_items[2];

                  tuple_items[0] =
                      mp_obj_new_bytes(
                          station_list.sta[i].mac,
                          6
                      );

                  tuple_items[1] =
                      MP_OBJ_NEW_SMALL_INT(
                          station_list.sta[i].rssi
                      );

                  mp_obj_list_append(
                      list,
                      mp_obj_new_tuple(
                          2,
                          tuple_items
                      )
                  );
              }

              return list;
          }

          static MP_DEFINE_CONST_FUN_OBJ_1(
              network_wlan_get_sta_list_obj,
              network_wlan_get_sta_list
          );


          // ------------------------------------------------------------
          // get_aid(mac)
          //
          // Devuelve AID de una estación.
          // Si no está asociada, ESP-IDF devuelve error.
          // ------------------------------------------------------------

          static mp_obj_t network_wlan_get_aid(
              mp_obj_t self_in,
              mp_obj_t mac_in
          ) {
              require_if(self_in, ESP_IF_WIFI_AP);

              mp_buffer_info_t bufinfo;

              mp_get_buffer_raise(
                  mac_in,
                  &bufinfo,
                  MP_BUFFER_READ
              );

              if (bufinfo.len != 6) {
                  mp_raise_ValueError(
                      MP_ERROR_TEXT("MAC must be 6 bytes")
                  );
              }

              uint16_t aid = 0;

              esp_err_t err =
                  esp_wifi_ap_get_sta_aid(
                      (const uint8_t *)bufinfo.buf,
                      &aid
                  );

              if (err == ESP_ERR_NOT_FOUND) {
                  return mp_const_none;
              }

              if (err != ESP_OK) {
                  esp_exceptions(err);
              }

              return MP_OBJ_NEW_SMALL_INT(aid);
          }

          static MP_DEFINE_CONST_FUN_OBJ_2(
              network_wlan_get_aid_obj,
              network_wlan_get_aid
          );


          // ------------------------------------------------------------
          // get_sta_info(mac)
          //
          // Devuelve:
          // {
          //   mac: bytes,
          //   aid: int,
          //   rssi: int
          // }
          // ------------------------------------------------------------

          static mp_obj_t network_wlan_get_sta_info(
              mp_obj_t self_in,
              mp_obj_t mac_in
          ) {
              require_if(self_in, ESP_IF_WIFI_AP);

              mp_buffer_info_t bufinfo;

              mp_get_buffer_raise(
                  mac_in,
                  &bufinfo,
                  MP_BUFFER_READ
              );

              if (bufinfo.len != 6) {
                  mp_raise_ValueError(
                      MP_ERROR_TEXT("MAC must be 6 bytes")
                  );
              }

              wifi_sta_list_t station_list;

              memset(
                  &station_list,
                  0,
                  sizeof(station_list)
              );

              esp_exceptions(
                  esp_wifi_ap_get_sta_list(
                      &station_list
                  )
              );

              int found = -1;

              for (int i = 0;
                   i < station_list.num;
                   ++i) {

                  if (memcmp(
                          station_list.sta[i].mac,
                          bufinfo.buf,
                          6
                      ) == 0) {

                      found = i;
                      break;
                  }
              }

              if (found < 0) {
                  return mp_const_none;
              }

              uint16_t aid = 0;

              esp_err_t err =
                  esp_wifi_ap_get_sta_aid(
                      (const uint8_t *)bufinfo.buf,
                      &aid
                  );

              if (err != ESP_OK &&
                  err != ESP_ERR_NOT_FOUND) {

                  esp_exceptions(err);
              }

              mp_obj_t dict =
                  mp_obj_new_dict(3);

              mp_obj_dict_store(
                  dict,
                  MP_OBJ_NEW_QSTR(MP_QSTR_mac),
                  mp_obj_new_bytes(
                      station_list.sta[found].mac,
                      6
                  )
              );

              mp_obj_dict_store(
                  dict,
                  MP_OBJ_NEW_QSTR(MP_QSTR_aid),
                  MP_OBJ_NEW_SMALL_INT(aid)
              );

              mp_obj_dict_store(
                  dict,
                  MP_OBJ_NEW_QSTR(MP_QSTR_rssi),
                  MP_OBJ_NEW_SMALL_INT(
                      station_list.sta[found].rssi
                  )
              );

              return dict;
          }

          static MP_DEFINE_CONST_FUN_OBJ_2(
              network_wlan_get_sta_info_obj,
              network_wlan_get_sta_info
          );


          // ------------------------------------------------------------
          // get_ap_info()
          //
          // Para STA:
          // devuelve información básica del AP conectado.
          //
          // {
          //   ssid,
          //   bssid,
          //   channel,
          //   rssi
          // }
          // ------------------------------------------------------------

          static mp_obj_t network_wlan_get_ap_info(
              mp_obj_t self_in
          ) {
              require_if(self_in, ESP_IF_WIFI_STA);

              wifi_ap_record_t ap_info;

              memset(
                  &ap_info,
                  0,
                  sizeof(ap_info)
              );

              esp_exceptions(
                  esp_wifi_sta_get_ap_info(
                      &ap_info
                  )
              );

              mp_obj_t dict =
                  mp_obj_new_dict(4);

              size_t ssid_len = 0;

              while (ssid_len < sizeof(ap_info.ssid) &&
                     ap_info.ssid[ssid_len] != 0) {
                  ssid_len++;
              }

              mp_obj_dict_store(
                  dict,
                  MP_OBJ_NEW_QSTR(MP_QSTR_ssid),
                  mp_obj_new_str(
                      (const char *)ap_info.ssid,
                      ssid_len
                  )
              );

              mp_obj_dict_store(
                  dict,
                  MP_OBJ_NEW_QSTR(MP_QSTR_bssid),
                  mp_obj_new_bytes(
                      ap_info.bssid,
                      6
                  )
              );

              mp_obj_dict_store(
                  dict,
                  MP_OBJ_NEW_QSTR(MP_QSTR_channel),
                  MP_OBJ_NEW_SMALL_INT(
                      ap_info.primary
                  )
              );

              mp_obj_dict_store(
                  dict,
                  MP_OBJ_NEW_QSTR(MP_QSTR_rssi),
                  MP_OBJ_NEW_SMALL_INT(
                      ap_info.rssi
                  )
              );

              return dict;
          }

          static MP_DEFINE_CONST_FUN_OBJ_1(
              network_wlan_get_ap_info_obj,
              network_wlan_get_ap_info
          );


          // ============================================================
          // Funciones que ya tenías
          // ============================================================


          // Expulsa una estación usando su MAC.
          // ap.deauth(b"\xAA\xBB\xCC\xDD\xEE\xFF")
          static mp_obj_t network_wlan_deauth(
              mp_obj_t self_in,
              mp_obj_t mac_in
          ) {
              require_if(self_in, ESP_IF_WIFI_AP);

              mp_buffer_info_t bufinfo;

              mp_get_buffer_raise(
                  mac_in,
                  &bufinfo,
                  MP_BUFFER_READ
              );

              if (bufinfo.len != 6) {
                  mp_raise_ValueError(
                      MP_ERROR_TEXT("MAC must be 6 bytes")
                  );
              }

              uint16_t aid = 0;

              esp_exceptions(
                  esp_wifi_ap_get_sta_aid(
                      (const uint8_t *)bufinfo.buf,
                      &aid
                  )
              );

              esp_exceptions(
                  esp_wifi_deauth_sta(aid)
              );

              return mp_const_none;
          }

          static MP_DEFINE_CONST_FUN_OBJ_2(
              network_wlan_deauth_obj,
              network_wlan_deauth
          );


          // Expulsa una estación directamente usando su AID.
          static mp_obj_t network_wlan_deauth_aid(
              mp_obj_t self_in,
              mp_obj_t aid_in
          ) {
              require_if(self_in, ESP_IF_WIFI_AP);

              uint16_t aid =
                  mp_obj_get_int(aid_in);

              if (aid == 0) {
                  mp_raise_ValueError(
                      MP_ERROR_TEXT(
                          "AID 0 is reserved for deauth_all()"
                      )
                  );
              }

              esp_exceptions(
                  esp_wifi_deauth_sta(aid)
              );

              return mp_const_none;
          }

          static MP_DEFINE_CONST_FUN_OBJ_2(
              network_wlan_deauth_aid_obj,
              network_wlan_deauth_aid
          );


          // Expulsa TODAS las estaciones asociadas.
          static mp_obj_t network_wlan_deauth_all(
              mp_obj_t self_in
          ) {
              require_if(self_in, ESP_IF_WIFI_AP);

              esp_exceptions(
                  esp_wifi_deauth_sta(0)
              );

              return mp_const_none;
          }

          static MP_DEFINE_CONST_FUN_OBJ_1(
              network_wlan_deauth_all_obj,
              network_wlan_deauth_all
          );


          // Cambia el tiempo de inactividad del SoftAP.
          static mp_obj_t network_wlan_set_inactive_time(
              mp_obj_t self_in,
              mp_obj_t seconds_in
          ) {
              require_if(self_in, ESP_IF_WIFI_AP);

              uint16_t seconds =
                  mp_obj_get_int(seconds_in);

              if (seconds < 10) {
                  mp_raise_ValueError(
                      MP_ERROR_TEXT(
                          "minimum inactive time is 10 seconds"
                      )
                  );
              }

              esp_exceptions(
                  esp_wifi_set_inactive_time(
                      WIFI_IF_AP,
                      seconds
                  )
              );

              return mp_const_none;
          }

          static MP_DEFINE_CONST_FUN_OBJ_2(
              network_wlan_set_inactive_time_obj,
              network_wlan_set_inactive_time
          );


          // Obtiene el tiempo de inactividad configurado.
          static mp_obj_t network_wlan_get_inactive_time(
              mp_obj_t self_in
          ) {
              require_if(self_in, ESP_IF_WIFI_AP);

              uint16_t seconds = 0;

              esp_exceptions(
                  esp_wifi_get_inactive_time(
                      WIFI_IF_AP,
                      &seconds
                  )
              );

              return MP_OBJ_NEW_SMALL_INT(seconds);
          }

          static MP_DEFINE_CONST_FUN_OBJ_1(
              network_wlan_get_inactive_time_obj,
              network_wlan_get_inactive_time
          );

          '''

          # Insertar funciones antes de la tabla de métodos.
          marker = "static const mp_rom_map_elem_t wlan_if_locals_dict_table[] = {"

          if marker not in text:
              raise SystemExit(
                  "ERROR: No se encontró wlan_if_locals_dict_table."
              )

          if "network_wlan_deauth_obj" in text:
              raise SystemExit(
                  "ERROR: Las funciones nuevas ya existen en network_wlan.c."
              )

          text = text.replace(
              marker,
              new_functions + "\n" + marker,
              1
          )

          # ============================================================
          # Registrar todos los métodos nuevos
          # ============================================================

          table_marker = (
              '    { MP_ROM_QSTR(MP_QSTR_status), '
              'MP_ROM_PTR(&network_wlan_status_obj) },'
          )

          table_addition = '''
              { MP_ROM_QSTR(MP_QSTR_dhcp_status),
                MP_ROM_PTR(&network_wlan_dhcp_status_obj) },

              { MP_ROM_QSTR(MP_QSTR_dhcp_start),
                MP_ROM_PTR(&network_wlan_dhcp_start_obj) },

              { MP_ROM_QSTR(MP_QSTR_dhcp_stop),
                MP_ROM_PTR(&network_wlan_dhcp_stop_obj) },

              { MP_ROM_QSTR(MP_QSTR_dhcp_restart),
                MP_ROM_PTR(&network_wlan_dhcp_restart_obj) },

              { MP_ROM_QSTR(MP_QSTR_dhcp_ip),
                MP_ROM_PTR(&network_wlan_dhcp_ip_obj) },

              { MP_ROM_QSTR(MP_QSTR_get_sta_list),
                MP_ROM_PTR(&network_wlan_get_sta_list_obj) },

              { MP_ROM_QSTR(MP_QSTR_get_aid),
                MP_ROM_PTR(&network_wlan_get_aid_obj) },

              { MP_ROM_QSTR(MP_QSTR_get_sta_info),
                MP_ROM_PTR(&network_wlan_get_sta_info_obj) },

              { MP_ROM_QSTR(MP_QSTR_get_ap_info),
                MP_ROM_PTR(&network_wlan_get_ap_info_obj) },

              { MP_ROM_QSTR(MP_QSTR_deauth),
                MP_ROM_PTR(&network_wlan_deauth_obj) },

              { MP_ROM_QSTR(MP_QSTR_deauth_aid),
                MP_ROM_PTR(&network_wlan_deauth_aid_obj) },

              { MP_ROM_QSTR(MP_QSTR_deauth_all),
                MP_ROM_PTR(&network_wlan_deauth_all_obj) },

              { MP_ROM_QSTR(MP_QSTR_set_inactive_time),
                MP_ROM_PTR(&network_wlan_set_inactive_time_obj) },

              { MP_ROM_QSTR(MP_QSTR_get_inactive_time),
                MP_ROM_PTR(&network_wlan_get_inactive_time_obj) },'''

          if table_marker not in text:
              raise SystemExit(
                  "ERROR: No se encontró la entrada status en la tabla WLAN."
              )

          text = text.replace(
              table_marker,
              table_marker + "\n" + table_addition,
              1
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("Parche C aplicado exitosamente.")
          print("Funciones nuevas:")
          print("  - ap.dhcp_status()")
          print("  - ap.dhcp_start()")
          print("  - ap.dhcp_stop()")
          print("  - ap.dhcp_restart()")
          print("  - ap.dhcp_ip(mac)")
          print("  - ap.get_sta_list()")
          print("  - ap.get_aid(mac)")
          print("  - ap.get_sta_info(mac)")
          print("  - sta.get_ap_info()")
          print("  - ap.deauth(mac)")
          print("  - ap.deauth_aid(aid)")
          print("  - ap.deauth_all()")
          print("  - ap.set_inactive_time(seconds)")
          print("  - ap.get_inactive_time()")
          PY

          python3 patch.py

      - name: Compilar firmware ESP32
        id: compile
        run: |
          set -o pipefail

          python3 make.py esp32 \
            BOARD=ESP32_GENERIC \
            BOARD_VARIANT= \
            PART_CSV=partitions-4mb-custom.csv \
            DISPLAY=st7789 \
            INDEV=xpt2046 \
            --flash-size=4 \
            --optimize-size \
            --ccache \
            LV_CFLAGS="-DLV_USE_IMAGE=1" \
            2>&1 | tee build.log

      - name: Crear imagen binaria unificada (0x0) y empaquetar
        if: success()
        run: |
          BUILD_DIR="lib/micropython/ports/esp32/build-ESP32_GENERIC"

          mkdir -p final_firmware

          BOOTLOADER="$BUILD_DIR/bootloader/bootloader.bin"
          PARTITION="$BUILD_DIR/partition_table/partition-table.bin"
          APP="$BUILD_DIR/micropython.bin"

          if [ ! -f "$APP" ]; then
            APP="$BUILD_DIR/firmware.bin"
          fi

          # Copiar archivos individuales
          cp "$BOOTLOADER" final_firmware/bootloader.bin
          cp "$PARTITION" final_firmware/partition-table.bin
          cp "$APP" final_firmware/app_micropython.bin

          # Unificar los 3 archivos en un único binario completo listo para grabar en 0x0
          python3 -m esptool --chip esp32 merge_bin \
            -o final_firmware/firmware_merged_0x0.bin \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 4MB \
            0x1000 "$BOOTLOADER" \
            0x8000 "$PARTITION" \
            0x10000 "$APP"

          echo "Archivos listos en final_firmware:"
          ls -lh final_firmware/

      - name: Subir Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-cyd-st7789
          path: final_firmware/

      - name: Subir Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
