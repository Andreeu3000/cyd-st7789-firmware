
name: Build CYD LVGL MicroPython

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            python3 \
            python3-venv \
            python3-pip \
            git \
            wget \
            curl \
            ccache \
            libusb-1.0-0-dev

      - name: Descargar lvgl_micropython
        run: |
          git clone --recursive \
            https://github.com/lvgl-micropython/lvgl_micropython.git \
            firmware
          cd firmware

      - name: Crear particiones de 4 MB
        working-directory: firmware
        run: |
          cat > partitions-4mb-custom.csv <<'EOF'
          # Name,     Type, SubType, Offset,   Size, Flags
          nvs,        data, nvs,     0x9000,   0x5000,
          phy_init,   data, phy,     0xe000,   0x1000,
          factory,    app,  factory, 0x10000,  0x330000,
          EOF

      - name: Reservar memoria interna para Wi-Fi
        working-directory: firmware
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "lib/micropython/ports/esp32/mpconfigport.h"
          )

          if not path.exists():
              raise SystemExit(
                  f"No se encontró el archivo: {path}"
              )

          text = path.read_text(encoding="utf-8")

          marker = "#define MICROPY_GC_SPLIT_HEAP_AUTO (1)"

          if marker not in text:
              raise SystemExit(
                  "No se encontró MICROPY_GC_SPLIT_HEAP_AUTO. "
                  "La estructura de MicroPython ha cambiado."
              )

          if "cyd_mp_gc_alloc_heap" in text:
              print("La reserva del heap ya está aplicada.")
              raise SystemExit(0)

          patch = r'''
          /*
           * CYD: limitar el crecimiento automatico del heap
           * de MicroPython para conservar memoria interna
           * destinada a Wi-Fi, lwIP y ESP-IDF.
           */
          #include <stdlib.h>
          #include "esp_heap_caps.h"

          #ifndef MP_PLAT_ALLOC_HEAP
          static inline void *cyd_mp_gc_alloc_heap(size_t size) {
              const size_t reserve = 32 * 1024;
              const uint32_t caps =
                  MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT;

              size_t free_now =
                  heap_caps_get_free_size(caps);

              size_t largest =
                  heap_caps_get_largest_free_block(caps);

              if (largest < size ||
                  free_now < size + reserve) {
                  return NULL;
              }

              return malloc(size);
          }

          #define MP_PLAT_ALLOC_HEAP(size) \
              cyd_mp_gc_alloc_heap(size)
          #endif
          '''

          text = text.replace(
              marker,
              patch + "\n" + marker,
              1
          )

          path.write_text(text, encoding="utf-8")
          print("Reserva de 32 KiB aplicada.")
          PY

      - name: Compilar firmware ESP32
        working-directory: firmware
        shell: bash
        run: |
          set -o pipefail

          python3 make.py esp32 \
            BOARD=ESP32_GENERIC \
            BOARD_VARIANT= \
            PART_CSV=partitions-4mb-custom.csv \
            DISPLAY=st7789 \
            INDEV=xpt2046 \
            --flash-size=4 \
            --optimize-size \
            --ccache \
            LV_CFLAGS="-DLV_USE_IMAGE=1" \
            2>&1 | tee build.log

      - name: Mostrar archivos generados
        if: always()
        working-directory: firmware
        run: |
          echo "Archivos BIN encontrados:"
          find build -type f -name "*.bin" -print || true

          echo "Archivos de registro:"
          find . -maxdepth 3 \
            \( -name "build.log" -o -name "idf*.log" \) \
            -print || true

      - name: Subir firmware y registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyd-lvgl-micropython
          path: |
            firmware/build/**/*.bin
            firmware/build.log
            firmware/**/*.log
          if-no-files-found: warn
          retention-days: 14
