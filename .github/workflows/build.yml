name: Compilar LVGL MicroPython - CYD ST7789

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Clonar LVGL MicroPython
        run: |
          git clone --recursive https://github.com/lvgl-micropython/lvgl_micropython.git .

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            libusb-1.0-0-dev

      - name: Modificar network_wlan.c
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "lib/micropython/ports/esp32/network_wlan.c"
          )

          text = path.read_text()

          # -------------------------------------------------
          # 1. Añadir cabecera ESP-IDF para obtener IPs
          # -------------------------------------------------

          include = '#include "esp_wifi_ap_get_sta_list.h"\n'

          if include not in text:

              anchor = '#include "esp_wifi.h"\n'

              if anchor not in text:
                  raise SystemExit(
                      'No se encontró #include "esp_wifi.h"'
                  )

              text = text.replace(
                  anchor,
                  anchor + include,
                  1
              )

          # -------------------------------------------------
          # 2. Añadir stations_ip
          # -------------------------------------------------

          if "MP_QSTR_stations_ip" in text:
              print("stations_ip ya existe.")
              path.write_text(text)
              raise SystemExit(0)

          marker = (
              '        case (uintptr_t)MP_OBJ_NEW_QSTR('
              'MP_QSTR_rssi): {'
          )

          if marker not in text:
              raise SystemExit(
                  "No se encontró el bloque rssi de network_wlan.c"
              )

          new_case = r'''        case (uintptr_t)MP_OBJ_NEW_QSTR(MP_QSTR_stations_ip): {
              require_if(args[0], ESP_IF_WIFI_AP);

              wifi_sta_list_t station_list = {0};
              wifi_sta_mac_ip_list_t station_ip_list = {0};

              esp_exceptions(
                  esp_wifi_ap_get_sta_list(&station_list)
              );

              esp_exceptions(
                  esp_wifi_ap_get_sta_list_with_ip(
                      &station_list,
                      &station_ip_list
                  )
              );

              mp_obj_t list = mp_obj_new_list(0, NULL);

              for (int i = 0; i < station_ip_list.num; ++i) {

                  char ip_str[16];

                  snprintf(
                      ip_str,
                      sizeof(ip_str),
                      IPSTR,
                      IP2STR(&station_ip_list.sta[i].ip)
                  );

                  mp_obj_t tuple_items[2];

                  tuple_items[0] = mp_obj_new_bytes(
                      station_ip_list.sta[i].mac,
                      6
                  );

                  tuple_items[1] =
                      mp_obj_new_str_from_cstr(ip_str);

                  mp_obj_list_append(
                      list,
                      mp_obj_new_tuple(
                          2,
                          tuple_items
                      )
                  );
              }

              return list;
          }

  '''

          text = text.replace(
              marker,
              new_case + marker,
              1
          )

          path.write_text(text)

          print("network_wlan.c modificado correctamente.")
          print("stations_ip añadido.")
          PY

      - name: Compilar firmware ESP32
        id: compile
        run: |
          set -o pipefail

          python3 make.py esp32 \
            BOARD=ESP32_GENERIC \
            DISPLAY=st7789 \
            INDEV=xpt2046 \
            --flash-size=4 \
            --optimize-size \
            --ccache \
            LV_CFLAGS="-DLV_USE_IMAGE=1" \
            2>&1 | tee build.log

      - name: Preparar firmware final
        if: success()
        run: |
          BUILD_DIR="lib/micropython/ports/esp32/build-ESP32_GENERIC"

          mkdir -p final_firmware

          if [ -f "$BUILD_DIR/micropython.bin" ]; then
            cp "$BUILD_DIR/micropython.bin" \
              final_firmware/micropython.bin
          fi

          if [ -f "$BUILD_DIR/bootloader/bootloader.bin" ]; then
            cp "$BUILD_DIR/bootloader/bootloader.bin" \
              final_firmware/bootloader.bin
          fi

          if [ -f "$BUILD_DIR/partition_table/partition-table.bin" ]; then
            cp "$BUILD_DIR/partition_table/partition-table.bin" \
              final_firmware/partition-table.bin
          fi

          if [ -f "build/lvgl_micropy_ESP32_GENERIC-4.bin" ]; then
            cp "build/lvgl_micropy_ESP32_GENERIC-4.bin" \
              final_firmware/firmware.bin
          fi

          echo "=== Firmware final ==="
          ls -lh final_firmware/

      - name: Verificar firmware
        if: success()
        run: |
          echo "=== Archivos generados ==="
          ls -lh final_firmware/

          test -f final_firmware/micropython.bin
          test -f final_firmware/bootloader.bin
          test -f final_firmware/partition-table.bin

          echo
          echo "Firmware correcto."

      - name: Subir Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-cyd-st7789
          path: final_firmware/

      - name: Subir Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            lib/micropython/ports/esp32/build-ESP32_GENERIC/log/
          if-no-files-found: warn
