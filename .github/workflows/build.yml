name: Compilar Firmware CYD ST7789

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repositorio principal de LVGL Micropython
      uses: actions/checkout@v4
      with:
        repository: kdschlosser/lvgl_micropython
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build gperf libffi-dev libssl-dev dfu-util libusb-1.0-0 build-essential git wget curl

    - name: Compilar Firmware para ESP32 CYD con make.py
      run: |
        python3 make.py esp32 submodules mpy_cross BOARD=ESP32_GENERIC DISPLAY=st7789 INDEV=xpt2046 --flash-size=4 --optimize-size

    - name: Unificar binarios en una sola imagen de 4MB con esptool
      run: |
        pip install esptool
        mkdir -p final_firmware
        
        # Localizamos las rutas exactas generadas por ESP-IDF dentro del submódulo
        BOOTLOADER=$(find . -name "bootloader.bin" | head -n 1)
        PARTITIONS=$(find . -name "partition-table.bin" | head -n 1)
        FIRMWARE=$(find . -name "micropython.bin" | head -n 1)
        
        echo "Bootloader encontrado: $BOOTLOADER"
        echo "Particiones encontradas: $PARTITIONS"
        echo "Firmware encontrado: $FIRMWARE"
        
        # Fusionamos todo en un único binario listo para flashear en 0x0
        esptool.py --chip esp32 merge_bin \
          -o final_firmware/firmware_unificado.bin \
          --flash_mode dio --flash_size 4MB \
          0x1000 "$BOOTLOADER" \
          0x8000 "$PARTITIONS" \
          0x10000 "$FIRMWARE"
          
        ls -la final_firmware/

    - name: Subir binario unificado como Artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-cyd-unificado
        path: final_firmware/*.bin
