name: Compilar LVGL MicroPython - CYD ST7789

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Clonar LVGL MicroPython
        run: |
          git clone --recursive https://github.com/lvgl-micropython/lvgl_micropython.git .

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            libusb-1.0-0-dev

      - name: Crear módulo C WiFi Clients
        run: |
          mkdir -p ext_mod/wifi_clients

          cat > ext_mod/wifi_clients/wifi_clients.c <<'EOF'
          #include "py/runtime.h"
          #include "py/obj.h"

          #include "esp_err.h"
          #include "esp_wifi.h"
          #include "esp_wifi_ap_get_sta_list.h"

          #include "lwip/ip4_addr.h"

          #include <stdio.h>
          #include <string.h>


          static mp_obj_t wifi_clients_get(void)
          {
              wifi_sta_list_t sta_list;
              wifi_sta_mac_ip_list_t ip_list;

              memset(&sta_list, 0, sizeof(sta_list));
              memset(&ip_list, 0, sizeof(ip_list));

              esp_err_t err;

              /*
               * Obtener estaciones asociadas al SoftAP.
               */
              err = esp_wifi_ap_get_sta_list(&sta_list);

              if (err != ESP_OK) {
                  return mp_obj_new_list(0, NULL);
              }

              /*
               * Obtener IP de cada estación.
               *
               * Esta API utiliza la información del DHCP del
               * SoftAP y también puede consultar ARP.
               */
              err = esp_wifi_ap_get_sta_list_with_ip(
                  &sta_list,
                  &ip_list
              );

              if (err != ESP_OK) {
                  return mp_obj_new_list(0, NULL);
              }

              mp_obj_t result = mp_obj_new_list(0, NULL);

              for (int i = 0; i < ip_list.num; i++) {

                  char mac[18];
                  char ip[16];

                  snprintf(
                      mac,
                      sizeof(mac),
                      "%02X:%02X:%02X:%02X:%02X:%02X",
                      ip_list.sta[i].mac[0],
                      ip_list.sta[i].mac[1],
                      ip_list.sta[i].mac[2],
                      ip_list.sta[i].mac[3],
                      ip_list.sta[i].mac[4],
                      ip_list.sta[i].mac[5]
                  );

                  ip4addr_ntoa_r(
                      &ip_list.sta[i].ip,
                      ip,
                      sizeof(ip)
                  );

                  mp_obj_t items[2];

                  items[0] = mp_obj_new_str(
                      mac,
                      strlen(mac)
                  );

                  items[1] = mp_obj_new_str(
                      ip,
                      strlen(ip)
                  );

                  mp_obj_list_append(
                      result,
                      mp_obj_new_tuple(2, items)
                  );
              }

              return result;
          }


          static MP_DEFINE_CONST_FUN_OBJ_0(
              wifi_clients_get_obj,
              wifi_clients_get
          );


          static const mp_rom_map_elem_t wifi_clients_globals_table[] = {

              {
                  MP_ROM_QSTR(MP_QSTR___name__),
                  MP_ROM_QSTR(MP_QSTR_wifi_clients)
              },

              {
                  MP_ROM_QSTR(MP_QSTR_get),
                  MP_ROM_PTR(&wifi_clients_get_obj)
              },

          };


          static MP_DEFINE_CONST_DICT(
              wifi_clients_globals,
              wifi_clients_globals_table
          );


          const mp_obj_module_t wifi_clients_user_cmodule = {
              .base = { &mp_type_module },
              .globals = (mp_obj_dict_t *)&wifi_clients_globals,
          };


          MP_REGISTER_MODULE(
              MP_QSTR_wifi_clients,
              wifi_clients_user_cmodule
          );
          EOF


          cat > ext_mod/wifi_clients/micropython.cmake <<'EOF'
          add_library(usermod_wifi_clients INTERFACE)

          target_sources(usermod_wifi_clients INTERFACE
              ${CMAKE_CURRENT_LIST_DIR}/wifi_clients.c
          )

          target_link_libraries(usermod INTERFACE
              usermod_wifi_clients
          )
          EOF

      - name: Verificar módulo C
        run: |
          echo "=== MÓDULO C ==="
          ls -lh ext_mod/wifi_clients/

          echo
          echo "=== CMAKE ==="
          cat ext_mod/wifi_clients/micropython.cmake

          echo
          echo "=== C ==="
          sed -n '1,240p' ext_mod/wifi_clients/wifi_clients.c

      - name: Compilar firmware ESP32
        id: compile
        run: |
          set -o pipefail

          python3 make.py esp32 \
            BOARD=ESP32_GENERIC \
            DISPLAY=st7789 \
            INDEV=xpt2046 \
            USER_C_MODULE="$GITHUB_WORKSPACE/ext_mod/wifi_clients/micropython.cmake" \
            --flash-size=4 \
            --optimize-size \
            --ccache \
            LV_CFLAGS="-DLV_USE_IMAGE=1" \
            2>&1 | tee build.log

      - name: Comprobar resultado real de compilación
        if: always()
        run: |
          echo "========================================"
          echo "       RESULTADO DE COMPILACIÓN"
          echo "========================================"

          echo
          echo "=== Referencias a wifi_clients ==="

          grep -n -E \
            "wifi_clients|usermod_wifi_clients" \
            build.log \
            || true

          echo
          echo "=== Referencias a errores ==="

          grep -n -E \
            "error:|Error:|FAILED|failed|undefined reference" \
            build.log \
            | tail -n 100 \
            || true

          echo
          echo "=== BINARIOS ==="

          find . \
            -type f \
            -name "*.bin" \
            -not -path "./.git/*" \
            -print \
            | sort

          echo
          echo "=== FIN DEL BUILD.LOG ==="

          tail -n 250 build.log

      - name: Verificar firmware generado
        if: success()
        run: |
          echo "========================================"
          echo "       BUSCANDO FIRMWARE"
          echo "========================================"

          FIRMWARE="build/lvgl_micropy_ESP32_GENERIC-4.bin"

          if [ ! -s "$FIRMWARE" ]; then
            echo
            echo "ERROR:"
            echo "El builder no generó:"
            echo "$FIRMWARE"
            echo
            echo "Esto significa que MicroPython no llegó a"
            echo "'Project build complete.'"
            exit 1
          fi

          echo
          echo "Firmware encontrado:"
          ls -lh "$FIRMWARE"

      - name: Preparar firmware final
        if: success()
        run: |
          BUILD_DIR="lib/micropython/ports/esp32/build-ESP32_GENERIC"

          mkdir -p final_firmware

          cp \
            build/lvgl_micropy_ESP32_GENERIC-4.bin \
            final_firmware/firmware.bin

          cp \
            "$BUILD_DIR/bootloader/bootloader.bin" \
            final_firmware/bootloader.bin

          cp \
            "$BUILD_DIR/partition_table/partition-table.bin" \
            final_firmware/partition-table.bin

          echo "========================================"
          echo "       FIRMWARE FINAL"
          echo "========================================"

          ls -lh final_firmware/

      - name: Verificar archivos finales
        if: success()
        run: |
          test -s final_firmware/firmware.bin
          test -s final_firmware/bootloader.bin
          test -s final_firmware/partition-table.bin

          echo "OK: firmware.bin"
          echo "OK: bootloader.bin"
          echo "OK: partition-table.bin"

      - name: Subir Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-cyd-st7789
          path: final_firmware/

      - name: Subir Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            lib/micropython/ports/esp32/build-ESP32_GENERIC/log/
          if-no-files-found: warn
