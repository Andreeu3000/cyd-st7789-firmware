name: Compilar Firmware CYD ST7789

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repositorio principal de LVGL Micropython
      uses: actions/checkout@v4
      with:
        repository: kdschlosser/lvgl_micropython
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build gperf libffi-dev libssl-dev dfu-util libusb-1.0-0 build-essential git wget curl

    - name: Compilar Firmware para ESP32 CYD con make.py
      run: |
        python3 make.py esp32 submodules clean mpy_cross BOARD=ESP32_GENERIC DISPLAY=st7789 INDEV=xpt2046 --flash-size=4 --optimize-size

    - name: Aislar el micropython.bin real
      run: |
        mkdir -p final_firmware
        # Busca el binario real de más de 500 KB generado por el make.py
        find lib/micropython/ports/esp32 -name "micropython.bin" -size +500k -exec cp {} final_firmware/ \; || true
        find lib/micropython/ports/esp32 -name "*.bin" -size +500k -exec cp {} final_firmware/ \; || true
        ls -la final_firmware/

    - name: Subir el archivo .bin como Artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-cyd-st7789
        path: final_firmware/*.bin
