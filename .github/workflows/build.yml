name: Compilar LVGL MicroPython - CYD ST7789

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Clonar LVGL MicroPython
        run: |
          git clone --recursive https://github.com/lvgl-micropython/lvgl_micropython.git .

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            libusb-1.0-0-dev

      - name: Crear módulo C WiFi Clients
        run: |
          mkdir -p ext_mod/wifi_clients

          cat > ext_mod/wifi_clients/wifi_clients.c <<'EOF'
          #include "py/runtime.h"
          #include "py/obj.h"

          #include "esp_err.h"
          #include "esp_wifi.h"
          #include "esp_wifi_ap_get_sta_list.h"

          #include "lwip/ip4_addr.h"

          #include <stdio.h>
          #include <string.h>


          static mp_obj_t wifi_clients_get(void)
          {
              wifi_sta_list_t sta_list;
              wifi_sta_mac_ip_list_t sta_ip_list;

              memset(&sta_list, 0, sizeof(sta_list));
              memset(&sta_ip_list, 0, sizeof(sta_ip_list));

              esp_err_t err;

              /*
               * Obtener estaciones asociadas al SoftAP.
               */
              err = esp_wifi_ap_get_sta_list(&sta_list);

              if (err != ESP_OK) {
                  return mp_obj_new_list(0, NULL);
              }

              /*
               * Obtener las IP correspondientes a esas MAC.
               *
               * ESP-IDF obtiene primero la información del DHCP
               * y puede consultar ARP si todavía no existe una
               * concesión DHCP disponible.
               */
              err = esp_wifi_ap_get_sta_list_with_ip(
                  &sta_list,
                  &sta_ip_list
              );

              if (err != ESP_OK) {
                  return mp_obj_new_list(0, NULL);
              }

              mp_obj_t result = mp_obj_new_list(0, NULL);

              for (int i = 0; i < sta_ip_list.num; i++) {

                  char mac_str[18];
                  char ip_str[16];

                  /*
                   * MAC:
                   * AA:BB:CC:DD:EE:FF
                   */
                  snprintf(
                      mac_str,
                      sizeof(mac_str),
                      "%02X:%02X:%02X:%02X:%02X:%02X",
                      sta_ip_list.sta[i].mac[0],
                      sta_ip_list.sta[i].mac[1],
                      sta_ip_list.sta[i].mac[2],
                      sta_ip_list.sta[i].mac[3],
                      sta_ip_list.sta[i].mac[4],
                      sta_ip_list.sta[i].mac[5]
                  );

                  /*
                   * IP:
                   * 192.168.4.2
                   *
                   * Usamos la función de lwIP para evitar problemas
                   * de endianess.
                   */
                  ip4addr_ntoa_r(
                      &sta_ip_list.sta[i].ip,
                      ip_str,
                      sizeof(ip_str)
                  );

                  mp_obj_t tuple_items[2];

                  tuple_items[0] = mp_obj_new_str(
                      mac_str,
                      strlen(mac_str)
                  );

                  tuple_items[1] = mp_obj_new_str(
                      ip_str,
                      strlen(ip_str)
                  );

                  mp_obj_list_append(
                      result,
                      mp_obj_new_tuple(2, tuple_items)
                  );
              }

              return result;
          }


          static MP_DEFINE_CONST_FUN_OBJ_0(
              wifi_clients_get_obj,
              wifi_clients_get
          );


          static const mp_rom_map_elem_t wifi_clients_globals_table[] = {

              {
                  MP_ROM_QSTR(MP_QSTR___name__),
                  MP_ROM_QSTR(MP_QSTR_wifi_clients)
              },

              {
                  MP_ROM_QSTR(MP_QSTR_get),
                  MP_ROM_PTR(&wifi_clients_get_obj)
              },

          };


          static MP_DEFINE_CONST_DICT(
              wifi_clients_globals,
              wifi_clients_globals_table
          );


          const mp_obj_module_t wifi_clients_user_cmodule = {
              .base = { &mp_type_module },
              .globals = (mp_obj_dict_t *)&wifi_clients_globals,
          };


          MP_REGISTER_MODULE(
              MP_QSTR_wifi_clients,
              wifi_clients_user_cmodule
          );
          EOF

          cat > ext_mod/wifi_clients/micropython.cmake <<'EOF'
          add_library(usermod_wifi_clients INTERFACE)

          target_sources(usermod_wifi_clients INTERFACE
              ${CMAKE_CURRENT_LIST_DIR}/wifi_clients.c
          )

          target_include_directories(usermod_wifi_clients INTERFACE
              ${CMAKE_CURRENT_LIST_DIR}
          )

          target_link_libraries(usermod INTERFACE
              usermod_wifi_clients
          )
          EOF

      - name: Conservar micropython.bin del builder
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("builder/esp32.py")

          data = path.read_text()

          old = "            scrub_build_folder()\n"

          if old not in data:
              raise SystemExit(
                  "No se encontró scrub_build_folder() en builder/esp32.py"
              )

          new = (
              "            # Mantener los artefactos individuales "
              "para el workflow.\n"
              "            # El builder normalmente limpia micropython.bin "
              "antes de terminar.\n"
          )

          data = data.replace(old, new, 1)

          path.write_text(data)

          print("scrub_build_folder() desactivado correctamente.")
          PY

      - name: Compilar firmware ESP32
        id: compile
        run: |
          set -o pipefail

          python3 make.py esp32 \
            BOARD=ESP32_GENERIC \
            DISPLAY=st7789 \
            INDEV=xpt2046 \
            USER_C_MODULE="$GITHUB_WORKSPACE/ext_mod/wifi_clients/micropython.cmake" \
            --flash-size=4 \
            --optimize-size \
            --ccache \
            LV_CFLAGS="-DLV_USE_IMAGE=1" \
            2>&1 | tee build.log

      - name: Preparar firmware final
        if: success()
        run: |
          BUILD_DIR="lib/micropython/ports/esp32/build-ESP32_GENERIC"

          mkdir -p final_firmware

          echo "======================================"
          echo "       BINARIOS DEL BUILD"
          echo "======================================"

          find "$BUILD_DIR" \
            -type f \
            -name "*.bin" \
            -print \
            | sort

          echo
          echo "======================================"
          echo "       BUSCANDO MICROPYTHON"
          echo "======================================"

          if [ -f "$BUILD_DIR/micropython.bin" ]; then

            echo "Encontrado:"
            echo "$BUILD_DIR/micropython.bin"

            cp \
              "$BUILD_DIR/micropython.bin" \
              final_firmware/micropython.bin

          else

            echo "ERROR: micropython.bin no existe."

            echo
            echo "Contenido del directorio:"
            find "$BUILD_DIR" \
              -maxdepth 3 \
              -type f \
              -print \
              | sort

            exit 1
          fi

          echo
          echo "======================================"
          echo "       BOOTLOADER"
          echo "======================================"

          if [ -f "$BUILD_DIR/bootloader/bootloader.bin" ]; then
            cp \
              "$BUILD_DIR/bootloader/bootloader.bin" \
              final_firmware/bootloader.bin
          else
            echo "ERROR: bootloader.bin no existe."
            exit 1
          fi

          echo
          echo "======================================"
          echo "       PARTITION TABLE"
          echo "======================================"

          if [ -f "$BUILD_DIR/partition_table/partition-table.bin" ]; then
            cp \
              "$BUILD_DIR/partition_table/partition-table.bin" \
              final_firmware/partition-table.bin
          else
            echo "ERROR: partition-table.bin no existe."
            exit 1
          fi

          echo
          echo "======================================"
          echo "       FIRMWARE COMBINADO"
          echo "======================================"

          COMBINED="build/lvgl_micropy_ESP32_GENERIC-4.bin"

          if [ -f "$COMBINED" ]; then

            cp \
              "$COMBINED" \
              final_firmware/firmware.bin

            echo "Encontrado firmware combinado:"
            echo "$COMBINED"

          else

            echo "AVISO: no se encontró firmware combinado."

          fi

          echo
          echo "======================================"
          echo "       FIRMWARE FINAL"
          echo "======================================"

          ls -lh final_firmware/

      - name: Verificar firmware
        if: success()
        run: |
          echo "======================================"
          echo "       VERIFICACIÓN"
          echo "======================================"

          test -s final_firmware/micropython.bin
          test -s final_firmware/bootloader.bin
          test -s final_firmware/partition-table.bin

          echo
          echo "OK: micropython.bin"
          echo "OK: bootloader.bin"
          echo "OK: partition-table.bin"

          if [ -f final_firmware/firmware.bin ]; then
            test -s final_firmware/firmware.bin
            echo "OK: firmware.bin"
          fi

          echo
          echo "Tamaños:"
          ls -lh final_firmware/

      - name: Subir Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-cyd-st7789
          path: final_firmware/

      - name: Subir Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            lib/micropython/ports/esp32/build-ESP32_GENERIC/log/
          if-no-files-found: warn
