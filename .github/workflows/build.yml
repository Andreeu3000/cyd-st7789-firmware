name: Compilar LVGL MicroPython - CYD ST7789

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar LVGL MicroPython
        run: |
          git clone --recursive https://github.com/lvgl-micropython/lvgl_micropython.git .

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            libusb-1.0-0-dev
          pip install esptool

      - name: Crear script de parche (Sin comillas triples)
        run: |
          cat << 'EOF' > patch_network.py
          from pathlib import Path
          import re

          wlan_files = list(Path('.').rglob('network_wlan.c'))
          if not wlan_files:
              raise FileNotFoundError('No se encontró network_wlan.c en el repositorio.')

          path = wlan_files[0]
          text = path.read_text(encoding='utf-8')

          inc_netutils = '#include "shared/netutils/netutils.h"\n'
          inc_esp = '#include "esp_wifi_ap_get_sta_list.h"\n'

          if inc_netutils not in text:
              text = inc_netutils + text

          if inc_esp not in text:
              text = inc_esp + text

          # Construcción del bloque de código mediante arreglo de cadenas (cero conflicto de triple comilla)
          patch_lines = [
              "        case (uintptr_t)MP_OBJ_NEW_QSTR(MP_QSTR_stations): {",
              "            // Return list of connected stations.",
              "            require_if(args[0], ESP_IF_WIFI_AP);",
              "",
              "            wifi_sta_list_t station_list;",
              "            esp_exceptions(",
              "                esp_wifi_ap_get_sta_list(&station_list)",
              "            );",
              "",
              "            wifi_sta_mac_ip_list_t mac_ip_list;",
              "            esp_exceptions(",
              "                esp_wifi_ap_get_sta_list_with_ip(",
              "                    &station_list,",
              "                    &mac_ip_list",
              "                )",
              "            );",
              "",
              "            mp_obj_t list = mp_obj_new_list(0, NULL);",
              "",
              "            int count = mac_ip_list.num;",
              "",
              "            esp_netif_pair_mac_ip_t *source =",
              "                (esp_netif_pair_mac_ip_t *)mac_ip_list.sta;",
              "",
              "            for (int i = 0; i < count; ++i) {",
              "                mp_obj_tuple_t *t =",
              "                    mp_obj_new_tuple(2, NULL);",
              "",
              "                t->items[0] = mp_obj_new_bytes(",
              "                    source[i].mac,",
              "                    sizeof(source[i].mac)",
              "                );",
              "",
              "                t->items[1] =",
              "                    source[i].ip.addr != 0",
              "                    ? netutils_format_ipv4_addr(",
              "                        (uint8_t *)(&source[i].ip),",
              "                        NETUTILS_BIG",
              "                    )",
              "                    : mp_const_none;",
              "",
              "                mp_obj_list_append(",
              "                    list,",
              "                    MP_OBJ_FROM_PTR(t)",
              "                );",
              "            }",
              "",
              "            return list;",
              "        }"
          ]

          patch_code = '\n'.join(patch_lines)

          target_str = 'case (uintptr_t)MP_OBJ_NEW_QSTR(MP_QSTR_stations):'
          if target_str in text:
              pattern = re.compile(r'case \(uintptr_t\)MP_OBJ_NEW_QSTR\(MP_QSTR_stations\):.*?(?=case |default:|\})', re.DOTALL)
              text = pattern.sub(patch_code + '\n', text)
          else:
              print('Advertencia: No se encontró la etiqueta MP_QSTR_stations explícita.')

          path.write_text(text, encoding='utf-8')
          print(f'Parche aplicado exitosamente en: {path}')
          EOF

      - name: Aplicar Parche y Crear Particiones Ampliadas
        run: |
          python3 patch_network.py

          # Crear la tabla de particiones personalizada para soportar la imagen de LVGL
          cat > lib/micropython/ports/esp32/partitions-4mb-custom.csv << 'EOF'
          # Name,   Type, SubType, Offset,  Size, Flags
          nvs,      data, nvs,     0x9000,  0x6000,
          phy_init, data, phy,     0xf000,  0x1000,
          factory,  app,  factory, 0x10000, 0x330000,
          EOF

      - name: Compilar firmware ESP32
        id: compile
        run: |
          set -o pipefail

          python3 make.py esp32 \
            BOARD=ESP32_GENERIC \
            BOARD_VARIANT= \
            PART_CSV=partitions-4mb-custom.csv \
            DISPLAY=st7789 \
            INDEV=xpt2046 \
            --flash-size=4 \
            --optimize-size \
            --ccache \
            LV_CFLAGS="-DLV_USE_IMAGE=1" \
            2>&1 | tee build.log

      - name: Crear imagen binaria unificada (0x0) y empaquetar
        if: success()
        run: |
          BUILD_DIR="lib/micropython/ports/esp32/build-ESP32_GENERIC"

          mkdir -p final_firmware

          BOOTLOADER="$BUILD_DIR/bootloader/bootloader.bin"
          PARTITION="$BUILD_DIR/partition_table/partition-table.bin"
          APP="$BUILD_DIR/micropython.bin"

          if [ ! -f "$APP" ]; then
            APP="$BUILD_DIR/firmware.bin"
          fi

          cp "$BOOTLOADER" final_firmware/bootloader.bin
          cp "$PARTITION" final_firmware/partition-table.bin
          cp "$APP" final_firmware/app_micropython.bin

          python3 -m esptool --chip esp32 merge_bin \
            -o final_firmware/firmware_merged_0x0.bin \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 4MB \
            0x1000 "$BOOTLOADER" \
            0x8000 "$PARTITION" \
            0x10000 "$APP"

          echo "Archivos generados en final_firmware:"
          ls -lh final_firmware/

      - name: Subir Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-cyd-st7789
          path: final_firmware/

      - name: Subir Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
