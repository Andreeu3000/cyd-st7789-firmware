name: Inspeccionar config LVGL MicroPython (solo lectura)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar lvgl_micropython con submodulos
        run: |
          git clone --recursive https://github.com/lvgl-micropython/lvgl_micropython.git fw

      - name: Recolectar datos
        working-directory: fw
        shell: bash
        run: |
          P=lib/micropython/ports/esp32
          B=$P/boards
          show() {
            echo; echo "######## $1 ########"
            if [ -f "$1" ]; then cat "$1"; else echo "(no existe)"; fi
          }
          {
            echo "lvgl_micropython: $(git rev-parse --short HEAD)"
            echo "micropython: $(git -C lib/micropython describe --tags --always 2>&1)"

            echo; echo "######## ls $B/ESP32_GENERIC ########"
            ls -la $B/ESP32_GENERIC 2>&1

            show $B/ESP32_GENERIC/mpconfigboard.cmake
            show $B/ESP32_GENERIC/mpconfigboard.h
            show $B/ESP32_GENERIC/sdkconfig.board
            show $B/sdkconfig.base
            show $B/sdkconfig.ble

            echo; echo "######## grep mpconfigport.h ########"
            grep -n "GC_SPLIT\|GC_INITIAL\|ALLOC_HEAP\|BLUETOOTH" $P/mpconfigport.h 2>&1 || true

            echo; echo "######## grep heap en main.c ########"
            grep -n -i "heap" $P/main.c 2>&1 || true

            echo; echo "######## SDKCONFIG en CMakeLists ########"
            grep -n -i "sdkconfig" $P/CMakeLists.txt $P/main/CMakeLists.txt 2>&1 || true

            echo; echo "######## builder/ (sdkconfig, bluetooth, heap, idf) ########"
            ls builder 2>&1
            grep -rn -i "sdkconfig\|bluetooth\|CONFIG_BT\|heap\|SPIRAM\|esp-idf" builder/ 2>&1 | head -80 || true
          } > inspect.txt 2>&1

          wc -l inspect.txt
          cat inspect.txt

      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspect-config
          path: fw/inspect.txt
          retention-days: 7
