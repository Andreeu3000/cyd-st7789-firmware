name: Compilar Firmware CYD ST7789

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Clonar repositorio oficial de LVGL Micropython
      run: |
        git clone https://github.com/kdschlosser/lvgl_micropython .

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build python3-venv libusb-1.0-0-dev git wget curl

    - name: Crear estructura requerida para evitar errores de CMake
      run: |
        mkdir -p ext_mod
        touch ext_mod/micropython.cmake

    - name: Compilar Firmware para ESP32 CYD
      run: |
        python3 make.py esp32 submodules mpy_cross BOARD=ESP32_GENERIC --flash-size=4 --optimize-size

    - name: Preparar binarios para el Artifact
      run: |
        mkdir -p final_firmware
        
        # Búsqueda robusta de los binarios generados por el motor CMake de ESP-IDF
        find lib/micropython/ports/esp32/ -type f \( -name "firmware.bin" -o -name "micropython.bin" -o -name "bootloader.bin" -o -name "partition-table.bin" \) -exec cp {} final_firmware/ \;
        
        # Listar contenido para validar que se encontraron
        ls -la final_firmware/

    - name: Subir binarios como Artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-cyd-st7789
        path: final_firmware/
        
