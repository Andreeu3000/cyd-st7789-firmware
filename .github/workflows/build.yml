name: Compilar LVGL MicroPython - CYD ST7789

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar LVGL MicroPython
        run: |
          git clone https://github.com/lvgl-micropython/lvgl_micropython.git .

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            python3 \
            python3-venv \
            libusb-1.0-0-dev

      - name: Compilar firmware
        run: |
          python3 make.py esp32 \
            BOARD=ESP32_GENERIC \
            DISPLAY=st7789 \
            INDEV=xpt2046 \
            --flash-size=4 \
            --optimize-size

      - name: Buscar firmware generado
        run: |
          echo "=== BINARIOS ==="
          find . -type f -name "*.bin" -print

      - name: Preparar firmware
        run: |
          mkdir -p final_firmware

          find . -type f -name "bootloader.bin" \
            -exec cp {} final_firmware/ \;

          find . -type f -name "partition-table.bin" \
            -exec cp {} final_firmware/ \;

          find . -type f -name "micropython.bin" \
            -exec cp {} final_firmware/ \;

          echo "=== FINAL ==="
          ls -lh final_firmware

      - name: Verificar firmware
        run: |
          test -f final_firmware/micropython.bin
          test -f final_firmware/bootloader.bin
          test -f final_firmware/partition-table.bin

      - name: Subir firmware
        uses: actions/upload-artifact@v4
        with:
          name: lvgl-micropython-cyd-st7789
          path: final_firmware/
