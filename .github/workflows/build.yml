name: Compilar LVGL MicroPython - CYD ST7789 + IP clientes

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Clonar LVGL MicroPython
        run: |
          git clone --recursive https://github.com/lvgl-micropython/lvgl_micropython.git .

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            libusb-1.0-0-dev

      - name: Parchear network_wlan.c
        run: |
          cat > patch.py <<'PY'
          from pathlib import Path

          path = Path(
              "lib/micropython/ports/esp32/network_wlan.c"
          )

          if not path.exists():
              raise SystemExit(
                  f"No existe: {path}"
              )

          text = path.read_text()

          print("Archivo:")
          print(path)

          # --------------------------------------------------
          # Include de la API de ESP-IDF
          # --------------------------------------------------

          include = '#include "esp_wifi_ap_get_sta_list.h"'

          if include not in text:
              marker = '#include "esp_wifi.h"'

              if marker not in text:
                  raise SystemExit(
                      'No se encontró #include "esp_wifi.h"'
                  )

              text = text.replace(
                  marker,
                  marker + "\n" + include,
                  1
              )

              print("Include añadido.")
          else:
              print("Include ya existente.")

          # --------------------------------------------------
          # Buscar el case de RSSI
          # --------------------------------------------------

          marker = (
              "        case (uintptr_t)MP_OBJ_NEW_QSTR("
              "MP_QSTR_rssi): {"
          )

          if marker not in text:
              raise SystemExit(
                  "No se encontró MP_QSTR_rssi"
              )

          # --------------------------------------------------
          # Añadir stations_ip
          # --------------------------------------------------

          if "MP_QSTR_stations_ip" not in text:

              code = """
                  case (uintptr_t)MP_OBJ_NEW_QSTR(MP_QSTR_stations_ip): {
                      require_if(args[0], ESP_IF_WIFI_AP);

                      wifi_sta_list_t station_list = {0};
                      wifi_sta_mac_ip_list_t ip_list = {0};

                      esp_exceptions(
                          esp_wifi_ap_get_sta_list(&station_list)
                      );

                      esp_exceptions(
                          esp_wifi_ap_get_sta_list_with_ip(
                              &station_list,
                              &ip_list
                          )
                      );

                      mp_obj_t list = mp_obj_new_list(0, NULL);

                      for (int i = 0; i < ip_list.num; ++i) {
                          char ip[16];

                          snprintf(
                              ip,
                              sizeof(ip),
                              "%u.%u.%u.%u",
                              ip_list.sta[i].ip.addr & 0xff,
                              (ip_list.sta[i].ip.addr >> 8) & 0xff,
                              (ip_list.sta[i].ip.addr >> 16) & 0xff,
                              (ip_list.sta[i].ip.addr >> 24) & 0xff
                          );

                          mp_obj_t tuple[2];

                          tuple[0] = mp_obj_new_bytes(
                              ip_list.sta[i].mac,
                              6
                          );

                          tuple[1] = mp_obj_new_str(
                              ip,
                              strlen(ip)
                          );

                          mp_obj_list_append(
                              list,
                              mp_obj_new_tuple(2, tuple)
                          );
                      }

                      return list;
                  }
              """

              text = text.replace(
                  marker,
                  code + "\n" + marker,
                  1
              )

              print("stations_ip añadido.")

          else:
              print("stations_ip ya estaba presente.")

          path.write_text(text)

          # --------------------------------------------------
          # Verificación
          # --------------------------------------------------

          final_text = path.read_text()

          if "esp_wifi_ap_get_sta_list_with_ip" not in final_text:
              raise SystemExit(
                  "ERROR: no quedó esp_wifi_ap_get_sta_list_with_ip"
              )

          if "MP_QSTR_stations_ip" not in final_text:
              raise SystemExit(
                  "ERROR: no quedó MP_QSTR_stations_ip"
              )

          print()
          print("==============================")
          print("PARCHE CORRECTO")
          print("==============================")
          print("stations_ip: OK")
          print("ESP-IDF API: OK")
          PY

          python3 patch.py

      - name: Compilar firmware ESP32
        id: compile
        run: |
          set -o pipefail

          python3 make.py esp32 \
            BOARD=ESP32_GENERIC \
            DISPLAY=st7789 \
            INDEV=xpt2046 \
            --flash-size=4 \
            --optimize-size \
            --ccache \
            --no-scrub \
            LV_CFLAGS="-DLV_USE_IMAGE=1" \
            2>&1 | tee build.log

      - name: Verificar resultado de compilación
        if: success()
        run: |
          echo "=========================================="
          echo "TODOS LOS BINARIOS"
          echo "=========================================="

          find . \
            -type f \
            -name "*.bin" \
            -print \
            | sort

          echo
          echo "=========================================="
          echo "BUILD DE MICROCONTROLLER"
          echo "=========================================="

          MPY_BUILD="lib/micropython/ports/esp32/build-ESP32_GENERIC"

          if [ -d "$MPY_BUILD" ]; then
            echo "Directorio encontrado:"
            echo "$MPY_BUILD"
            echo

            find "$MPY_BUILD" \
              -type f \
              \( \
                -name "micropython.bin" \
                -o -name "firmware.bin" \
                -o -name "bootloader.bin" \
                -o -name "partition-table.bin" \
              \) \
              -print
          else
            echo "ERROR: no existe $MPY_BUILD"
            exit 1
          fi

          echo
          echo "=========================================="
          echo "FIRMWARE LVGL"
          echo "=========================================="

          find build \
            -maxdepth 1 \
            -type f \
            -name "*.bin" \
            -print \
            | sort

      - name: Preparar firmware final
        if: success()
        run: |
          mkdir -p final_firmware

          MPY_BUILD="lib/micropython/ports/esp32/build-ESP32_GENERIC"

          # --------------------------------------------------
          # Firmware combinado oficial de lvgl_micropython
          # --------------------------------------------------

          COMBINED="build/lvgl_micropy_ESP32_GENERIC-4.bin"

          if [ ! -f "$COMBINED" ]; then
            echo "ERROR:"
            echo "No existe:"
            echo "$COMBINED"
            echo

            echo "Contenido de build/:"
            find build -maxdepth 2 -type f | sort

            echo
            echo "Últimas líneas del build:"
            tail -n 100 build.log

            exit 1
          fi

          cp "$COMBINED" \
            final_firmware/firmware.bin

          echo "OK: firmware.bin"

          # --------------------------------------------------
          # MicroPython separado
          # --------------------------------------------------

          if [ -f "$MPY_BUILD/micropython.bin" ]; then

            cp "$MPY_BUILD/micropython.bin" \
              final_firmware/micropython.bin

            echo "OK: micropython.bin"

          else

            echo "AVISO:"
            echo "No se encontró micropython.bin"

          fi

          # --------------------------------------------------
          # Bootloader
          # --------------------------------------------------

          if [ -f "$MPY_BUILD/bootloader/bootloader.bin" ]; then

            cp "$MPY_BUILD/bootloader/bootloader.bin" \
              final_firmware/bootloader.bin

            echo "OK: bootloader.bin"

          fi

          # --------------------------------------------------
          # Partition table
          # --------------------------------------------------

          if [ -f "$MPY_BUILD/partition_table/partition-table.bin" ]; then

            cp "$MPY_BUILD/partition_table/partition-table.bin" \
              final_firmware/partition-table.bin

            echo "OK: partition-table.bin"

          fi

          echo
          echo "=========================================="
          echo "FIRMWARE FINAL"
          echo "=========================================="

          ls -lh final_firmware/

      - name: Subir Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-cyd-st7789
          path: final_firmware/

      - name: Subir Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            lib/micropython/ports/esp32/build-ESP32_GENERIC/log/
          if-no-files-found: warn
