name: Compilar LVGL MicroPython - CYD ST7789

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Clonar LVGL MicroPython
        run: |
          git clone --recursive https://github.com/lvgl-micropython/lvgl_micropython.git .

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            libusb-1.0-0-dev

      - name: Añadir soporte nativo para IPs de clientes WiFi
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path(
              "lib/micropython/ports/esp32/network_wlan.c"
          )

          update = Path(
              "micropy_updates/esp32/network_wlan.c"
          )

          def patch(text):
              include_anchor = '#include "esp_wifi.h"\n'

              if '#include "esp_wifi_ap_get_sta_list.h"' not in text:
                  if include_anchor not in text:
                      raise RuntimeError(
                          'No se encontró #include "esp_wifi.h"'
                      )

                  text = text.replace(
                      include_anchor,
                      include_anchor +
                      '#include "esp_wifi_ap_get_sta_list.h"\n'
                      '#include <stdio.h>\n',
                      1
                  )

              marker = (
                  '        case (uintptr_t)MP_OBJ_NEW_QSTR('
                  'MP_QSTR_rssi): {\n'
              )

              if 'MP_QSTR_stations_ip' not in text:

                  if marker not in text:
                      raise RuntimeError(
                          'No se encontró el bloque case de rssi'
                      )

                  new_case = '''        case (uintptr_t)MP_OBJ_NEW_QSTR(MP_QSTR_stations_ip): {
              // Lista de clientes del SoftAP con sus IP.
              require_if(args[0], ESP_IF_WIFI_AP);

              wifi_sta_list_t station_list = {0};
              wifi_sta_mac_ip_list_t station_ip_list = {0};

              // Obtener estaciones asociadas por MAC.
              esp_exceptions(
                  esp_wifi_ap_get_sta_list(&station_list)
              );

              // Obtener IPs mediante DHCP/ARP.
              esp_exceptions(
                  esp_wifi_ap_get_sta_list_with_ip(
                      &station_list,
                      &station_ip_list
                  )
              );

              mp_obj_t list = mp_obj_new_list(0, NULL);

              for (int i = 0; i < station_ip_list.num; ++i) {

                  char ip_str[16];

                  /*
                   * IP2STR utiliza los bytes en el orden correcto
                   * definido por ESP-IDF.
                   */
                  snprintf(
                      ip_str,
                      sizeof(ip_str),
                      IPSTR,
                      IP2STR(&station_ip_list.sta[i].ip)
                  );

                  mp_obj_tuple_t *t =
                      mp_obj_new_tuple(2, NULL);

                  /*
                   * Elemento 0:
                   * MAC como bytes, igual que status("stations")
                   */
                  t->items[0] = mp_obj_new_bytes(
                      station_ip_list.sta[i].mac,
                      sizeof(station_ip_list.sta[i].mac)
                  );

                  /*
                   * Elemento 1:
                   * IP como string.
                   */
                  t->items[1] =
                      mp_obj_new_str_from_cstr(ip_str);

                  mp_obj_list_append(list, t);
              }

              return list;
          }
  '''

                  text = text.replace(
                      marker,
                      new_case + marker,
                      1
                  )

              return text

          if not source.exists():
              raise RuntimeError(
                  f'No existe: {source}'
              )

          original = source.read_text()
          patched = patch(original)

          if patched == original:
              raise RuntimeError(
                  'El parche no modificó network_wlan.c'
              )

          source.write_text(patched)

          /*
           * lvgl_micropython ejecuta copy_micropy_updates()
           * durante make.py, así que también dejamos la versión
           * modificada en micropy_updates/esp32.
           *
           * Si ya existía un update propio, lo parcheamos en vez
           * de reemplazarlo ciegamente.
           */
          update.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          if update.exists():
              update_text = update.read_text()
              update.write_text(patch(update_text))
          else:
              update.write_text(patched)

          print("Parche aplicado correctamente.")
          print()
          print("Comprobando MP_QSTR_stations_ip:")

          final_text = update.read_text()

          if "MP_QSTR_stations_ip" not in final_text:
              raise RuntimeError(
                  "MP_QSTR_stations_ip no quedó en el archivo"
              )

          print("OK: stations_ip")
          PY

      - name: Mostrar parche WiFi
        run: |
          echo "========================================"
          echo "       VERIFICACIÓN DEL PARCHE"
          echo "========================================"

          grep -n \
            -A55 \
            -B5 \
            "MP_QSTR_stations_ip" \
            micropy_updates/esp32/network_wlan.c

      - name: Compilar firmware ESP32
        id: compile
        run: |
          set -o pipefail

          python3 make.py esp32 \
            BOARD=ESP32_GENERIC \
            DISPLAY=st7789 \
            INDEV=xpt2046 \
            --flash-size=4 \
            --optimize-size \
            --ccache \
            LV_CFLAGS="-DLV_USE_IMAGE=1" \
            2>&1 | tee build.log

      - name: Verificar compilación real
        if: always()
        run: |
          echo "========================================"
          echo "       RESULTADO DEL BUILD"
          echo "========================================"

          echo
          echo "=== Project build complete ==="

          if grep -q "Project build complete." build.log; then
            echo "OK: MicroPython terminó de compilar."
          else
            echo "ERROR: MicroPython NO terminó de compilar."
          fi

          echo
          echo "=== Errores del compilador ==="

          grep -n -E \
            "error:|Error:|FAILED|undefined reference|fatal error" \
            build.log \
            | tail -n 100 \
            || true

          echo
          echo "=== Referencias a stations_ip ==="

          grep -n \
            -E "stations_ip|esp_wifi_ap_get_sta_list_with_ip" \
            build.log \
            | tail -n 50 \
            || true

          echo
          echo "=== BINARIOS GENERADOS ==="

          find . \
            -type f \
            -name "*.bin" \
            -not -path "./.git/*" \
            -print \
            | sort

          echo
          echo "=== FIN DEL LOG ==="

          tail -n 120 build.log

      - name: Preparar firmware final
        if: success()
        run: |
          BUILD_DIR="lib/micropython/ports/esp32/build-ESP32_GENERIC"

          mkdir -p final_firmware

          echo "========================================"
          echo "       COPIANDO MICROPYTHON"
          echo "========================================"

          if [ ! -s "$BUILD_DIR/micropython.bin" ]; then
            echo "ERROR: no existe micropython.bin"
            exit 1
          fi

          cp \
            "$BUILD_DIR/micropython.bin" \
            final_firmware/micropython.bin

          echo "OK: micropython.bin"
          ls -lh final_firmware/micropython.bin

          echo
          echo "========================================"
          echo "       COPIANDO BOOTLOADER"
          echo "========================================"

          if [ ! -s "$BUILD_DIR/bootloader/bootloader.bin" ]; then
            echo "ERROR: no existe bootloader.bin"
            exit 1
          fi

          cp \
            "$BUILD_DIR/bootloader/bootloader.bin" \
            final_firmware/bootloader.bin

          echo "OK: bootloader.bin"
          ls -lh final_firmware/bootloader.bin

          echo
          echo "========================================"
          echo "       COPIANDO PARTITION TABLE"
          echo "========================================"

          if [ ! -s "$BUILD_DIR/partition_table/partition-table.bin" ]; then
            echo "ERROR: no existe partition-table.bin"
            exit 1
          fi

          cp \
            "$BUILD_DIR/partition_table/partition-table.bin" \
            final_firmware/partition-table.bin

          echo "OK: partition-table.bin"
          ls -lh final_firmware/partition-table.bin

          echo
          echo "========================================"
          echo "       COPIANDO FIRMWARE COMBINADO"
          echo "========================================"

          COMBINED="build/lvgl_micropy_ESP32_GENERIC-4.bin"

          if [ -s "$COMBINED" ]; then
            cp \
              "$COMBINED" \
              final_firmware/firmware.bin

            echo "OK: firmware.bin"
            ls -lh final_firmware/firmware.bin
          else
            echo "AVISO: no existe firmware combinado."
          fi

          echo
          echo "========================================"
          echo "       FIRMWARE FINAL"
          echo "========================================"

          ls -lh final_firmware/

      - name: Verificar archivos finales
        if: success()
        run: |
          echo "========================================"
          echo "       VERIFICACIÓN FINAL"
          echo "========================================"

          test -s final_firmware/micropython.bin
          test -s final_firmware/bootloader.bin
          test -s final_firmware/partition-table.bin

          echo
          echo "OK: micropython.bin"
          echo "OK: bootloader.bin"
          echo "OK: partition-table.bin"

          if [ -s final_firmware/firmware.bin ]; then
            echo "OK: firmware.bin"
          fi

      - name: Subir Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-cyd-st7789
          path: final_firmware/

      - name: Subir Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            lib/micropython/ports/esp32/build-ESP32_GENERIC/log/
          if-no-files-found: warn
