name: Compilar LVGL MicroPython - CYD ST7789

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar LVGL MicroPython
        run: |
          git clone --recursive https://github.com/lvgl-micropython/lvgl_micropython.git .

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            libusb-1.0-0-dev
          pip install esptool

      # ============================================================
      # BLUETOOTH CLASSIC SPP
      # ============================================================

      - name: Agregar módulo Bluetooth Serial SPP
        shell: bash
        run: |
          mkdir -p btserial

          cat > btserial/micropython.cmake <<'EOF'
          add_library(usermod_btserial INTERFACE)

          target_sources(usermod_btserial INTERFACE
              ${CMAKE_CURRENT_LIST_DIR}/btserial.c
          )

          target_include_directories(usermod_btserial INTERFACE
              ${CMAKE_CURRENT_LIST_DIR}
          )

          target_link_libraries(usermod_btserial INTERFACE bt)

          target_link_libraries(usermod INTERFACE usermod_btserial)
          EOF

          cat > btserial/btserial.c <<'EOF'
          #include "py/runtime.h"
          #include "py/obj.h"
          #include "py/objstr.h"

          #include <string.h>
          #include <stdbool.h>
          #include <stdint.h>

          #include "freertos/FreeRTOS.h"
          #include "freertos/portmacro.h"

          #include "esp_err.h"
          #include "esp_bt.h"
          #include "esp_bt_main.h"
          #include "esp_bt_device.h"
          #include "esp_gap_bt_api.h"
          #include "esp_spp_api.h"


          #define BT_SERIAL_RX_SIZE 8192
          #define BT_SERIAL_SCN 1


          static uint8_t rx_buffer[BT_SERIAL_RX_SIZE];

          static volatile size_t rx_head = 0;
          static volatile size_t rx_tail = 0;

          static portMUX_TYPE rx_lock =
              portMUX_INITIALIZER_UNLOCKED;


          static bool bt_started = false;
          static bool spp_ready = false;
          static bool bt_connected = false;

          static uint32_t spp_handle = 0;

          static bool server_mode = false;

          static bool pending_connect = false;

          static uint8_t pending_addr[ESP_BD_ADDR_LEN];

          static char device_name[
              ESP_SPP_SERVER_NAME_MAX + 1
          ];


          // ============================================================
          // RX BUFFER
          // ============================================================

          static size_t rx_available_internal(void) {

              size_t head;
              size_t tail;

              portENTER_CRITICAL(&rx_lock);

              head = rx_head;
              tail = rx_tail;

              portEXIT_CRITICAL(&rx_lock);

              if (head >= tail) {
                  return head - tail;
              }

              return BT_SERIAL_RX_SIZE -
                     tail +
                     head;
          }


          static void rx_push(
              const uint8_t *data,
              size_t len
          ) {

              portENTER_CRITICAL(&rx_lock);

              for (size_t i = 0; i < len; ++i) {

                  size_t next =
                      (rx_head + 1) %
                      BT_SERIAL_RX_SIZE;

                  if (next == rx_tail) {
                      break;
                  }

                  rx_buffer[rx_head] = data[i];

                  rx_head = next;
              }

              portEXIT_CRITICAL(&rx_lock);
          }


          static size_t rx_pop(
              uint8_t *out,
              size_t max_len
          ) {

              size_t count = 0;

              portENTER_CRITICAL(&rx_lock);

              while (
                  rx_tail != rx_head &&
                  count < max_len
              ) {

                  out[count++] =
                      rx_buffer[rx_tail];

                  rx_tail =
                      (rx_tail + 1) %
                      BT_SERIAL_RX_SIZE;
              }

              portEXIT_CRITICAL(&rx_lock);

              return count;
          }


          static void rx_clear(void) {

              portENTER_CRITICAL(&rx_lock);

              rx_head = 0;
              rx_tail = 0;

              portEXIT_CRITICAL(&rx_lock);
          }


          // ============================================================
          // GAP
          // ============================================================

          static void bt_gap_callback(
              esp_bt_gap_cb_event_t event,
              esp_bt_gap_cb_param_t *param
          ) {

              (void)event;
              (void)param;
          }


          // ============================================================
          // SPP CALLBACK
          // ============================================================

          static void bt_spp_callback(
              esp_spp_cb_event_t event,
              esp_spp_cb_param_t *param
          ) {

              switch (event) {

                  case ESP_SPP_INIT_EVT:

                      if (
                          param->init.status !=
                          ESP_SPP_SUCCESS
                      ) {
                          spp_ready = false;
                          return;
                      }

                      spp_ready = true;


                      if (server_mode) {

                          esp_spp_start_srv(
                              ESP_SPP_SEC_NONE,
                              ESP_SPP_ROLE_SLAVE,
                              BT_SERIAL_SCN,
                              device_name
                          );
                      }


                      if (pending_connect) {

                          esp_spp_connect(
                              ESP_SPP_SEC_NONE,
                              ESP_SPP_ROLE_MASTER,
                              BT_SERIAL_SCN,
                              pending_addr
                          );

                          pending_connect = false;
                      }

                      break;


                  case ESP_SPP_START_EVT:

                      break;


                  case ESP_SPP_CL_INIT_EVT:

                      break;


                  case ESP_SPP_SRV_OPEN_EVT:

                      spp_handle =
                          param->srv_open.handle;

                      bt_connected = true;

                      break;


                  case ESP_SPP_OPEN_EVT:

                      spp_handle =
                          param->open.handle;

                      bt_connected = true;

                      break;


                  case ESP_SPP_CLOSE_EVT:

                      bt_connected = false;
                      spp_handle = 0;

                      break;


                  case ESP_SPP_DATA_IND_EVT:

                      if (
                          param->data_ind.data != NULL &&
                          param->data_ind.len > 0
                      ) {

                          rx_push(
                              param->data_ind.data,
                              param->data_ind.len
                          );
                      }

                      break;


                  default:
                      break;
              }
          }


          // ============================================================
          // start(name, server=False)
          // ============================================================

          static mp_obj_t btserial_start(
              size_t n_args,
              const mp_obj_t *args
          ) {

              if (n_args < 1) {

                  mp_raise_TypeError(
                      MP_ERROR_TEXT(
                          "start(name, server=False)"
                      )
                  );
              }


              size_t name_len;

              const char *name =
                  mp_obj_str_get_data(
                      args[0],
                      &name_len
                  );


              if (
                  name_len == 0 ||
                  name_len >
                  ESP_SPP_SERVER_NAME_MAX
              ) {

                  mp_raise_ValueError(
                      MP_ERROR_TEXT(
                          "invalid Bluetooth name"
                      )
                  );
              }


              if (bt_started) {
                  return mp_const_none;
              }


              server_mode = false;

              if (n_args >= 2) {
                  server_mode =
                      mp_obj_is_true(args[1]);
              }


              memcpy(
                  device_name,
                  name,
                  name_len
              );

              device_name[name_len] = '\0';


              esp_err_t err;


              // --------------------------------------------------------
              // Controller
              // --------------------------------------------------------

              if (
                  esp_bt_controller_get_status() ==
                  ESP_BT_CONTROLLER_STATUS_IDLE
              ) {

                  esp_bt_controller_config_t cfg =
                      BT_CONTROLLER_INIT_CONFIG_DEFAULT();

                  err =
                      esp_bt_controller_init(&cfg);

                  if (err != ESP_OK) {

                      mp_raise_msg(
                          &mp_type_RuntimeError,
                          MP_ERROR_TEXT(
                              "BT controller init failed"
                          )
                      );
                  }
              }


              if (
                  esp_bt_controller_get_status() !=
                  ESP_BT_CONTROLLER_STATUS_ENABLED
              ) {

                  err =
                      esp_bt_controller_enable(
                          ESP_BT_MODE_CLASSIC_BT
                      );

                  if (err != ESP_OK) {

                      mp_raise_msg(
                          &mp_type_RuntimeError,
                          MP_ERROR_TEXT(
                              "BT controller enable failed"
                          )
                      );
                  }
              }


              // --------------------------------------------------------
              // Bluedroid
              // --------------------------------------------------------

              if (
                  esp_bluedroid_get_status() ==
                  ESP_BLUEDROID_STATUS_UNINITIALIZED
              ) {

                  esp_bluedroid_config_t cfg =
                      BT_BLUEDROID_INIT_CONFIG_DEFAULT();

                  err =
                      esp_bluedroid_init_with_cfg(
                          &cfg
                      );

                  if (err != ESP_OK) {

                      mp_raise_msg(
                          &mp_type_RuntimeError,
                          MP_ERROR_TEXT(
                              "Bluedroid init failed"
                          )
                      );
                  }
              }


              if (
                  esp_bluedroid_get_status() !=
                  ESP_BLUEDROID_STATUS_ENABLED
              ) {

                  err =
                      esp_bluedroid_enable();

                  if (err != ESP_OK) {

                      mp_raise_msg(
                          &mp_type_RuntimeError,
                          MP_ERROR_TEXT(
                              "Bluedroid enable failed"
                          )
                      );
                  }
              }


              // --------------------------------------------------------
              // GAP
              // --------------------------------------------------------

              err =
                  esp_bt_gap_register_callback(
                      bt_gap_callback
                  );

              if (err != ESP_OK) {

                  mp_raise_msg(
                      &mp_type_RuntimeError,
                      MP_ERROR_TEXT(
                          "GAP callback failed"
                      )
                  );
              }


              esp_bt_gap_set_device_name(
                  device_name
              );


              esp_bt_gap_set_scan_mode(
                  ESP_BT_CONNECTABLE,
                  ESP_BT_GENERAL_DISCOVERABLE
              );


              // --------------------------------------------------------
              // SPP
              // --------------------------------------------------------

              err =
                  esp_spp_register_callback(
                      bt_spp_callback
                  );

              if (err != ESP_OK) {

                  mp_raise_msg(
                      &mp_type_RuntimeError,
                      MP_ERROR_TEXT(
                          "SPP callback failed"
                      )
                  );
              }


              esp_spp_cfg_t cfg =
                  BT_SPP_DEFAULT_CONFIG();

              cfg.mode =
                  ESP_SPP_MODE_CB;


              err =
                  esp_spp_enhanced_init(
                      &cfg
                  );

              if (err != ESP_OK) {

                  mp_raise_msg(
                      &mp_type_RuntimeError,
                      MP_ERROR_TEXT(
                          "SPP init failed"
                      )
                  );
              }


              bt_started = true;

              rx_clear();


              return mp_const_none;
          }


          static MP_DEFINE_CONST_FUN_OBJ_VAR_BETWEEN(
              btserial_start_obj,
              1,
              2,
              btserial_start
          );


          // ============================================================
          // connect(mac)
          // ============================================================

          static mp_obj_t btserial_connect(
              mp_obj_t mac_in
          ) {

              if (!bt_started) {

                  mp_raise_msg(
                      &mp_type_RuntimeError,
                      MP_ERROR_TEXT(
                          "call start() first"
                      )
                  );
              }


              mp_buffer_info_t buf;

              mp_get_buffer_raise(
                  mac_in,
                  &buf,
                  MP_BUFFER_READ
              );


              if (buf.len != 6) {

                  mp_raise_ValueError(
                      MP_ERROR_TEXT(
                          "MAC must contain 6 bytes"
                      )
                  );
              }


              memcpy(
                  pending_addr,
                  buf.buf,
                  6
              );


              if (spp_ready) {

                  esp_err_t err =
                      esp_spp_connect(
                          ESP_SPP_SEC_NONE,
                          ESP_SPP_ROLE_MASTER,
                          BT_SERIAL_SCN,
                          pending_addr
                      );

                  if (err != ESP_OK) {

                      mp_raise_msg(
                          &mp_type_RuntimeError,
                          MP_ERROR_TEXT(
                              "SPP connect failed"
                          )
                      );
                  }

              } else {

                  pending_connect = true;
              }


              return mp_const_none;
          }


          static MP_DEFINE_CONST_FUN_OBJ_1(
              btserial_connect_obj,
              btserial_connect
          );


          // ============================================================
          // write(data)
          // ============================================================

          static mp_obj_t btserial_write(
              mp_obj_t data_in
          ) {

              if (!bt_connected) {
                  return MP_OBJ_NEW_SMALL_INT(0);
              }


              mp_buffer_info_t buf;

              mp_get_buffer_raise(
                  data_in,
                  &buf,
                  MP_BUFFER_READ
              );


              if (buf.len == 0) {
                  return MP_OBJ_NEW_SMALL_INT(0);
              }


              esp_err_t err =
                  esp_spp_write(
                      spp_handle,
                      buf.len,
                      (uint8_t *)buf.buf
                  );


              if (err != ESP_OK) {

                  return MP_OBJ_NEW_SMALL_INT(0);
              }


              return MP_OBJ_NEW_SMALL_INT(
                  buf.len
              );
          }


          static MP_DEFINE_CONST_FUN_OBJ_1(
              btserial_write_obj,
              btserial_write
          );


          // ============================================================
          // read([size])
          // ============================================================

          static mp_obj_t btserial_read(
              size_t n_args,
              const mp_obj_t *args
          ) {

              size_t available =
                  rx_available_internal();


              size_t requested =
                  available;


              if (n_args >= 1) {

                  requested =
                      mp_obj_get_int(args[0]);

                  if (
                      requested > available
                  ) {
                      requested = available;
                  }
              }


              if (requested == 0) {

                  return mp_obj_new_bytes(
                      NULL,
                      0
                  );
              }


              vstr_t vstr;

              vstr_init_len(
                  &vstr,
                  requested
              );


              size_t actual =
                  rx_pop(
                      (uint8_t *)vstr.buf,
                      requested
                  );


              return mp_obj_new_bytes(
                  (const byte *)vstr.buf,
                  actual
              );
          }


          static MP_DEFINE_CONST_FUN_OBJ_VAR_BETWEEN(
              btserial_read_obj,
              0,
              1,
              btserial_read
          );


          // ============================================================
          // any()
          // ============================================================

          static mp_obj_t btserial_any(void) {

              return MP_OBJ_NEW_SMALL_INT(
                  rx_available_internal()
              );
          }


          static MP_DEFINE_CONST_FUN_OBJ_0(
              btserial_any_obj,
              btserial_any
          );


          // ============================================================
          // connected()
          // ============================================================

          static mp_obj_t btserial_connected(void) {

              return bt_connected
                  ? mp_const_true
                  : mp_const_false;
          }


          static MP_DEFINE_CONST_FUN_OBJ_0(
              btserial_connected_obj,
              btserial_connected
          );


          // ============================================================
          // mac()
          // ============================================================

          static mp_obj_t btserial_mac(void) {

              const uint8_t *addr =
                  esp_bt_dev_get_address();


              if (addr == NULL) {

                  return mp_obj_new_bytes(
                      NULL,
                      0
                  );
              }


              return mp_obj_new_bytes(
                  addr,
                  6
              );
          }


          static MP_DEFINE_CONST_FUN_OBJ_0(
              btserial_mac_obj,
              btserial_mac
          );


          // ============================================================
          // stop()
          // ============================================================

          static mp_obj_t btserial_stop(void) {

              if (!bt_started) {
                  return mp_const_none;
              }


              if (bt_connected) {

                  esp_spp_disconnect(
                      spp_handle
                  );

                  bt_connected = false;
                  spp_handle = 0;
              }


              esp_spp_deinit();


              if (
                  esp_bluedroid_get_status() ==
                  ESP_BLUEDROID_STATUS_ENABLED
              ) {

                  esp_bluedroid_disable();
              }


              if (
                  esp_bluedroid_get_status() ==
                  ESP_BLUEDROID_STATUS_INITIALIZED
              ) {

                  esp_bluedroid_deinit();
              }


              if (
                  esp_bt_controller_get_status() ==
                  ESP_BT_CONTROLLER_STATUS_ENABLED
              ) {

                  esp_bt_controller_disable();
              }


              if (
                  esp_bt_controller_get_status() ==
                  ESP_BT_CONTROLLER_STATUS_INITED
              ) {

                  esp_bt_controller_deinit();
              }


              bt_started = false;
              spp_ready = false;
              bt_connected = false;

              pending_connect = false;

              spp_handle = 0;

              rx_clear();


              return mp_const_none;
          }


          static MP_DEFINE_CONST_FUN_OBJ_0(
              btserial_stop_obj,
              btserial_stop
          );


          // ============================================================
          // MODULE
          // ============================================================

          static const mp_rom_map_elem_t
          btserial_globals_table[] = {

              {
                  MP_ROM_QSTR(MP_QSTR___name__),
                  MP_ROM_QSTR(MP_QSTR_btserial)
              },

              {
                  MP_ROM_QSTR(MP_QSTR_start),
                  MP_ROM_PTR(
                      &btserial_start_obj
                  )
              },

              {
                  MP_ROM_QSTR(MP_QSTR_connect),
                  MP_ROM_PTR(
                      &btserial_connect_obj
                  )
              },

              {
                  MP_ROM_QSTR(MP_QSTR_write),
                  MP_ROM_PTR(
                      &btserial_write_obj
                  )
              },

              {
                  MP_ROM_QSTR(MP_QSTR_read),
                  MP_ROM_PTR(
                      &btserial_read_obj
                  )
              },

              {
                  MP_ROM_QSTR(MP_QSTR_any),
                  MP_ROM_PTR(
                      &btserial_any_obj
                  )
              },

              {
                  MP_ROM_QSTR(MP_QSTR_connected),
                  MP_ROM_PTR(
                      &btserial_connected_obj
                  )
              },

              {
                  MP_ROM_QSTR(MP_QSTR_mac),
                  MP_ROM_PTR(
                      &btserial_mac_obj
                  )
              },

              {
                  MP_ROM_QSTR(MP_QSTR_stop),
                  MP_ROM_PTR(
                      &btserial_stop_obj
                  )
              },
          };


          static MP_DEFINE_CONST_DICT(
              btserial_globals,
              btserial_globals_table
          );


          const mp_obj_module_t
          btserial_user_cmodule = {

              .base =
                  { &mp_type_module },

              .globals =
                  (mp_obj_dict_t *)&btserial_globals,
          };


          MP_REGISTER_MODULE(
              MP_QSTR_btserial,
              btserial_user_cmodule
          );
          EOF

          echo "=============================================="
          echo "Bluetooth Serial SPP agregado."
          echo "=============================================="


      - name: Aplicar parche en network_wlan.c y Tabla de Particiones Ampliada
        shell: bash
        run: |
          # 1. Crear tabla de particiones personalizada de 4MB con 3.2MB para la App (Factory)
          cat > lib/micropython/ports/esp32/partitions-4mb-custom.csv <<'EOF'
          # Name,   Type, SubType, Offset,  Size, Flags
          nvs,      data, nvs,     0x9000,  0x6000,
          phy_init, data, phy,     0xf000,  0x1000,
          factory,  app,  factory, 0x10000, 0x330000,
          EOF

          # 2. Aplicar parche C en network_wlan.c
          cat > patch.py <<'PY'
          import re
          from pathlib import Path

          path = Path("lib/micropython/ports/esp32/network_wlan.c")

          if not path.exists():
              raise SystemExit(f"ERROR: No se encontró el archivo en {path}")

          text = path.read_text(encoding="utf-8")

          # ============================================================
          # HEADERS
          # ============================================================

          if '#include "shared/netutils/netutils.h"' not in text:
              text = '#include "shared/netutils/netutils.h"\n' + text

          if '#include "esp_wifi_ap_get_sta_list.h"' not in text:
              text = '#include "esp_wifi_ap_get_sta_list.h"\n' + text

          if '#include "esp_netif.h"' not in text:
              text = '#include "esp_netif.h"\n' + text


          # ============================================================
          # STATIONS
          # ============================================================

          patch_code = """        case (uintptr_t)MP_OBJ_NEW_QSTR(MP_QSTR_stations): {
                      // Return list of connected stations with MAC + IPv4.
                      require_if(args[0], ESP_IF_WIFI_AP);

                      wifi_sta_list_t station_list;

                      esp_exceptions(
                          esp_wifi_ap_get_sta_list(&station_list)
                      );

                      wifi_sta_mac_ip_list_t mac_ip_list;

                      esp_exceptions(
                          esp_wifi_ap_get_sta_list_with_ip(
                              &station_list,
                              &mac_ip_list
                          )
                      );

                      mp_obj_t list = mp_obj_new_list(0, NULL);

                      int count = mac_ip_list.num;

                      esp_netif_pair_mac_ip_t *source =
                          (esp_netif_pair_mac_ip_t *)mac_ip_list.sta;

                      for (int i = 0; i < count; ++i) {
                          mp_obj_t tuple_items[2];

                          tuple_items[0] =
                              mp_obj_new_bytes(
                                  source[i].mac,
                                  sizeof(source[i].mac)
                              );

                          tuple_items[1] =
                              source[i].ip.addr != 0
                              ? netutils_format_ipv4_addr(
                                  (uint8_t *)(&source[i].ip),
                                  NETUTILS_BIG
                              )
                              : mp_const_none;

                          mp_obj_list_append(
                              list,
                              mp_obj_new_tuple(2, tuple_items)
                          );
                      }

                      return list;
                  }"""

          pattern = re.compile(
              r'case\s+\(uintptr_t\)MP_OBJ_NEW_QSTR\(MP_QSTR_stations\):.*?(?=\s*case\s+\(uintptr_t\)MP_OBJ_NEW_QSTR\(MP_QSTR_rssi\):)',
              re.DOTALL
          )

          new_text, count = pattern.subn(
              patch_code + "\n",
              text
          )

          if count == 0:
              raise SystemExit(
                  "ERROR: No se pudo reemplazar la sección MP_QSTR_stations."
              )

          text = new_text


          # ============================================================
          # FUNCIONES NUEVAS
          # ============================================================

          new_functions = r'''

          // ============================================================
          // SoftAP / WiFi advanced control
          // ESP-IDF 5.x compatible
          // ============================================================


          // ------------------------------------------------------------
          // Helpers
          // ------------------------------------------------------------

          static esp_netif_t *network_wlan_get_ap_netif(void) {
              esp_netif_t *netif =
                  esp_netif_get_handle_from_ifkey("WIFI_AP_DEF");

              if (netif == NULL) {
                  mp_raise_msg(
                      &mp_type_RuntimeError,
                      MP_ERROR_TEXT("AP netif not available")
                  );
              }

              return netif;
          }


          static void network_wlan_check_mac(
              mp_obj_t mac_in,
              mp_buffer_info_t *bufinfo
          ) {
              mp_get_buffer_raise(
                  mac_in,
                  bufinfo,
                  MP_BUFFER_READ
              );

              if (bufinfo->len != 6) {
                  mp_raise_ValueError(
                      MP_ERROR_TEXT("MAC must be 6 bytes")
                  );
              }
          }


          // ============================================================
          // 1. dhcp_status()
          // ============================================================

          static mp_obj_t network_wlan_dhcp_status(
              mp_obj_t self_in
          ) {
              require_if(self_in, ESP_IF_WIFI_AP);

              esp_netif_t *netif =
                  network_wlan_get_ap_netif();

              esp_netif_dhcp_status_t status;

              esp_exceptions(
                  esp_netif_dhcps_get_status(
                      netif,
                      &status
                  )
              );

              return MP_OBJ_NEW_SMALL_INT(
                  status
              );
          }

          static MP_DEFINE_CONST_FUN_OBJ_1(
              network_wlan_dhcp_status_obj,
              network_wlan_dhcp_status
          );


          // ============================================================
          // 2. dhcp_restart()
          // ============================================================

          static mp_obj_t network_wlan_dhcp_restart(
              mp_obj_t self_in
          ) {
              require_if(self_in, ESP_IF_WIFI_AP);

              esp_netif_t *netif =
                  network_wlan_get_ap_netif();

              esp_netif_dhcp_status_t status;

              esp_exceptions(
                  esp_netif_dhcps_get_status(
                      netif,
                      &status
                  )
              );

              if (status == ESP_NETIF_DHCP_STARTED) {
                  esp_exceptions(
                      esp_netif_dhcps_stop(netif)
                  );
              }

              esp_exceptions(
                  esp_netif_dhcps_start(netif)
              );

              return mp_const_none;
          }

          static MP_DEFINE_CONST_FUN_OBJ_1(
              network_wlan_dhcp_restart_obj,
              network_wlan_dhcp_restart
          );


          // ============================================================
          // 3. dhcp_start()
          // ============================================================

          static mp_obj_t network_wlan_dhcp_start(
              mp_obj_t self_in
          ) {
              require_if(self_in, ESP_IF_WIFI_AP);

              esp_netif_t *netif =
                  network_wlan_get_ap_netif();

              esp_exceptions(
                  esp_netif_dhcps_start(netif)
              );

              return mp_const_none;
          }

          static MP_DEFINE_CONST_FUN_OBJ_1(
              network_wlan_dhcp_start_obj,
              network_wlan_dhcp_start
          );


          // ============================================================
          // 4. dhcp_stop()
          // ============================================================

          static mp_obj_t network_wlan_dhcp_stop(
              mp_obj_t self_in
          ) {
              require_if(self_in, ESP_IF_WIFI_AP);

              esp_netif_t *netif =
                  network_wlan_get_ap_netif();

              esp_exceptions(
                  esp_netif_dhcps_stop(netif)
              );

              return mp_const_none;
          }

          static MP_DEFINE_CONST_FUN_OBJ_1(
              network_wlan_dhcp_stop_obj,
              network_wlan_dhcp_stop
          );


          // ============================================================
          // 5. get_sta_list()
          //
          // Return:
          // [
          //   b"MAC",
          //   ...
          // ]
          // ============================================================

          static mp_obj_t network_wlan_get_sta_list(
              mp_obj_t self_in
          ) {
              require_if(self_in, ESP_IF_WIFI_AP);

              wifi_sta_list_t station_list;

              esp_exceptions(
                  esp_wifi_ap_get_sta_list(
                      &station_list
                  )
              );

              mp_obj_t list =
                  mp_obj_new_list(0, NULL);

              for (int i = 0;
                   i < station_list.num;
                   ++i) {

                  mp_obj_list_append(
                      list,
                      mp_obj_new_bytes(
                          station_list.sta[i].mac,
                          6
                      )
                  );
              }

              return list;
          }

          static MP_DEFINE_CONST_FUN_OBJ_1(
              network_wlan_get_sta_list_obj,
              network_wlan_get_sta_list
          );


          // ============================================================
          // 6. get_aid(mac)
          //
          // Return:
          // AID integer
          // ============================================================

          static mp_obj_t network_wlan_get_aid(
              mp_obj_t self_in,
              mp_obj_t mac_in
          ) {
              require_if(self_in, ESP_IF_WIFI_AP);

              mp_buffer_info_t bufinfo;

              network_wlan_check_mac(
                  mac_in,
                  &bufinfo
              );

              uint16_t aid = 0;

              esp_exceptions(
                  esp_wifi_ap_get_sta_aid(
                      (const uint8_t *)bufinfo.buf,
                      &aid
                  )
              );

              return MP_OBJ_NEW_SMALL_INT(
                  aid
              );
          }

          static MP_DEFINE_CONST_FUN_OBJ_2(
              network_wlan_get_aid_obj,
              network_wlan_get_aid
          );


          // ============================================================
          // 7. get_sta_info(mac)
          //
          // Return:
          // (
          //   MAC,
          //   RSSI,
          //   AID,
          //   phy_11b,
          //   phy_11g,
          //   phy_11n,
          //   phy_lr
          // )
          // ============================================================

          static mp_obj_t network_wlan_get_sta_info(
              mp_obj_t self_in,
              mp_obj_t mac_in
          ) {
              require_if(self_in, ESP_IF_WIFI_AP);

              mp_buffer_info_t bufinfo;

              network_wlan_check_mac(
                  mac_in,
                  &bufinfo
              );

              wifi_sta_list_t station_list;

              esp_exceptions(
                  esp_wifi_ap_get_sta_list(
                      &station_list
                  )
              );

              for (int i = 0;
                   i < station_list.num;
                   ++i) {

                  wifi_sta_info_t *sta =
                      &station_list.sta[i];

                  if (memcmp(
                          sta->mac,
                          bufinfo.buf,
                          6
                      ) == 0) {

                      uint16_t aid = 0;

                      esp_exceptions(
                          esp_wifi_ap_get_sta_aid(
                              sta->mac,
                              &aid
                          )
                      );

                      mp_obj_t items[7];

                      items[0] =
                          mp_obj_new_bytes(
                              sta->mac,
                              6
                          );

                      items[1] =
                          MP_OBJ_NEW_SMALL_INT(
                              sta->rssi
                          );

                      items[2] =
                          MP_OBJ_NEW_SMALL_INT(
                              aid
                          );

                      items[3] =
                          MP_OBJ_NEW_SMALL_INT(
                              sta->phy_11b != 0
                          );

                      items[4] =
                          MP_OBJ_NEW_SMALL_INT(
                              sta->phy_11g != 0
                          );

                      items[5] =
                          MP_OBJ_NEW_SMALL_INT(
                              sta->phy_11n != 0
                          );

                      items[6] =
                          MP_OBJ_NEW_SMALL_INT(
                              sta->phy_lr != 0
                          );

                      return mp_obj_new_tuple(
                          7,
                          items
                      );
                  }
              }

              return mp_const_none;
          }

          static MP_DEFINE_CONST_FUN_OBJ_2(
              network_wlan_get_sta_info_obj,
              network_wlan_get_sta_info
          );


          // ============================================================
          // 8. dhcp_ip(mac)
          //
          // Return:
          // "192.168.4.X"
          //
          // None if DHCP has no IP for that MAC.
          // ============================================================

          static mp_obj_t network_wlan_dhcp_ip(
              mp_obj_t self_in,
              mp_obj_t mac_in
          ) {
              require_if(self_in, ESP_IF_WIFI_AP);

              mp_buffer_info_t bufinfo;

              network_wlan_check_mac(
                  mac_in,
                  &bufinfo
              );

              esp_netif_t *netif =
                  network_wlan_get_ap_netif();

              esp_netif_pair_mac_ip_t pair;

              memset(
                  &pair,
                  0,
                  sizeof(pair)
              );

              memcpy(
                  pair.mac,
                  bufinfo.buf,
                  6
              );

              esp_err_t err =
                  esp_netif_dhcps_get_clients_by_mac(
                      netif,
                      1,
                      &pair
                  );

              if (err != ESP_OK) {
                  return mp_const_none;
              }

              if (pair.ip.addr == 0) {
                  return mp_const_none;
              }

              return netutils_format_ipv4_addr(
                  (uint8_t *)&pair.ip,
                  NETUTILS_BIG
              );
          }

          static MP_DEFINE_CONST_FUN_OBJ_2(
              network_wlan_dhcp_ip_obj,
              network_wlan_dhcp_ip
          );


          // ============================================================
          // 9. deauth(mac)
          // ============================================================

          static mp_obj_t network_wlan_deauth(
              mp_obj_t self_in,
              mp_obj_t mac_in
          ) {
              require_if(self_in, ESP_IF_WIFI_AP);

              mp_buffer_info_t bufinfo;

              network_wlan_check_mac(
                  mac_in,
                  &bufinfo
              );

              uint16_t aid = 0;

              esp_exceptions(
                  esp_wifi_ap_get_sta_aid(
                      (const uint8_t *)bufinfo.buf,
                      &aid
                  )
              );

              esp_exceptions(
                  esp_wifi_deauth_sta(
                      aid
                  )
              );

              return mp_const_none;
          }

          static MP_DEFINE_CONST_FUN_OBJ_2(
              network_wlan_deauth_obj,
              network_wlan_deauth
          );


          // ============================================================
          // 10. deauth_aid(aid)
          // ============================================================

          static mp_obj_t network_wlan_deauth_aid(
              mp_obj_t self_in,
              mp_obj_t aid_in
          ) {
              require_if(self_in, ESP_IF_WIFI_AP);

              uint16_t aid =
                  mp_obj_get_int(aid_in);

              if (aid == 0) {
                  mp_raise_ValueError(
                      MP_ERROR_TEXT(
                          "AID 0 is reserved for deauth_all()"
                      )
                  );
              }

              esp_exceptions(
                  esp_wifi_deauth_sta(
                      aid
                  )
              );

              return mp_const_none;
          }

          static MP_DEFINE_CONST_FUN_OBJ_2(
              network_wlan_deauth_aid_obj,
              network_wlan_deauth_aid
          );


          // ============================================================
          // 11. deauth_all()
          // ============================================================

          static mp_obj_t network_wlan_deauth_all(
              mp_obj_t self_in
          ) {
              require_if(self_in, ESP_IF_WIFI_AP);

              esp_exceptions(
                  esp_wifi_deauth_sta(0)
              );

              return mp_const_none;
          }

          static MP_DEFINE_CONST_FUN_OBJ_1(
              network_wlan_deauth_all_obj,
              network_wlan_deauth_all
          );


          // ============================================================
          // 12. get_inactive_time()
          // ============================================================

          static mp_obj_t network_wlan_get_inactive_time(
              mp_obj_t self_in
          ) {
              require_if(self_in, ESP_IF_WIFI_AP);

              uint16_t seconds = 0;

              esp_exceptions(
                  esp_wifi_get_inactive_time(
                      WIFI_IF_AP,
                      &seconds
                  )
              );

              return MP_OBJ_NEW_SMALL_INT(
                  seconds
              );
          }

          static MP_DEFINE_CONST_FUN_OBJ_1(
              network_wlan_get_inactive_time_obj,
              network_wlan_get_inactive_time
          );


          // ============================================================
          // 13. set_inactive_time(seconds)
          // ============================================================

          static mp_obj_t network_wlan_set_inactive_time(
              mp_obj_t self_in,
              mp_obj_t seconds_in
          ) {
              require_if(self_in, ESP_IF_WIFI_AP);

              uint16_t seconds =
                  mp_obj_get_int(seconds_in);

              if (seconds < 10) {
                  mp_raise_ValueError(
                      MP_ERROR_TEXT(
                          "AP inactive time minimum is 10 seconds"
                      )
                  );
              }

              esp_exceptions(
                  esp_wifi_set_inactive_time(
                      WIFI_IF_AP,
                      seconds
                  )
              );

              return mp_const_none;
          }

          static MP_DEFINE_CONST_FUN_OBJ_2(
              network_wlan_set_inactive_time_obj,
              network_wlan_set_inactive_time
          );


          // ============================================================
          // 14. get_ap_info()
          //
          // Return:
          // (
          //   SSID,
          //   password,
          //   channel,
          //   max_connections,
          //   authmode
          // )
          // ============================================================

          static mp_obj_t network_wlan_get_ap_info(
              mp_obj_t self_in
          ) {
              require_if(self_in, ESP_IF_WIFI_AP);

              wifi_config_t config;

              memset(
                  &config,
                  0,
                  sizeof(config)
              );

              esp_exceptions(
                  esp_wifi_get_config(
                      WIFI_IF_AP,
                      &config
                  )
              );

              mp_obj_t items[5];

              items[0] =
                  mp_obj_new_bytes(
                      config.ap.ssid,
                      strlen((char *)config.ap.ssid)
                  );

              items[1] =
                  mp_obj_new_bytes(
                      config.ap.password,
                      strlen((char *)config.ap.password)
                  );

              items[2] =
                  MP_OBJ_NEW_SMALL_INT(
                      config.ap.channel
                  );

              items[3] =
                  MP_OBJ_NEW_SMALL_INT(
                      config.ap.max_connection
                  );

              items[4] =
                  MP_OBJ_NEW_SMALL_INT(
                      config.ap.authmode
                  );

              return mp_obj_new_tuple(
                  5,
                  items
              );
          }

          static MP_DEFINE_CONST_FUN_OBJ_1(
              network_wlan_get_ap_info_obj,
              network_wlan_get_ap_info
          );


          // ============================================================
          // 15. wifi_stats()
          //
          // Dumps WiFi driver statistics to the ESP console.
          // ============================================================

          static mp_obj_t network_wlan_wifi_stats(
              mp_obj_t self_in
          ) {
              require_if(self_in, ESP_IF_WIFI_AP);

              esp_exceptions(
                  esp_wifi_statis_dump(
                      0xFFFFFFFF
                  )
              );

              return mp_const_none;
          }

          static MP_DEFINE_CONST_FUN_OBJ_1(
              network_wlan_wifi_stats_obj,
              network_wlan_wifi_stats
          );

