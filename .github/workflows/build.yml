name: Compilar LVGL MicroPython - CYD ST7789 + IP de clientes WiFi

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Clonar LVGL MicroPython
        run: |
          git clone --recursive https://github.com/lvgl-micropython/lvgl_micropython.git .

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            libusb-1.0-0-dev

      - name: Parchear MicroPython para obtener IP de clientes AP
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("lib/micropython/ports/esp32/network_wlan.c")

          if not path.exists():
              print("ERROR: no existe:")
              print(path)
              raise SystemExit(1)

          text = path.read_text()

          print("Archivo encontrado:", path)

          # ---------------------------------------------------------
          # 1. Asegurar include de esp_wifi_ap_get_sta_list.h
          # ---------------------------------------------------------
          include_line = '#include "esp_wifi_ap_get_sta_list.h"'

          if include_line not in text:
              marker = '#include "esp_wifi.h"'

              if marker not in text:
                  print("ERROR: no se encontró #include \"esp_wifi.h\"")
                  raise SystemExit(1)

              text = text.replace(
                  marker,
                  marker + "\n" + include_line,
                  1
              )

              print("Añadido include de esp_wifi_ap_get_sta_list.h")
          else:
              print("El include ya existe")

          # ---------------------------------------------------------
          # 2. Buscar el case de "stations"
          # ---------------------------------------------------------
          start_marker = (
              '        case (uintptr_t)MP_OBJ_NEW_QSTR('
              'MP_QSTR_stations): {'
          )

          rssi_marker = (
              '        case (uintptr_t)MP_OBJ_NEW_QSTR('
              'MP_QSTR_rssi): {'
          )

          if start_marker not in text:
              print("ERROR: no se encontró el case de MP_QSTR_stations")
              raise SystemExit(1)

          if rssi_marker not in text:
              print("ERROR: no se encontró el case de MP_QSTR_rssi")
              raise SystemExit(1)

          start = text.index(start_marker)
          end = text.index(rssi_marker, start)

          # Si ya contiene el código moderno, no hacemos nada.
          old_block = text[start:end]

          if "esp_wifi_ap_get_sta_list_with_ip" in old_block:
              print("El soporte de IP ya existe. No hace falta parchear.")
          else:
              new_block = r'''        case (uintptr_t)MP_OBJ_NEW_QSTR(MP_QSTR_stations): {
              // return list of connected stations, only if in soft-AP mode
              require_if(args[0], ESP_IF_WIFI_AP);

              wifi_sta_list_t station_list;
              esp_exceptions(esp_wifi_ap_get_sta_list(&station_list));

              wifi_sta_mac_ip_list_t mac_ip_list;
              esp_exceptions(
                  esp_wifi_ap_get_sta_list_with_ip(
                      &station_list,
                      &mac_ip_list
                  )
              );

              mp_obj_t list = mp_obj_new_list(0, NULL);

              int count = mac_ip_list.num;
              esp_netif_pair_mac_ip_t *source =
                  (esp_netif_pair_mac_ip_t *)mac_ip_list.sta;

              for (int i = 0; i < count; ++i) {
                  mp_obj_tuple_t *t = mp_obj_new_tuple(2, NULL);

                  t->items[0] = mp_obj_new_bytes(
                      source[i].mac,
                      sizeof(source[i].mac)
                  );

                  t->items[1] =
                      source[i].ip.addr != 0
                          ? netutils_format_ipv4_addr(
                                (uint8_t *)(&source[i].ip),
                                NETUTILS_BIG
                            )
                          : mp_const_none;

                  mp_obj_list_append(list, t);
              }

              return list;
          }
  '''

              text = text[:start] + new_block + text[end:]

              print("Case de stations parcheado correctamente")

          path.write_text(text)

          # ---------------------------------------------------------
          # 3. Mostrar una comprobación útil
          # ---------------------------------------------------------
          text2 = path.read_text()

          print()
          print("Comprobación:")
          print(
              "esp_wifi_ap_get_sta_list_with_ip"
              in text2
          )

          if "esp_wifi_ap_get_sta_list_with_ip" not in text2:
              print("ERROR: el parche no quedó aplicado")
              raise SystemExit(1)

          print("Parche terminado correctamente.")
          PY

      - name: Compilar firmware ESP32
        id: compile
        run: |
          set -o pipefail

          python3 make.py esp32 \
            BOARD=ESP32_GENERIC \
            DISPLAY=st7789 \
            INDEV=xpt2046 \
            --flash-size=4 \
            --optimize-size \
            --ccache \
            LV_CFLAGS="-DLV_USE_IMAGE=1" \
            2>&1 | tee build.log

      - name: Preparar firmware final
        if: success()
        run: |
          BUILD_DIR="lib/micropython/ports/esp32/build-ESP32_GENERIC"

          mkdir -p final_firmware

          if [ -f "$BUILD_DIR/firmware.bin" ]; then
            cp "$BUILD_DIR/firmware.bin" final_firmware/firmware.bin
          fi

          if [ -f "$BUILD_DIR/micropython.bin" ]; then
            cp "$BUILD_DIR/micropython.bin" final_firmware/micropython.bin
          fi

          if [ -f "$BUILD_DIR/bootloader/bootloader.bin" ]; then
            cp "$BUILD_DIR/bootloader/bootloader.bin" final_firmware/bootloader.bin
          fi

          if [ -f "$BUILD_DIR/partition_table/partition-table.bin" ]; then
            cp "$BUILD_DIR/partition_table/partition-table.bin" final_firmware/partition-table.bin
          fi

          echo "Firmware generado:"
          ls -lh final_firmware/

      - name: Subir Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-cyd-st7789
          path: final_firmware/

      - name: Subir Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            lib/micropython/ports/esp32/build-ESP32_GENERIC/log/
          if-no-files-found: warn
