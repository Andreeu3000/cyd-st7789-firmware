name: Compilar LVGL MicroPython - CYD ST7789 + IP clientes

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Clonar LVGL MicroPython
        run: |
          git clone --recursive https://github.com/lvgl-micropython/lvgl_micropython.git .

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            libusb-1.0-0-dev

      - name: Parchear network_wlan.c
        run: |
          python3 -c "
          from pathlib import Path

          p = Path('lib/micropython/ports/esp32/network_wlan.c')
          s = p.read_text()

          include = '#include \\"esp_wifi_ap_get_sta_list.h\\"'

          if include not in s:
              marker = '#include \\"esp_wifi.h\\"'
              if marker not in s:
                  raise SystemExit('No se encontró esp_wifi.h')
              s = s.replace(marker, marker + '\\n' + include, 1)

          marker = '        case (uintptr_t)MP_OBJ_NEW_QSTR(MP_QSTR_rssi): {'

          if marker not in s:
              raise SystemExit('No se encontró el case de rssi')

          if 'esp_wifi_ap_get_sta_list_with_ip' not in s:

              code = (
                  '        case (uintptr_t)MP_OBJ_NEW_QSTR(MP_QSTR_stations_ip): {\\n'
                  '            require_if(args[0], ESP_IF_WIFI_AP);\\n'
                  '\\n'
                  '            wifi_sta_list_t station_list = {0};\\n'
                  '            wifi_sta_mac_ip_list_t ip_list = {0};\\n'
                  '\\n'
                  '            esp_exceptions(\\n'
                  '                esp_wifi_ap_get_sta_list(&station_list)\\n'
                  '            );\\n'
                  '\\n'
                  '            esp_exceptions(\\n'
                  '                esp_wifi_ap_get_sta_list_with_ip(\\n'
                  '                    &station_list,\\n'
                  '                    &ip_list\\n'
                  '                )\\n'
                  '            );\\n'
                  '\\n'
                  '            mp_obj_t list = mp_obj_new_list(0, NULL);\\n'
                  '\\n'
                  '            for (int i = 0; i < ip_list.num; ++i) {\\n'
                  '                char ip[16];\\n'
                  '\\n'
                  '                snprintf(\\n'
                  '                    ip,\\n'
                  '                    sizeof(ip),\\n'
                  '                    \\"%u.%u.%u.%u\\",\\n'
                  '                    ip_list.sta[i].ip.addr & 0xff,\\n'
                  '                    (ip_list.sta[i].ip.addr >> 8) & 0xff,\\n'
                  '                    (ip_list.sta[i].ip.addr >> 16) & 0xff,\\n'
                  '                    (ip_list.sta[i].ip.addr >> 24) & 0xff\\n'
                  '                );\\n'
                  '\\n'
                  '                mp_obj_t tuple[2];\\n'
                  '\\n'
                  '                tuple[0] = mp_obj_new_bytes(\\n'
                  '                    ip_list.sta[i].mac,\\n'
                  '                    6\\n'
                  '                );\\n'
                  '\\n'
                  '                tuple[1] = mp_obj_new_str(\\n'
                  '                    ip,\\n'
                  '                    strlen(ip)\\n'
                  '                );\\n'
                  '\\n'
                  '                mp_obj_list_append(\\n'
                  '                    list,\\n'
                  '                    mp_obj_new_tuple(2, tuple)\\n'
                  '                );\\n'
                  '            }\\n'
                  '\\n'
                  '            return list;\\n'
                  '        }\\n'
              )

              s = s.replace(marker, code + marker, 1)

          p.write_text(s)

          print('Parche aplicado correctamente')
          print('stations_ip:', 'esp_wifi_ap_get_sta_list_with_ip' in s)
          "

      - name: Compilar firmware ESP32
        id: compile
        run: |
          set -o pipefail

          python3 make.py esp32 \
            BOARD=ESP32_GENERIC \
            DISPLAY=st7789 \
            INDEV=xpt2046 \
            --flash-size=4 \
            --optimize-size \
            --ccache \
            LV_CFLAGS="-DLV_USE_IMAGE=1" \
            2>&1 | tee build.log

      - name: Preparar firmware final
        if: success()
        run: |
          BUILD_DIR="lib/micropython/ports/esp32/build-ESP32_GENERIC"

          mkdir -p final_firmware

          if [ -f "$BUILD_DIR/firmware.bin" ]; then
            cp "$BUILD_DIR/firmware.bin" final_firmware/firmware.bin
          fi

          if [ -f "$BUILD_DIR/micropython.bin" ]; then
            cp "$BUILD_DIR/micropython.bin" final_firmware/micropython.bin
          fi

          if [ -f "$BUILD_DIR/bootloader/bootloader.bin" ]; then
            cp "$BUILD_DIR/bootloader/bootloader.bin" final_firmware/bootloader.bin
          fi

          if [ -f "$BUILD_DIR/partition_table/partition-table.bin" ]; then
            cp "$BUILD_DIR/partition_table/partition-table.bin" final_firmware/partition-table.bin
          fi

          ls -lh final_firmware/

      - name: Subir Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-cyd-st7789
          path: final_firmware/

      - name: Subir Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            lib/micropython/ports/esp32/build-ESP32_GENERIC/log/
          if-no-files-found: warn
